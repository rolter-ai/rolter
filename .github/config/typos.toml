# typos (crate-ci/typos) configuration for the GitHub Actions quality gate. the spans below are real words or
# intentional test fixtures the default dictionary flags as misspellings; each
# regex ignores just that literal rather than globally redefining a word.
[default]
extend-ignore-re = [
  # "HashiCorp" (Vault) in the security docs
  "HashiCorp",
  # "mis-enforce" in comments about skipping unknown scopes
  "mis-enforce",
  # "emial": a deliberately-typo'd guardrail rule name in the route-override
  # tests, which assert that a name no rule defines is reported rather than
  # silently ignored. correcting it would delete the test's subject
  "emial",
  # "sk-abd": a deliberately-wrong virtual key in the auth verify tests
  "sk-abd",
  # "menbers"/"moduls": deliberately-misspelled field names in the crud
  # deny-unknown-fields tests (#940), which assert a body carrying a field no
  # struct declares is rejected. correcting them would delete the test's subject
  "\"menbers\"",
  "\"moduls\"",
  # "abc"/"abd": trie test fixtures exercising shared-prefix node counting
  "\"abd\"",
  # canonical W3C traceparent / B3 example ids in the trace tests: hex spans the
  # dictionary reads as words (e.g. "ba" inside a span/trace id)
  "00f067aa0ba902b7",
  "80f198ee56343ba864fe8b2a57d3eff7",
  # "Hel": the first half of "Hello" split across two SSE frames in the gemini
  # interactions streaming test, which exists to prove a token can straddle
  # frame boundaries. completing the word would delete the test's subject
  '\\"Hel\\"',
  # DER-encoded local TLS certificates in proxy integration tests: base64 spans
  # happen to form dictionary words.
  "0jAer87tnJgSEHH",
  "QYMBaAFKpTnXjkmXVb",
  "QYMBaAFD7y986Rvr1e",
  "UVkOtC6gn12Y",
  # the dogfooding fleet's fake keys (#924): random hex the dictionary reads as
  # words (e.g. "ba" inside "3ba8d7"). they authenticate against a script on
  # loopback and are checked in so the fleet is reproducible
  "vllm-local-3ba8d7",
  # "temperture": the misspelt param in the ParamsEditor story that asserts an
  # unrecognised key is warned about and still saved. correcting it would
  # delete the story's subject
  "temperture",
  # "fo": RFC 4648 section 10 gives the base32 vectors as "", "f", "fo", "foo",
  # ... — the empty-to-six-byte progression that pins the padding rules. the
  # dictionary reads the third one as a typo for "of"; correcting it would
  # delete the vector
  '"fo"',
  # deliberately-misspelled config keys in the `rolter check` unknown-key
  # fixtures (#1424) and in the docs that show its output. every one of them is
  # the subject of a test asserting the typo is reported with the real key
  # suggested — correcting them would delete what the tests check
  "api_key_evn",
  "connect_timout_ms",
  "wieght",
  "defualt",
  # "nam": a truncated `name` in the suggestion-distance test, which pins that a
  # three-letter key still gets its obvious match
  "\"nam\"",
  # SigNoz's own dashboard schema misspells this field. the provisioned
  # dashboards (#956) are parsed by SigNoz, not by us — correcting the spelling
  # would make the import silently drop the setting
  "timePreferance",
]

[files]
# vendored upstream build artifact (the mermaid runtime the mdbook build ships
# so the docs render air-gapped). minified identifier soup, not our prose.
extend-exclude = ["docs/mermaid.min.js"]
