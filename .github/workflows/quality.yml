name: quality

# reusable quality/security gate. run standalone from ci.yml on every push/pr
# and via workflow_call from the release paths so nothing publishes on a commit
# whose tests, lint or supply-chain check has not passed.
#
# most development in this repo is done by AI agents, so CI is the strongest
# reviewer: many independent checks. jobs are split so a failure points at one
# concern. ci.yml aggregates every job here (plus pr-title) into a single
# `ci-ok` check for branch protection. some newer/heavier checks run as
# informational (continue-on-error) until their baseline is trusted, then get
# promoted to blocking — see ROL-124.
on:
  # takes no secrets: every job here scans the checked-out source with pinned
  # public tooling, so the gate behaves identically on dependabot and fork PRs,
  # which receive no secrets at all (#734)
  workflow_call:

# least-privilege GITHUB_TOKEN: every job here only reads the checked-out repo.
# a reusable workflow cannot exceed the caller's grant, but declaring it here
# keeps the default scope tight and satisfies the CodeQL actions query.
permissions:
  contents: read

# faster linking on the linux runner: ./.github/actions/wild-linker restores the
# wild binary from the actions cache and writes ~/.cargo/config.toml to use it
# for *-unknown-linux-{gnu,musl}. only the jobs that actually link install it —
# clippy, cargo hack and rustdoc emit metadata and never invoke the linker.

jobs:
  # ── rust: format + lint ─────────────────────────────────────────────────────
  fmt-clippy:
    name: fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # rolter-control as well as rolter-store: most of the postgres-gated code
      # (crud, sso, scim, the policy modules) lives in control, and linting only
      # the store left all of it unchecked under the feature it is written for
      - name: clippy (postgres feature)
        run: |
          cargo clippy -p rolter-store -p rolter-control --all-targets --features postgres -- -D warnings

  # ── rust: tests ─────────────────────────────────────────────────────────────
  # nextest for the unit/integration tests (per-test isolation, faster) plus an
  # explicit doc-test pass since nextest does not run doc tests.
  test:
    name: nextest / doctests
    runs-on: ubuntu-latest
    # a real postgres so the store + control-plane integration tests actually
    # run (they self-skip when ROLTER_TEST_DATABASE_URL is unset) rather than
    # passing as silent no-ops
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rolter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROLTER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rolter_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/wild-linker
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: nextest
      - name: nextest (workspace, all features)
        run: cargo nextest run --workspace --all-features
      - name: doc tests
        run: cargo test --doc --workspace --all-features

  # ── rust: non-default feature builds ────────────────────────────────────────
  # agents frequently break builds behind a cargo feature; check each in turn.
  feature-matrix:
    name: feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-hack
      - name: cargo hack (each feature)
        run: cargo hack check --each-feature --workspace --all-targets
      # --each-feature only ever turns on a package's *own* features, so it
      # never builds a dependent against a dependency feature it does not
      # itself enable. that gap let `rolter` stop compiling whenever
      # `rolter-control/postgres` was on without `rolter/postgres` (#1295).
      - name: cross-crate feature combination (dependency postgres only)
        run: cargo check --workspace --all-targets --features rolter-store/postgres,rolter-control/postgres

  # ── rust: doc warnings ──────────────────────────────────────────────────────
  # broken intra-doc links / invalid rustdoc are common agent mistakes.
  docs:
    name: cargo doc (warnings = errors)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features

  # ── supply chain: advisories / bans / licenses / sources ────────────────────
  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo-deny (advisories, bans, licenses, sources)
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny --all-features --config .config/deny.toml check

  # ── supply chain: secret scanning ───────────────────────────────────────────
  # agents must never leak a provider key; fail the build if one is committed.
  # runs the gitleaks CLI, not gitleaks-action: the action gates org-owned repos
  # behind a license key, and license secrets are invisible to dependabot runs
  # (separate secret store) and to fork PRs (no secrets at all), so every such
  # PR failed this job and therefore ci-ok. the CLI is free and unrestricted.
  # the image digest is v8.30.1, the same version prek.toml pins for the staged
  # hook, so local and CI scan with one binary and one policy. see #734.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # working tree: everything the commit actually ships
      - name: gitleaks (working tree)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            dir . --config .github/config/gitleaks.toml --redact --exit-code 1
      # history for this branch: catches a secret added and then removed within
      # the same PR, which a working-tree scan cannot see
      - name: gitleaks (branch history)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # the container runs as root over a runner-owned checkout, which git
          # rejects as dubious ownership unless /repo is marked safe
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" \
            git . --config .github/config/gitleaks.toml --redact --exit-code 1 \
            --log-opts "$BASE_SHA..$HEAD_SHA"

  # ── storage: migrations are append-only ─────────────────────────────────────
  # sqlx checksums every applied migration, so editing a shipped file breaks
  # every existing deployment on its next upgrade — and nothing else catches it,
  # because CI databases always start empty. see #710 / #724.
  migrations-immutable:
    name: migrations append-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the check diffs against origin/master, so it needs real history
          fetch-depth: 0
      - name: check migrations are append-only
        env:
          CI: "true"
        run: bash scripts/check-migrations-immutable.sh origin/master

  # ── release handoff: release-plz must still dispatch release.yml ────────────
  # a token-created tag does not fire `push: tags`, so the dispatch in
  # release-plz.yml is the only thing that starts wheel/pypi publishing. losing
  # it fails silently — releases keep shipping, just without a wheel (#903).
  release-handoff:
    name: release handoff wired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check the release handoff is wired
        run: bash scripts/check-release-handoff.sh

  # ── helm chart: lint and render ─────────────────────────────────────────────
  # the chart carries the same pre-boot validation the CLI does (#854), and a
  # chart is the one deployment path with no compiler behind it: a template that
  # renders to malformed YAML fails at `helm install`, on someone's cluster,
  # rather than here. render every branch the preflight initContainer has.
  helm-chart:
    name: helm chart
    runs-on: ubuntu-latest
    # `shell: bash` for pipefail: without it a failing `helm template` on the
    # left of the pipe is masked by the checker exiting 0 on empty input
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # appVersion is what an operator reads to know which rolter a release
      # deploys. nothing updated it, so it drifted three releases behind the
      # workspace before anyone noticed (#1140)
      - name: chart appVersion tracks the workspace version
        run: python3 scripts/sync-chart-appversion.py
      - name: lint
        run: helm lint charts/rolter
      # every render is parsed with a strict YAML loader rather than discarded:
      # helm's own loader tolerates a duplicate mapping key, kubectl's
      # server-side apply and the GitOps controllers do not, and a duplicate
      # `env:` sat in both deployment templates unnoticed until #1090
      - name: render defaults
        run: helm template ci charts/rolter | uv run --with pyyaml scripts/check-rendered-manifests.py
      - name: render with preflight disabled
        run: |
          helm template ci charts/rolter --set preflight.enabled=false \
            | uv run --with pyyaml scripts/check-rendered-manifests.py
      - name: render with every preflight option on
        run: |
          helm template ci charts/rolter \
            --set preflight.connect=true \
            --set env.databaseUrl=postgres://u:p@db:5432/rolter \
            --set 'secretEnv[0].name=ROLTER_KEK' \
            --set 'secretEnv[0].valueFrom.secretKeyRef.name=rolter' \
            --set 'secretEnv[0].valueFrom.secretKeyRef.key=kek' \
            | uv run --with pyyaml scripts/check-rendered-manifests.py

  # ── workflow lint: validate the CI yaml itself ──────────────────────────────
  # agents edit workflows too; catch syntax and shell smells early.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  # ── workflow security: zizmor static analysis ───────────────────────────────
  # catches workflow security smells (unpinned actions, template injection in
  # run:, over-broad GITHUB_TOKEN). informational for now; promote to blocking
  # once the baseline is clean.
  zizmor:
    name: zizmor (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: zizmor
        run: uvx zizmor@1.26.1 --min-severity=medium --persona=regular .github/workflows/ .github/actions/
        env:
          GH_TOKEN: ${{ github.token }}

  # ── ui: typecheck + production build ────────────────────────────────────────
  ui:
    name: ui lint / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: install
        # frozen for everyone, dependabot included. it used to self-heal on
        # dependabot's PRs, because the npm ecosystem bumped package.json
        # without writing bun.lock — but that made dependabot's PR pass without
        # making its *merge* safe, so every other open PR went red the moment
        # it landed (#1137). dependabot now manages bun.lock directly
        # (package-ecosystem: bun), so a stale lockfile fails here, on the PR
        # that caused it, and never reaches master
        run: bun install --frozen-lockfile
      - name: lint (tsc --noEmit)
        run: bun run lint
      # every locale must match the en base catalog: a missing key falls back to
      # english mid-sentence, an orphan is copy nothing renders (#489)
      - name: i18n catalog parity
        run: bun run check:i18n
      # catalog parity cannot see a string that never reached a catalog at all,
      # which is how `window.confirm("Discard unsaved changes?")` shipped green
      # (#871). this scans the source for user-facing literals and fails on any
      # not in the recorded baseline, so the debt can only shrink
      - name: no new hardcoded user-facing strings
        run: bun run check:literals
      - name: unit tests (bun test)
        run: bun run test
      - name: build
        run: bun run build

  # ── storybook: build + play/interaction tests (headless chromium) ───────────
  # builds the static Storybook and runs the interaction (play) tests via the
  # test-runner against it. a merge gate since #753 — every screen ships stories
  # for loaded/loading/empty/error plus play tests, so a regression here is a
  # real one. the heavy step is the one-off chromium download; the tests
  # themselves are seconds.
  storybook:
    name: storybook build + play tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: install
        # frozen for everyone; see the ui job's install step for why (#1137)
        run: bun install --frozen-lockfile
      # the test-runner launches the headless shell, a separate download from the
      # full chromium build. ui/package.json pins the test-runner's playwright to
      # the same version as @playwright/test, so one install serves both (#737)
      - name: install chromium (playwright)
        run: bunx playwright install --with-deps chromium chromium-headless-shell
      - name: build storybook
        run: bun run build-storybook
      - name: run play tests
        # serve the static build, wait for it, then run the test-runner against it
        run: |
          python3 -m http.server 6006 --directory storybook-static &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:6006/index.json >/dev/null && break
            sleep 1
          done
          bun run test-storybook --url http://127.0.0.1:6006

  # ── smoke: run the gateway and hit it end-to-end ────────────────────────────
  # boots the real binary and exercises the built-in fake-llm (no upstream or
  # secrets needed), catching wiring regressions no unit test sees.
  smoke:
    name: gateway smoke (fake-llm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/wild-linker
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build gateway
        run: cargo build -p rolter-gateway
      - name: boot + probe
        run: |
          set -euo pipefail
          # no config file: the gateway starts open with the built-in fake-llm
          ./target/debug/rolter-gateway --config /nonexistent.toml &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          # wait for the listener
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "== /healthz =="
          curl -fsS http://127.0.0.1:4000/healthz
          echo "== /v1/models =="
          curl -fsS http://127.0.0.1:4000/v1/models
          echo "== fake-llm chat (non-streaming) =="
          curl -fsS http://127.0.0.1:4000/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"fake-llm","messages":[{"role":"user","content":"hi"}]}' \
            | tee /tmp/resp.json
          grep -q '"choices"' /tmp/resp.json
          echo "== fake-llm chat (streaming) =="
          # write to a file rather than piping into grep -q: grep exits on the
          # first match and closes the pipe, so curl fails writing the rest of
          # the SSE stream (exit 23) and `set -o pipefail` fails the step
          curl -fsS -N --max-time 30 http://127.0.0.1:4000/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"fake-llm","stream":true,"messages":[{"role":"user","content":"hi"}]}' \
            -o /tmp/stream.txt
          cat /tmp/stream.txt
          grep -q 'data:' /tmp/stream.txt

  # ── full-stack smoke: the production-shaped docker compose topology ──────────
  # boots postgres, redis, clickhouse, gateway and control together via
  # docker-compose.yml + the CI overlay, then exercises the gateway (fake-llm)
  # and the control snapshot path. catches wiring/env/compose regressions the
  # single-binary smoke above cannot see (e.g. a misnamed ROLTER_DATABASE_URL).
  # informational until the ~image-build cost and flake profile are trusted;
  # promote by dropping continue-on-error. see ROL-245.
  compose-smoke:
    name: compose smoke (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: full-stack compose smoke
        run: bash docker/smoke/smoke.sh

  # ── packaging: catch crate-publish breakage before a release ────────────────
  # `cargo publish` builds each crate from its packaged tarball in isolation, so a
  # file referenced outside the crate directory (e.g. include_str!("../../x")) or a
  # path dependency not carried in the package compiles fine in-tree but 404s at
  # publish time. `cargo package --workspace` reproduces that isolated verify build
  # for every publishable crate, so packaging breakage fails here on the PR instead
  # of mid-release after some crates have already published to crates.io (ROL-233).
  package:
    name: package (publish verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/wild-linker
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo package (verifies each crate in isolation)
        run: cargo package --workspace --locked

  # ── spelling: docs / comments / identifiers ─────────────────────────────────
  # false positives are pinned in .github/config/typos.toml with an explaining comment each.
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/typos
        with:
          version: "1.50.0"
          config: .github/config/typos.toml

  # ── unused dependencies ─────────────────────────────────────────────────────
  machete:
    name: unused deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2

  # ── informational checks ────────────────────────────────────────────────────
  # non-blocking for now (continue-on-error); promote to required once their
  # baseline is understood. see the required-checks policy in ROL-124.

  # ── coverage: workspace line coverage with a ratcheting baseline ─────────────
  # informational (continue-on-error) per ROL-246: it computes workspace line
  # coverage, compares it against the committed baseline in
  # .github/coverage-baseline.txt (new code cannot drop below baseline − tolerance),
  # and uploads the lcov report as a CI artifact. it does not block until the
  # baseline is trusted — promote by dropping continue-on-error here.
  coverage:
    name: coverage (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    # same postgres service as the nextest job so the store + control-plane
    # integration tests actually run under coverage (they self-skip when
    # ROLTER_TEST_DATABASE_URL is unset), otherwise every db-gated line counts
    # as uncovered and the ratchet regresses on legitimate db-glue additions
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rolter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROLTER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rolter_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: ./.github/actions/wild-linker
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov
        run: |
          cargo llvm-cov --workspace --all-features --no-report
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --json --summary-only > coverage.json
      - name: coverage ratchet
        run: bash .github/scripts/coverage-ratchet.sh coverage.json
      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: |
            lcov.info
            coverage.json
          if-no-files-found: error

  # ── toml formatting: Cargo.toml / rolter.toml / deny.toml ───────────────────
  # blocking: the whole tree is taplo-formatted, so any drift is a real diff.
  taplo:
    name: taplo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: taplo
      - name: taplo fmt --check
        run: taplo fmt --check --diff

  # ── MSRV: build on the pinned minimum supported rust version ─────────────────
  # agents can silently adopt newer-than-declared language features; this catches
  # it against `rust-version` in Cargo.toml. informational until the baseline is
  # green on the pinned toolchain.
  msrv:
    name: msrv build (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.82.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check (msrv)
        run: cargo check --workspace --all-features

  # ── cross-platform: check the workspace builds off linux ────────────────────
  # linux is covered by every job above; macOS catches os-specific breakage.
  # informational for now (adds runner minutes); promote if it earns its keep.
  cross-platform:
    name: macos check (informational)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check (macos)
        run: cargo check --workspace --all-features

  # ── semver: no accidental breaking API change on the guarded crates ─────────
  # scoped deliberately. the baseline is the previous release *tag*, not the
  # published crate, and only the crates listed in GUARDED are checked — the
  # rest are pre-1.0 implementation detail that breaks on purpose. what each
  # surface promises, and how a crate joins or leaves the list, is written down
  # in docs/development/api-stability.md (#1217). still informational; it is
  # promoted to blocking when 1.0 fixes the surfaces for real (#922).
  semver-checks:
    name: semver-checks (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # crates whose rust API is checked for patch-level compatibility against
      # the last release tag. keep in sync with docs/development/api-stability.md
      GUARDED: -p rolter-auth -p rolter-balancer -p rolter-gateway -p rolter-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # --baseline-rev needs the tag history, which a shallow clone omits
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-semver-checks
      - name: resolve baseline tag
        id: baseline
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "no release tag found; nothing to diff against" >> "$GITHUB_STEP_SUMMARY"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "baseline: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      # --release-type patch is the strict reading: on the guarded crates a
      # breaking change must be a deliberate act, not a side effect
      - name: cargo semver-checks (guarded crates)
        if: steps.baseline.outputs.tag != ''
        env:
          BASELINE: ${{ steps.baseline.outputs.tag }}
        run: |
          # shellcheck disable=SC2086 # GUARDED is a deliberate word-split list
          cargo semver-checks $GUARDED --baseline-rev "$BASELINE" --release-type patch
