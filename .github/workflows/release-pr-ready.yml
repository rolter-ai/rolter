name: release pr ready

# labelling the release PR `release:ready` dispatches ci.yml on its branch, so
# the PR gets `ci-ok` without waiting for the next push to master.
#
# release-plz opens the release PR and pushes its branch with the repo
# GITHUB_TOKEN, and GitHub starts no workflow for events that token causes, so
# the PR only ever gets `ci-ok` from a `workflow_dispatch` of ci.yml (#1025).
# release-plz.yml's `dispatch-release-pr-ci` makes that dispatch on a push to
# master, and only while the PR carries this label (#2025). a label added by a
# person is not a GITHUB_TOKEN event, so it does start this workflow, and this
# is the dispatch the label asks for. both jobs match the label by the same
# name, and scripts/check-release-handoff.py holds them to it.
#
# `pull_request`, not `pull_request_target`. this job holds `actions: write`.
# a `pull_request` run from a fork gets a read-only token whatever the job asks
# for, while `pull_request_target` would hand a fork's run a write token, which
# is why zizmor's dangerous-triggers audit rejects it. the `if:` below admits
# only a branch of this repository, and whoever pushed one can already push
# workflows. the job checks nothing out and uses no action, so it runs no code
# from the pull request; the handoff check holds it to that as well.
#
# every label added to any PR starts a run. the `if:` skips it without taking a
# runner unless the label is `release:ready` on a release-plz branch of this
# repository.
#
# there is no concurrency group. one here would let an unrelated label event
# cancel a pending `release:ready` run, and ci.yml's own group already folds two
# dispatches on one branch into a single run.
on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  dispatch-on-label:
    name: dispatch release pr ci
    if: >-
      github.event.label.name == 'release:ready'
      && startsWith(github.event.pull_request.head.ref, 'release-plz-')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # the confirmation below gives up after 5 minutes; this only catches a hang
    timeout-minutes: 10
    permissions:
      actions: write # workflow_dispatch ci.yml and list its runs; nothing else
    steps:
      - name: dispatch ci.yml against the release branch
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # the head ref comes from the event. the `if:` already required the
          # prefix; this keeps anything but a plain branch name out of the
          # dispatch and the api path the next step builds from it
          if ! printf '%s' "$BRANCH" | grep -Eq '^release-plz-[A-Za-z0-9._-]+$'; then
            echo "::error::refusing to dispatch ci.yml for unexpected head ref '$BRANCH'"
            exit 1
          fi
          # seconds since epoch, used to distinguish our run from older ones
          started="$(date -u +%s)"
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          echo "dispatched ci.yml for $BRANCH (release PR #$NUMBER was labelled release:ready)"
          echo "started=$started" >> "$GITHUB_OUTPUT"

      # a dispatch that silently produced no run would leave the release PR
      # blocked and this job green, so confirm it landed
      - name: confirm the ci run started
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          STARTED: ${{ steps.dispatch.outputs.started }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            # the query must live in the path: `gh api` switches to POST as
            # soon as any -f/-F parameter is set, which 404s this GET-only
            # endpoint (#1026). `|| true` keeps a transient api error inside
            # the loop rather than failing the job on one bad response
            runs="$(gh api \
              "repos/$REPO/actions/workflows/ci.yml/runs?event=workflow_dispatch&branch=$BRANCH&per_page=20" \
              -q ".workflow_runs[] | select((.created_at | fromdateiso8601) >= ($STARTED - 120)) | .html_url" \
              || true)"
            if [ -n "$runs" ]; then
              echo "ci run(s) gating $BRANCH:"; echo "$runs"
              {
                echo "### release pr ci dispatched"
                echo
                echo "branch: \`$BRANCH\`, on the \`release:ready\` label"
                while IFS= read -r url; do echo "- $url"; done <<< "$runs"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::dispatched ci.yml for $BRANCH but no workflow run appeared within 5m"
          exit 1
