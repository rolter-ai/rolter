name: ci

on:
  push:
    branches: [master, main]
  # `edited` lets a title-only fix retrigger the cheap pr-title check without a
  # new commit; the full `quality` gate skips that event (see its `if:` below)
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # the release PR is opened by release-plz with the repo `GITHUB_TOKEN`, and
  # GitHub suppresses downstream events for token-created refs and PRs — so
  # neither `push` nor `pull_request` ever fires for it and `ci-ok`, the one
  # required status check, is never reported. every release therefore needed an
  # admin bypass to merge (#1025). `workflow_dispatch` is the documented
  # exception: it always creates a run, even from the `GITHUB_TOKEN`, and the
  # check-runs it produces attach to the head commit of the ref it runs on,
  # which is the release PR's head. `release-plz.yml` dispatches it — see
  # `dispatch-release-pr-ci` there.
  workflow_dispatch:

# commit-driven runs supersede each other, but an `edited` run must not: it
# skips `quality` (see below) on the assumption the gate already ran for this
# commit, and cancelling an in-flight gate makes that assumption false — the
# result is `ci-ok` green with no quality signal at all (#767). Giving `edited`
# its own per-run group means it cancels nothing.
#
# a push to master gets a per-run group for the same reason. every merge commit
# is a distinct tree that someone will branch from, so superseding its run saves
# a few runner-minutes and costs the only gate result that commit will ever
# have: `7fd73db6` was cancelled by `c6a96378` landing a minute later, and
# master ended up with no completed `ci` run for it (#1328). `cancel-in-progress:
# false` would not fix this — it queues the newer run instead, and a third push
# cancels the *pending* one, so the middle commit is still ungated. a per-run
# group is what actually keeps every merge commit's run. the cost is more
# concurrent runs on a busy merge day.
concurrency:
  group: ci-${{ github.ref }}-${{ (github.event.action == 'edited' || github.event_name == 'push') && github.run_id || 'gate' }}
  cancel-in-progress: true

# least-privilege GITHUB_TOKEN by default; jobs widen their own scope as needed.
permissions:
  contents: read

jobs:
  # full quality/security gate (fmt, clippy, nextest, doc tests, feature matrix,
  # cargo doc, cargo-deny, gitleaks, actionlint, ui, storybook, smoke, +
  # informational
  # checks). shared with the release paths via workflow_call so publish and CI
  # enforce the exact same checks on a commit.
  quality:
    # a title-only edit reruns pr-title/ci-ok only; the heavy gate already ran
    # (or is still running — see the concurrency group above, which keeps an
    # `edited` run from cancelling it) and never needs re-running for a
    # metadata change. `ci-ok` verifies that claim against the api before it
    # accepts this skip, so "still running" means red rather than green
    if: github.event.action != 'edited'
    uses: ./.github/workflows/quality.yml

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: validate conventional commit pr title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            gateway
            balancer
            proxy
            core
            store
            auth
            control
            ui
            docs
            infra
            ci
            deps
            deps-dev
            release
            e2e
          requireScope: false

  # CodeQL security analysis, folded into ci-ok so it gates merges without being
  # a separate required status check. this advanced setup replaces GitHub's
  # default setup (disabled on the repo). rust only supports build-mode `none`
  # (a build-free source extractor), so to lift call-target resolution above
  # CodeQL's quality threshold we `cargo fetch` the dependencies first, giving
  # the extractor the crate sources it needs to resolve calls. see #484.
  codeql:
    name: codeql (${{ matrix.language }})
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make the dependency sources available so the rust extractor resolves
      # calls into crates instead of leaving them unresolved
      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: matrix.language == 'rust'
        name: fetch dependencies for analysis
        run: cargo fetch --locked
      - name: initialize codeql
        uses: github/codeql-action/init@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: analyze
        uses: github/codeql-action/analyze@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          category: "/language:${{ matrix.language }}"

  # single aggregating gate for branch protection. mark ONLY `ci-ok` as a
  # required status check on master; it turns green only when the quality
  # workflow, pr-title and codeql all succeed (a skipped pr-title is fine on a
  # push build and on the `workflow_dispatch` run that gates the release PR). adding/removing jobs then never requires touching branch protection
  # settings. see ROL-124. the rules this job enforces, and why the `edited`
  # fast-path exists at all, are written up in
  # `docs/development/ci-gating.md`.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [quality, pr-title, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # listing this workflow's other runs on the same head sha is the whole
      # mechanism behind the `edited` guard below
      actions: read
    steps:
      # the `edited` fast-path below accepts a skipped `quality`/`codeql` because
      # the gate is assumed to have already run on this commit. that assumption
      # is unverified, and when it is false the fast-path writes a *newer*,
      # successful `ci-ok` check-run on the same head sha — branch protection
      # reads the newest one, so a retitle during an in-flight gate run made the
      # commit mergeable before a single test had run (#1328, seen on #1315 and
      # #1267). this step turns the assumption into a check: the fast-path may
      # only report green when a real gate run for this exact sha has already
      # completed successfully and nothing else is still running on it.
      - name: assert the gate already ran for this commit
        if: github.event.action == 'edited'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # `github.sha` on a pull_request run is the throwaway merge commit; the
          # runs and check-runs that branch protection reads hang off the PR head
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          runs="${RUNNER_TEMP}/ci-runs.json"
          # scoped to ci.yml by filename: a run of any other workflow on this sha
          # says nothing about this gate. no pipeline here on purpose — under
          # `pipefail` a `| head`/`| grep -q` short-circuit fails the step for the
          # wrong reason (#1291, #1306), so the body goes to a file and jq reads it
          attempt=1
          while true; do
            if gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&per_page=100&exclude_pull_requests=true" > "${runs}"; then
              break
            fi
            if [ "${attempt}" -ge 3 ]; then
              # a flaking query must never resolve to green: no answer is not an answer
              echo "::error::could not list ci runs for ${HEAD_SHA} after ${attempt} attempts; refusing to report green without a gate result"
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 5
          done

          echo "ci runs on ${HEAD_SHA}:"
          jq -r '.workflow_runs[] | "  \(.id) \(.event) \(.status) \(.conclusion // "-")"' "${runs}"

          # this listing contains the current run too — drop it by id, never by
          # name, since every run of this workflow shares the name
          unfinished="$(jq --arg self "${SELF_RUN_ID}" \
            '[.workflow_runs[] | select((.id | tostring) != $self) | select(.status != "completed")] | length' "${runs}")"
          # a cancelled run is `completed` with no verdict, so it counts as no run
          # at all rather than as a pass — same treatment as a missing run
          passed="$(jq --arg self "${SELF_RUN_ID}" \
            '[.workflow_runs[] | select((.id | tostring) != $self) | select(.status == "completed" and .conclusion == "success")] | length' "${runs}")"

          if [ "${unfinished}" -gt 0 ]; then
            echo "::error::${unfinished} ci run(s) on ${HEAD_SHA} are still queued or in progress; the title-edit fast path will not report green over an unfinished gate. that run writes its own ci-ok when it completes"
            exit 1
          fi
          if [ "${passed}" -eq 0 ]; then
            echo "::error::no completed, successful ci run on ${HEAD_SHA} (a cancelled run counts as none); re-run the gate instead of editing the title to go green"
            exit 1
          fi
          echo "gate already passed for ${HEAD_SHA} in ${passed} completed run(s)"

      - name: assert required jobs succeeded
        run: |
          set -euo pipefail
          echo "quality:  ${{ needs.quality.result }}"
          echo "pr-title: ${{ needs.pr-title.result }}"
          echo "codeql:   ${{ needs.codeql.result }}"
          echo "action:   ${GITHUB_EVENT_ACTION}"
          # quality and codeql must succeed; pr-title may be skipped (push and
          # workflow_dispatch builds)
          # but must not have failed. on a title-only `edited` event the heavy
          # gate and codeql are intentionally skipped — the step above has
          # already proven they ran and passed on this exact head sha, so
          # skipped is acceptable here and only pr-title re-runs
          if [ "${GITHUB_EVENT_ACTION}" = "edited" ]; then
            if [ "${{ needs.quality.result }}" != "success" ] \
               && [ "${{ needs.quality.result }}" != "skipped" ]; then
              echo "::error::quality gate did not pass"
              exit 1
            fi
          else
            if [ "${{ needs.quality.result }}" != "success" ]; then
              echo "::error::quality gate did not pass"
              exit 1
            fi
            if [ "${{ needs.codeql.result }}" != "success" ]; then
              echo "::error::codeql analysis did not pass"
              exit 1
            fi
          fi
          if [ "${{ needs.pr-title.result }}" = "failure" ]; then
            echo "::error::pr-title check failed"
            exit 1
          fi
          echo "all required checks green"
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
