name: sso e2e (keycloak)

# single sign-on and SCIM against a real identity provider (#714). heavy: builds
# the rolter images and boots the full stack plus keycloak, so it is NOT part of
# the per-PR gate. run on demand or nightly. no secrets — keycloak is local and
# its credentials are throwaway test values.
on:
  workflow_dispatch:
  schedule:
    # nightly at 04:11 UTC, after the dashboard suite
    - cron: "11 4 * * *"

permissions:
  contents: read

jobs:
  sso:
    name: sso + scim against keycloak
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: generate a throwaway envelope key
        # sealing provider api_keys needs a 32-byte base64 KEK; a fresh one per run
        # keeps a key out of the repository and is all the stack needs
        run: |
          kek="$(openssl rand -base64 32)"
          echo "::add-mask::${kek}"
          echo "ROLTER_KEK=${kek}" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: run the suite
        working-directory: integration/e2e
        # the harness owns the compose lifecycle, including the `idp` profile
        run: uv run pytest tests/test_sso.py --idp -ra

      - name: stack logs
        if: ${{ failure() }}
        run: |
          docker compose -f integration/e2e/docker-compose.e2e.yml --profile idp \
            logs --no-color --tail 400

      - name: tear down the stack
        if: ${{ always() }}
        run: |
          docker compose -f integration/e2e/docker-compose.e2e.yml --profile idp \
            down -v --remove-orphans
