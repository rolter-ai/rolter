name: sso e2e (keycloak)

# single sign-on and SCIM against a real identity provider (#714). heavy: builds
# the rolter images and boots the full stack plus keycloak, so it is NOT part of
# the per-PR gate. run on demand or nightly. no secrets — keycloak is local and
# its credentials are throwaway test values.
#
# nothing gates on this workflow, so a red nightly would sit unread in the
# Actions tab. `report failure` opens or updates a tracking issue through
# report-failure.yml, the same one extended.yml and ui-e2e.yml call (#2682).
on:
  workflow_dispatch:
  schedule:
    # nightly at 04:11 UTC, after the dashboard suite
    - cron: "11 4 * * *"

permissions:
  contents: read

jobs:
  sso:
    name: sso + scim against keycloak
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: generate a throwaway envelope key
        # sealing provider api_keys needs a 32-byte base64 KEK; a fresh one per run
        # keeps a key out of the repository and is all the stack needs
        run: |
          kek="$(openssl rand -base64 32)"
          echo "::add-mask::${kek}"
          echo "ROLTER_KEK=${kek}" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: run the suite
        working-directory: integration/e2e
        # the harness owns the compose lifecycle, including the `idp` profile
        run: uv run pytest tests/test_sso.py --idp -ra

      - name: stack logs
        if: ${{ failure() }}
        run: |
          docker compose -f integration/e2e/docker-compose.e2e.yml --profile idp \
            logs --no-color --tail 400

      - name: tear down the stack
        if: ${{ always() }}
        run: |
          docker compose -f integration/e2e/docker-compose.e2e.yml --profile idp \
            down -v --remove-orphans

  # ── report failure: one tracking issue for the whole workflow ──────────────
  # master only: a dispatch on a branch is someone trying a change, and its
  # failure belongs in that run. the issue has its own title, so this suite
  # never shares one with the others
  report-failure:
    name: report failure
    needs: [sso]
    if: ${{ !cancelled() && needs.sso.result == 'failure' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      issues: write
      actions: write
    uses: ./.github/workflows/report-failure.yml
    with:
      title: "sso-e2e.yml: sso and scim journeys failing"
      area: ci
      effort: S
      results: |
        sso + scim against keycloak|${{ needs.sso.result }}
      note: The run's `stack logs` step holds the last 400 lines of every container, keycloak included.
