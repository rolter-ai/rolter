name: audit

# scheduled supply-chain audit. cargo-deny runs on every PR (quality.yml) against
# the committed lockfile, but new RUSTSEC advisories land on already-merged code
# with no PR to trigger them. this runs daily so a fresh advisory on master
# surfaces as a failing scheduled run (and an issue) rather than sitting unseen.
on:
  schedule:
    # every day at 07:00 UTC
    - cron: "0 7 * * *"
  # allow a manual run from the actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
