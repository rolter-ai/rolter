name: audit

# scheduled supply-chain audit. cargo-deny runs on every PR (quality.yml) against
# the committed lockfile, but new RUSTSEC advisories land on already-merged code
# with no PR to trigger them. this runs daily so a fresh advisory on master
# surfaces as a failing scheduled run (and an issue) rather than sitting unseen.
on:
  schedule:
    # every day at 07:00 UTC
    - cron: "0 7 * * *"
  # allow a manual run from the actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
