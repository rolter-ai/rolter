name: extended

# the informational checks that need a full build and never gate a merge: the
# macOS check, the full-stack compose smoke, the msrv build and coverage on
# master. they used to run on every push inside quality.yml as
# continue-on-error jobs, where each one took a slot from the 20-job runner pool
# (the macOS one from the 5-slot macOS pool) for a verdict nothing read. they
# run here nightly and on demand instead (ADR-0034, #2025). `bun pin` rides
# along: a ten-second check that .bun-version still names the latest bun (#1922).
#
# nothing gates on this workflow, so no job here carries continue-on-error: a
# failure has to reach `needs.*.result` as `failure` for `report failure` to
# open or update the tracking issue. breakage surfaces up to a day late there,
# not on the PR that caused it. coverage also keeps running on every PR, in
# quality.yml, because testing.md asks for the baseline edit in the same PR.
#
# takes no secrets. only `report failure` writes anything, and it holds
# `issues: write` and `actions: write` at job level with no checkout: at
# workflow level zizmor rates those scopes high and fails the gate.
on:
  workflow_dispatch:
  schedule:
    # nightly at 01:41 UTC, ahead of the dashboard (03:17) and sso (04:11) suites
    - cron: "41 1 * * *"

permissions:
  contents: read

jobs:
  # ── cross-platform: check the workspace builds off linux ────────────────────
  # linux is covered by every quality.yml job; macOS catches os-specific breakage
  cross-platform:
    name: macos check
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: cargo check (macos)
        run: cargo check --workspace --all-features

  # ── full-stack smoke: the production-shaped docker compose topology ──────────
  # boots postgres, redis, clickhouse, gateway and control together via
  # docker-compose.yml + the CI overlay, then exercises the gateway (fake-llm)
  # and the control snapshot path. catches wiring/env/compose regressions the
  # single-binary smoke in quality.yml cannot see (e.g. a misnamed
  # ROLTER_DATABASE_URL). see ROL-245
  compose-smoke:
    name: compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: full-stack compose smoke
        run: bash docker/smoke/smoke.sh

  # ── MSRV: build on the declared minimum supported rust version ──────────────
  # agents can silently adopt newer-than-declared language features; this
  # catches it against `rust-version` in Cargo.toml. the version is read from
  # Cargo.toml so the job follows the declaration, and cargo runs it as
  # `cargo +<msrv>`: rust-toolchain.toml pins `stable` and outranks the rustup
  # default the toolchain action sets, so a plain `cargo check` here would test
  # stable and never the msrv. it is red until #2026 settles the declared
  # version against a lockfile that already needs 1.88
  msrv:
    name: msrv build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::no rust-version in the root Cargo.toml"
            exit 1
          fi
          echo "msrv: \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: cargo check (msrv)
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo +"$MSRV" check --workspace --all-features

  # ── coverage on master ──────────────────────────────────────────────────────
  # the same run as quality.yml's `coverage (informational)`, which now runs on
  # pull_request only. this copy gives master a daily number and, sharing
  # `shared-key: coverage` with the PR job, saves the cache that PR coverage
  # restores: a cache a PR saves is scoped to that PR, one saved on master is
  # visible to every PR. keep the two jobs' services, env, toolchain and cache
  # steps identical, or the keys drift and PR coverage builds cold
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rolter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROLTER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rolter_test
      ROLTER_TEST_REDIS_URL: redis://localhost:6379/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: ./.github/actions/wild-linker
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov
        run: |
          cargo llvm-cov --workspace --all-features --no-report
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --json --summary-only > coverage.json
      - name: coverage ratchet
        run: bash .github/scripts/coverage-ratchet.sh coverage.json
      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: |
            lcov.info
            coverage.json
          if-no-files-found: error

  # ── bun pin: .bun-version keeps up with bun releases ───────────────────────
  # every setup-bun step in the repo reads .bun-version (#1922), and nothing
  # else raises it: dependabot's bun ecosystem bumps ui/'s dependencies, never
  # the bun that installs them. this fails once a newer bun release is out, so
  # `report failure` opens the tracking issue and someone raises the pin on a
  # PR, where the frozen `bun install` in quality.yml proves the new bun still
  # reads bun.lock
  bun-pin:
    name: bun pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .bun-version
          sparse-checkout-cone-mode: false
      - name: .bun-version names the latest bun release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < .bun-version)"
          latest="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name)"
          latest="${latest#bun-v}"
          if [ "${pinned}" != "${latest}" ]; then
            echo "::error title=bun pin::bun ${latest} is out and .bun-version pins ${pinned}. raise .bun-version and check that cd ui && bun install --frozen-lockfile still passes"
            exit 1
          fi
          echo "bun ${pinned} is the latest release" >> "${GITHUB_STEP_SUMMARY}"

  # ── report failure: one tracking issue for the whole workflow ──────────────
  # opens an issue titled after this workflow the first time a job fails, and
  # comments on it while it stays open, so a red night is seen rather than
  # left in the Actions tab. close the issue once the fix lands; the next
  # failure opens a fresh one. master only: a dispatch on a branch is someone
  # trying a change, and its failure belongs in that run, not on the issue.
  # the only job with a write scope, and it never checks the tree out. the run
  # url, ref and results reach the script through env, never inline in run:
  #
  # an issue this token opens raises no `issues` event, so project-automation
  # never sees it (#2201). the job therefore triages a new issue itself: the
  # milestone it can set, and a dispatch of
  # project-automation.yml (the one event the token may start, hence
  # `actions: write`) for the board item and its fields. both are best-effort
  # and only warn: the issue is what matters, and a renamed milestone must not
  # cost it
  report-failure:
    name: report failure
    needs: [cross-platform, compose-smoke, msrv, coverage, bun-pin]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: write
    steps:
      - name: open or comment on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          MACOS: ${{ needs.cross-platform.result }}
          COMPOSE_SMOKE: ${{ needs.compose-smoke.result }}
          MSRV: ${{ needs.msrv.result }}
          COVERAGE: ${{ needs.coverage.result }}
          BUN_PIN: ${{ needs.bun-pin.result }}
          MILESTONE: Maintenance, CI & DX
        run: |
          set -euo pipefail
          title="extended.yml: nightly checks failing"
          body="$(printf '%s\n' \
            "[Run]($RUN_URL) on \`$REF\` at \`$SHA\`:" \
            "" \
            "| job | result |" \
            "| --- | --- |" \
            "| macos check | $MACOS |" \
            "| compose smoke | $COMPOSE_SMOKE |" \
            "| msrv build | $MSRV |" \
            "| coverage | $COVERAGE |" \
            "| bun pin | $BUN_PIN |")"
          number="$(gh issue list --state open --label ci --limit 200 --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "commented on #$number" >> "$GITHUB_STEP_SUMMARY"
          else
            url="$(gh issue create --title "$title" --label ci \
              --body "$(printf '%s\n\n%s\n' "$body" "Opened by the \`report failure\` job. Close it once the failing checks are fixed; the next failure opens a new one.")")"
            echo "opened $url" >> "$GITHUB_STEP_SUMMARY"
            number="${url##*/}"
            if ! gh issue edit "$number" --milestone "$MILESTONE"; then
              echo "::warning title=report failure::could not set the milestone of #$number to $MILESTONE; set it by hand"
            fi
            if ! gh workflow run project-automation.yml --ref "$REF" \
              -f number="$number" -f area=ci -f effort=XS; then
              echo "::warning title=report failure::could not dispatch project-automation for #$number; add it by hand: gh workflow run project-automation.yml -f number=$number -f area=ci -f effort=XS"
            fi
          fi
