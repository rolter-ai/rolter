name: extended

# the informational checks that need a full build and never gate a merge: the
# macOS check, the full-stack compose smoke, the msrv build and coverage on
# master. they used to run on every push inside quality.yml as
# continue-on-error jobs, where each one took a slot from the 20-job runner pool
# (the macOS one from the 5-slot macOS pool) for a verdict nothing read. they
# run here nightly and on demand instead (ADR-0034, #2025). `bun pin` rides
# along: a ten-second check that .bun-version still names the latest bun (#1922),
# and a lockfile audit of ui/bun.lock, which dependabot alerts cannot see (#1930).
#
# nothing gates on this workflow, so no job here carries continue-on-error: a
# failure has to reach `needs.*.result` as `failure` for `report failure` to
# open or update the tracking issue. breakage surfaces up to a day late there,
# not on the PR that caused it. coverage also keeps running on every PR, in
# quality.yml, because testing.md asks for the baseline edit in the same PR.
#
# takes no secrets. only `report failure` writes anything: it calls the shared
# report-failure.yml, whose job holds `issues: write` and `actions: write` at
# job level (at workflow level zizmor rates those scopes high and fails the
# gate) and checks out nothing but scripts/report-failure.sh, without
# credentials (#2682).
on:
  workflow_dispatch:
  schedule:
    # nightly at 01:41 UTC, ahead of the dashboard (03:17) and sso (04:11) suites
    - cron: "41 1 * * *"

permissions:
  contents: read

jobs:
  # ── cross-platform: check the workspace builds off linux ────────────────────
  # linux is covered by every quality.yml job; macOS catches os-specific breakage
  cross-platform:
    name: macos check
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: cargo check (macos)
        run: cargo check --workspace --all-features

  # ── full-stack smoke: the production-shaped docker compose topology ──────────
  # boots postgres, redis, clickhouse, gateway and control together via
  # docker-compose.yml + the CI overlay, then exercises the gateway (fake-llm)
  # and the control snapshot path. catches wiring/env/compose regressions the
  # single-binary smoke in quality.yml cannot see (e.g. a misnamed
  # ROLTER_DATABASE_URL). see ROL-245
  compose-smoke:
    name: compose smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: full-stack compose smoke
        run: bash docker/smoke/smoke.sh

  # ── MSRV: build on the declared minimum supported rust version ──────────────
  # agents can silently adopt newer-than-declared language features; this
  # catches it against `rust-version` in Cargo.toml. the version is read from
  # Cargo.toml so the job follows the declaration, and cargo runs it as
  # `cargo +<msrv>`: rust-toolchain.toml pins `stable` and outranks the rustup
  # default the toolchain action sets, so a plain `cargo check` here would test
  # stable and never the msrv. the floor is set by our own code as well as the
  # lockfile: sqlx 0.9 declares 1.94, above the 1.91 that stabilises
  # `str::floor_char_boundary` and the 1.89 that uuid declares (#2026)
  msrv:
    name: msrv build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::no rust-version in the root Cargo.toml"
            exit 1
          fi
          echo "msrv: \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: cargo check (msrv)
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          set -euo pipefail
          # the log names the compiler that ran, so a stable run cannot pass for the msrv
          rustc +"$MSRV" --version
          cargo +"$MSRV" --version
          cargo +"$MSRV" check --workspace --all-features

  # ── coverage on master ──────────────────────────────────────────────────────
  # the same run as quality.yml's `coverage (informational)`, which now runs on
  # pull_request only. this copy gives master a daily number and, sharing
  # `shared-key: coverage` with the PR job, saves the cache that PR coverage
  # restores: a cache a PR saves is scoped to that PR, one saved on master is
  # visible to every PR. keep the two jobs' services, env, toolchain and cache
  # steps identical, or the keys drift and PR coverage builds cold
  coverage:
    name: coverage
    # still 24.04, like quality.yml's coverage job: some tests shell out to the
    # runner's pg_dump and psql against the postgres:16 service, and the 26.04
    # postgres 18 client writes dumps a 16 server refuses. moves with #3235
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          # the service lives for one job on a runner nothing else reaches, so it
          # takes the connection without a password rather than carrying one
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rolter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROLTER_TEST_DATABASE_URL: postgres://postgres@localhost:5432/rolter_test
      ROLTER_TEST_REDIS_URL: redis://localhost:6379/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: ./.github/actions/wild-linker
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov
        run: |
          cargo llvm-cov --workspace --all-features --no-report
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --json --summary-only > coverage.json
      - name: coverage ratchet
        run: bash .github/scripts/coverage-ratchet.sh coverage.json
      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: |
            lcov.info
            coverage.json
          if-no-files-found: error

  # ── bun pin: .bun-version keeps up with bun releases ───────────────────────
  # every setup-bun step in the repo reads .bun-version (#1922), and nothing
  # else raises it: dependabot's bun ecosystem bumps ui/'s dependencies, never
  # the bun that installs them. this fails once a newer bun release is out, so
  # `report failure` opens the tracking issue and someone raises the pin on a
  # PR, where the frozen `bun install` in quality.yml proves the new bun still
  # reads bun.lock
  bun-pin:
    name: bun pin
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .bun-version
          sparse-checkout-cone-mode: false
      - name: .bun-version names the latest bun release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < .bun-version)"
          latest="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name)"
          latest="${latest#bun-v}"
          if [ "${pinned}" != "${latest}" ]; then
            echo "::error title=bun pin::bun ${latest} is out and .bun-version pins ${pinned}. raise .bun-version and check that cd ui && bun install --frozen-lockfile still passes"
            exit 1
          fi
          echo "bun ${pinned} is the latest release" >> "${GITHUB_STEP_SUMMARY}"

  # ── ui lockfile audit (#1930) ───────────────────────────────────────────────
  # dependabot's dependency graph reads ui/package.json but not ui/bun.lock, so
  # a vulnerable package that only arrives transitively raises no alert. this
  # reads the lockfile itself with `bun audit` and fails on any advisory that is
  # not fixed or listed in ui/audit-accepted.json. it is informational, never a
  # merge gate: a new advisory lands on code that is already merged, and a gate
  # would turn every unrelated PR red for it. `report failure` opens the tracking
  # issue. needs no install: bun audit reads package.json and bun.lock
  ui-audit:
    name: ui lockfile audit
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .bun-version
            ui/package.json
            ui/bun.lock
            ui/audit-accepted.json
            ui/scripts/audit-lockfile.ts
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: bun audit over ui/bun.lock
        working-directory: ui
        run: bun scripts/audit-lockfile.ts

  # ── report failure: one tracking issue for the whole workflow ──────────────
  # opens an issue titled after this workflow the first time a job fails, and
  # comments on it while it stays open, so a red night is seen rather than
  # left in the Actions tab. close the issue once the fix lands; the next
  # failure opens a fresh one. master only: a dispatch on a branch is someone
  # trying a change, and its failure belongs in that run, not on the issue.
  # the logic is report-failure.yml's, shared with ui-e2e.yml and sso-e2e.yml
  # (#2682); this job only says when to report, under which title and what the
  # table holds. the called job needs the two write scopes, and the caller has
  # to grant them
  report-failure:
    name: report failure
    needs: [cross-platform, compose-smoke, msrv, coverage, bun-pin, ui-audit]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      issues: write
      actions: write
    uses: ./.github/workflows/report-failure.yml
    with:
      title: "extended.yml: nightly checks failing"
      area: ci
      effort: XS
      results: |
        macos check|${{ needs.cross-platform.result }}
        compose smoke|${{ needs.compose-smoke.result }}
        msrv build|${{ needs.msrv.result }}
        coverage|${{ needs.coverage.result }}
        bun pin|${{ needs.bun-pin.result }}
        ui lockfile audit|${{ needs.ui-audit.result }}
