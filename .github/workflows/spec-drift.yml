name: spec drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-drift
  cancel-in-progress: false

jobs:
  check:
    name: check official sources
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      drift_count: ${{ steps.drift.outputs.drift_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: restore living-page observations
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spec-drift-state.json
          key: spec-drift-${{ github.run_id }}
          restore-keys: spec-drift-
      - name: collect signals
        id: drift
        run: |
          set -euo pipefail
          python3 scripts/spec_drift.py check \
            --state .spec-drift-state.json \
            --report spec-drift-report.json \
            --summary spec-drift-summary.md
          count=$(python3 -c 'import json; print(json.load(open("spec-drift-report.json"))["drift_count"])')
          echo "drift_count=${count}" >> "${GITHUB_OUTPUT}"
          cat spec-drift-summary.md >> "${GITHUB_STEP_SUMMARY}"
      - name: upload raw signals
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-drift-signals
          path: |
            spec-drift-report.json
            spec-drift-summary.md
            .spec-drift-state.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  issues:
    name: deduplicate tracking issues
    if: needs.check.result == 'success' && needs.check.outputs.drift_count != '0'
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spec-drift-signals
      - name: create or comment on one issue per record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/spec_drift.py sync-issues --report spec-drift-report.json --repo "${REPO}"
