name: project-automation

# adds every new issue and PR to the rolter-ai project board (#1) and seeds a
# default Status so items land triaged instead of in the untracked "no status"
# column: issues get Todo plus Priority Medium, PRs get In Review because an
# open PR is by definition waiting on review or on ci-ok.
#
# field and option ids are resolved by *name* at run time, never pinned:
# replacing a field's option list through updateProjectV2Field mints new ids, and
# a pinned id then makes every seed fail while items land in the untracked
# "no status" column — the exact outcome this job exists to prevent (#1093,
# #1096). names survive that edit; generated ids do not.
#
# org Projects v2 are not reachable with the default GITHUB_TOKEN, so this uses
# a fine-grained PAT stored as the secret ADD_TO_PROJECT_PAT (org: projects
# read/write, repo: contents/issues/pull-requests read). pull_request_target is
# required so PRs from forks can still see the secret.
on:
  issues:
    types: [opened]
  # pull_request_target is required so PRs from forks can read the org PAT; this
  # workflow never checks out PR head and passes only the project id and literal
  # field names to run:, so the usual injection risk does not apply.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened]

permissions:
  contents: read

jobs:
  add-to-board:
    name: add to project board
    runs-on: ubuntu-latest
    steps:
      - name: add item to project
        id: add
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/orgs/rolter-ai/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}

      - name: seed default Status and Priority
        if: steps.add.outputs.itemId != ''
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ITEM_ID: ${{ steps.add.outputs.itemId }}
          PROJECT_ID: PVT_kwDOEjWga84Bdezc
          IS_PR: ${{ github.event_name == 'pull_request_target' }}
        run: |
          set -euo pipefail

          # one query for every single-select field and its options, so the
          # names below are resolved against whatever the board looks like today.
          # $-prefixed names in the query are graphql variables, not shell vars
          # shellcheck disable=SC2016
          FIELDS=$(gh api graphql -f query='
            query($project:ID!){
              node(id:$project){
                ... on ProjectV2 {
                  fields(first:50){
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id name options { id name }
                      }
                    }
                  }
                }
              }
            }' -f project="$PROJECT_ID")

          # what the item already carries. read as late as possible, and once:
          # `updateProjectV2ItemFieldValue` has no compare-and-set input, so
          # this is a read-then-write and NOT atomic. see the initialization
          # contract in docs/dev-docs/development/issue-tracking.md (#1469)
          # shellcheck disable=SC2016
          EXISTING=$(gh api graphql -f query='
            query($item:ID!){
              node(id:$item){
                ... on ProjectV2Item {
                  fieldValues(first:50){
                    nodes {
                      ... on ProjectV2ItemFieldSingleSelectValue {
                        name
                        field { ... on ProjectV2SingleSelectField { name } }
                      }
                    }
                  }
                }
              }
            }' -f item="$ITEM_ID")

          # a graphql error comes back as http 200 with a null `node`, which
          # `gh` does not always treat as a failure. left unchecked, every
          # field then reads as empty and the seed writes its defaults over
          # whatever the item already had — silently the very bug this step
          # exists to prevent. so prove the item came back before trusting the
          # absence of a value; an unreadable item is a hard failure, never an
          # "assume nothing is set"
          if [ "$(jq -r '.data.node.fieldValues.nodes | type' <<<"$EXISTING")" != "array" ]; then
            echo "::error::could not read current field values for item $ITEM_ID; refusing to seed defaults over values that may exist"
            echo "$EXISTING" >&2
            exit 1
          fi

          set_field() {
            field_name=$1
            option_name=$2

            # seeding is initialization, not policy: a value already on the
            # item was put there deliberately and outranks our default. before
            # #1469 this ran unconditionally, so triage applied seconds after
            # creation was silently demoted — a Backlog proposal became Todo
            # and a High defect became Medium
            current=$(jq -r --arg f "$field_name" \
              '[.data.node.fieldValues.nodes[]
                | select(.field.name == $f) | .name] | .[0] // ""' <<<"$EXISTING")
            if [ -n "$current" ]; then
              echo "::notice::$field_name is already '$current'; leaving it alone"
              return 0
            fi

            field_id=$(jq -r --arg f "$field_name" \
              '.data.node.fields.nodes[] | select(.name == $f) | .id' <<<"$FIELDS")
            option_id=$(jq -r --arg f "$field_name" --arg o "$option_name" \
              '.data.node.fields.nodes[] | select(.name == $f)
               | .options[] | select(.name == $o) | .id' <<<"$FIELDS")

            # fail loudly and name what could not be resolved: a silently
            # skipped seed is exactly how the last drift went unnoticed
            if [ -z "$field_id" ] || [ "$field_id" = "null" ]; then
              echo "::error::project board has no single-select field named '$field_name'"
              exit 1
            fi
            if [ -z "$option_id" ] || [ "$option_id" = "null" ]; then
              echo "::error::board field '$field_name' has no option named '$option_name'"
              exit 1
            fi

            # shellcheck disable=SC2016
            gh api graphql -f query='
              mutation($project:ID!,$item:ID!,$field:ID!,$opt:String!){
                updateProjectV2ItemFieldValue(input:{
                  projectId:$project,itemId:$item,fieldId:$field,
                  value:{singleSelectOptionId:$opt}
                }){ projectV2Item { id } }
              }' -f project="$PROJECT_ID" -f item="$ITEM_ID" \
                 -f field="$field_id" -f opt="$option_id"
          }
          # a freshly opened PR is already waiting on review and ci-ok, so it
          # starts in In Review; only issues start in Todo and carry a Priority
          if [ "$IS_PR" = "true" ]; then
            set_field Status "In Review"
          else
            set_field Status Todo
            set_field Priority Medium
          fi
