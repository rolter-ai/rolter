name: project-automation

# adds every new issue and PR to the rolter-ai project board (#1) and seeds a
# default Status so items land triaged instead of in the untracked "no status"
# column: issues get Todo plus Priority Medium, PRs get In Review because an
# open PR is by definition waiting on review or on ci-ok.
#
# an issue or PR opened with a workflow's GITHUB_TOKEN raises no `opened`
# event, so this workflow never sees it. such a workflow dispatches this one
# instead, naming the item and optionally an Area and Effort to seed; a dispatch
# is the one event that token may start. extended.yml's `report failure` does
# this for the nightly tracking issue (#2201), and anyone can do the same by
# hand for an item that missed the board.
#
# field and option ids are resolved by *name* at run time, never pinned:
# replacing a field's option list through updateProjectV2Field mints new ids, and
# a pinned id then makes every seed fail while items land in the untracked
# "no status" column — the exact outcome this job exists to prevent (#1093,
# #1096). names survive that edit; generated ids do not.
#
# org Projects v2 are not reachable with the default GITHUB_TOKEN, so this uses
# a fine-grained PAT stored as the secret ADD_TO_PROJECT_PAT (org: projects
# read/write, repo: contents/issues/pull-requests read). pull_request_target is
# required so PRs from forks can still see the secret.
#
# github meters a PAT against the account that owns it, not against the token,
# so this job shares one graphql budget with everything else that account runs.
# every call goes through gh_graphql_once below, so a rate limit or a transient
# server error is waited out instead of failing the job on the first one, and
# when the job does give up it names the cause: an exhausted budget, throttling
# or an outage says "nothing is misconfigured", a bad or under-scoped token says
# so (#1718). a seed write reads its field again before every attempt, so a
# backoff never widens the #1469 read-then-write window. see
# docs/dev-docs/development/issue-tracking.md; the run: block below is tested
# against a fake gh by scripts/test-project-automation.sh.
on:
  issues:
    types: [opened]
  # pull_request_target is required so PRs from forks can read the org PAT; this
  # workflow never checks out PR head and passes only the project id, the
  # item's node id and url, and literal field names to run: (all through env),
  # so the usual injection risk does not apply.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened]
  workflow_dispatch:
    inputs:
      number:
        description: Number of the issue or pull request to put on the board
        required: true
        type: string
      area:
        description: Area to seed if the item has none (a board option name, e.g. ci)
        required: false
        type: string
        default: ""
      effort:
        description: Effort to seed if the item has none (XS, S, M, L or XL)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  add-to-board:
    name: add to project board
    runs-on: ubuntu-latest
    # backstop only: RETRY_WINDOW below bounds the waiting, so this fires on a
    # hang, never on a rate limit
    timeout-minutes: 25
    # the dispatch lookup reads the item with the repository token; the board
    # writes below use the PAT
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # an `opened` event carries the item's node id and url, a dispatch only
      # its number. the number reaches the script through env and must be one
      - name: resolve the dispatched item
        id: dispatched
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.number }}
        run: |
          set -euo pipefail
          if ! [[ $NUMBER =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=bad dispatch input::number must be an issue or pull request number"
            exit 1
          fi
          gh api "repos/$GH_REPO/issues/$NUMBER" --jq '
            "node-id=\(.node_id)",
            "url=\(.html_url)",
            "is-pr=\(has("pull_request"))"' >> "$GITHUB_OUTPUT"
      - name: add item to project and seed its default fields
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          PROJECT_ID: PVT_kwDOEjWga84Bdezc
          CONTENT_ID: ${{ github.event.issue.node_id || github.event.pull_request.node_id || steps.dispatched.outputs.node-id }}
          CONTENT_URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url || steps.dispatched.outputs.url }}
          IS_PR: ${{ github.event_name == 'pull_request_target' || steps.dispatched.outputs.is-pr == 'true' }}
          # seeds only a dispatch asks for; an opened event leaves both empty
          SEED_AREA: ${{ inputs.area }}
          SEED_EFFORT: ${{ inputs.effort }}
          # seconds this run may spend waiting on rate limits and outages. long
          # enough to ride out throttling and a budget that refills soon, short
          # enough that a burst of opened PRs cannot park runners for an hour
          RETRY_WINDOW: "900"
        run: |
          set -euo pipefail

          DEADLINE=$(( $(date +%s) + RETRY_WINDOW ))
          RERUN="rerun the failed job (gh run rerun $GITHUB_RUN_ID --failed) or add the item by hand (gh project item-add 1 --owner rolter-ai --url $CONTENT_URL)"
          GH_ERR=$(mktemp)

          # what a failed call said, matched case-insensitively against both
          # of gh's streams. order matters: a secondary limit also says "rate
          # limit", and a throttled call also carries an http 403
          RE_SECONDARY='secondary rate limit|abuse detection'
          RE_PRIMARY='rate limit|RATE_LIMITED'
          # gh's http client does not retry a POST on its own, so a connection
          # that drops or never opens surfaces as one of the transport errors.
          # "Content already exists" is two writers adding the same item at
          # once; the retry gets the existing item back, since
          # addProjectV2ItemById returns it rather than failing
          RE_TRANSIENT='HTTP 5[0-9][0-9]|No server is currently available|Something went wrong|timed out|timeout|connection reset|connection refused|connection lost|broken pipe|no such host|GOAWAY|TLS handshake|(^|[^a-z])EOF([^a-z]|$)|Content already exists in this project'
          RE_CONFIG='Bad credentials|HTTP 401|HTTP 403|HTTP 404|Resource not accessible|INSUFFICIENT_SCOPES|NOT_FOUND|FORBIDDEN|Could not resolve to'

          # one annotation per failure, on stderr, because callers read
          # gh_graphql's stdout as the response body
          fail() {
            local message=$2
            message=${message//'%'/%25}
            message=${message//$'\r'/}
            message=${message//$'\n'/ }
            echo "::error title=$1::$message" >&2
          }

          # one `gh api graphql "$@"` call. prints the response body and
          # returns 0 on success. on a failure it decides whether another
          # attempt is worth making: 75 with the pause in RETRY_WAIT when it
          # is, or an annotation and 1 when it is not. ATTEMPT and SECONDARY
          # count this request's attempts so far; reset both to 0 before a
          # new request, and never call this from a subshell mid-request
          gh_graphql_once() {
            local rc out msg kind now limits remaining reset limit
            ATTEMPT=$((ATTEMPT + 1))
            rc=0
            out=$(gh api graphql "$@" 2>"$GH_ERR") || rc=$?
            if [ "$rc" -eq 0 ]; then
              printf '%s\n' "$out"
              return 0
            fi
            # gh names the error on stderr and prints the response body,
            # graphql `errors` included, on stdout
            msg=$(<"$GH_ERR")
            if [ -n "$out" ]; then msg="$msg $out"; fi
            now=$(date +%s)

            shopt -s nocasematch
            if [[ $msg =~ $RE_SECONDARY ]]; then kind=secondary
            elif [[ $msg =~ $RE_PRIMARY ]]; then kind=primary
            elif [[ $msg =~ $RE_TRANSIENT ]]; then kind=transient
            elif [[ $msg =~ $RE_CONFIG ]]; then kind=config
            else kind=other
            fi
            shopt -u nocasematch

            case $kind in
              primary)
                # GET /rate_limit is free: it does not count against the
                # budget it reports
                limits=$(gh api rate_limit --jq '.resources.graphql | "\(.remaining) \(.reset) \(.limit)"' 2>/dev/null) || limits=""
                read -r remaining reset limit <<<"$limits" || true
                if [ "${remaining:-}" = "0" ] && [[ ${reset:-} =~ ^[0-9]+$ ]]; then
                  RETRY_WAIT=$(( reset - now + 5 ))
                  if (( now + RETRY_WAIT > DEADLINE )); then
                    fail "GitHub API budget exhausted" "the account behind ADD_TO_PROJECT_PAT has spent its ${limit:-5000} GraphQL points for the hour and gets them back at $(date -u -d "@$reset" '+%H:%M UTC'), after this run stops waiting. nothing is misconfigured: once the budget is back, $RERUN"
                    return 1
                  fi
                  echo "graphql budget spent; it refills at $(date -u -d "@$reset" '+%H:%M:%S UTC'), waiting ${RETRY_WAIT}s" >&2
                else
                  # refilled between the call and this check, or the
                  # endpoint did not answer: back off briefly and retry
                  RETRY_WAIT=$(( 5 * 2 ** (ATTEMPT - 1) ))
                  if (( ATTEMPT >= 6 || now + RETRY_WAIT > DEADLINE )); then
                    fail "GitHub API rate limit" "GitHub kept answering with a rate limit after $ATTEMPT attempts: $msg. nothing is misconfigured: $RERUN"
                    return 1
                  fi
                fi
                ;;
              secondary)
                # github asks for at least a minute, growing exponentially
                SECONDARY=$((SECONDARY + 1))
                RETRY_WAIT=$(( 60 * 2 ** (SECONDARY - 1) ))
                if (( now + RETRY_WAIT > DEADLINE )); then
                  fail "GitHub API secondary rate limit" "GitHub was still throttling the account behind ADD_TO_PROJECT_PAT for too many requests in a short window when this run stopped waiting. nothing is misconfigured: $RERUN"
                  return 1
                fi
                ;;
              transient)
                RETRY_WAIT=$(( 5 * 2 ** (ATTEMPT - 1) ))
                if (( ATTEMPT >= 6 || now + RETRY_WAIT > DEADLINE )); then
                  fail "GitHub API unavailable" "GitHub kept failing after $ATTEMPT attempts: $msg. nothing is misconfigured: $RERUN"
                  return 1
                fi
                ;;
              config)
                fail "project board token misconfigured" "$msg. this is not a rate limit: check that the ADD_TO_PROJECT_PAT secret is set, has not expired, and grants org Projects read/write plus repository contents, issues and pull requests read"
                return 1
                ;;
              *)
                fail "GitHub API request failed" "GitHub answered with an error this job does not recognise, so it did not retry: $msg. if it was a one-off, $RERUN"
                return 1
                ;;
            esac
            echo "attempt $ATTEMPT failed ($kind); retrying in ${RETRY_WAIT}s" >&2
            return 75
          }

          # `gh api graphql "$@"`, retried until DEADLINE. only for a call
          # that is safe to repeat unchanged: a read, or the add, which hands
          # back the existing item. a seed write goes through set_field,
          # which reads its field again before every attempt
          gh_graphql() {
            local rc
            ATTEMPT=0 SECONDARY=0
            while :; do
              rc=0
              gh_graphql_once "$@" || rc=$?
              if [ "$rc" -ne 75 ]; then return "$rc"; fi
              sleep "$RETRY_WAIT"
            done
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            fail "project board token missing" "the ADD_TO_PROJECT_PAT secret is empty or not visible to this run. this is not a rate limit: an org admin has to set it (org: projects read/write, repo: contents, issues and pull requests read)"
            exit 1
          fi

          # addProjectV2ItemById hands back the existing item when the content
          # is already on the board, so a rerun is harmless
          # shellcheck disable=SC2016
          ADDED=$(gh_graphql -f query='
            mutation($project:ID!,$content:ID!){
              addProjectV2ItemById(input:{projectId:$project,contentId:$content}){
                item { id }
              }
            }' -f project="$PROJECT_ID" -f content="$CONTENT_ID")
          ITEM_ID=$(jq -r '.data.addProjectV2ItemById.item.id // empty' <<<"$ADDED")
          if [ -z "$ITEM_ID" ]; then
            fail "project board add returned no item" "addProjectV2ItemById answered without an item id for $CONTENT_URL"
            echo "$ADDED" >&2
            exit 1
          fi
          echo "on the board as $ITEM_ID: $CONTENT_URL"

          # one query for every single-select field and its options, so the
          # names below are resolved against whatever the board looks like today.
          # $-prefixed names in the query are graphql variables, not shell vars
          # shellcheck disable=SC2016
          FIELDS=$(gh_graphql -f query='
            query($project:ID!){
              node(id:$project){
                ... on ProjectV2 {
                  fields(first:50){
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id name options { id name }
                      }
                    }
                  }
                }
              }
            }' -f project="$PROJECT_ID")

          # what the item carries right now, printed on stdout. set_field
          # calls this immediately before every write attempt:
          # `updateProjectV2ItemFieldValue` has no compare-and-set input, so
          # the seed is a read-then-write and NOT atomic, and the only
          # defence is keeping the read next to the write. see the
          # initialization contract in
          # docs/dev-docs/development/issue-tracking.md (#1469)
          read_values() {
            local values
            # shellcheck disable=SC2016
            values=$(gh_graphql -f query='
              query($item:ID!){
                node(id:$item){
                  ... on ProjectV2Item {
                    fieldValues(first:50){
                      nodes {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                          field { ... on ProjectV2SingleSelectField { name } }
                        }
                      }
                    }
                  }
                }
              }' -f item="$ITEM_ID") || return 1

            # a graphql error comes back as http 200 with a null `node`, which
            # `gh` does not always treat as a failure. left unchecked, every
            # field then reads as empty and the seed writes its defaults over
            # whatever the item already had — silently the very bug this step
            # exists to prevent. so prove the item came back before trusting
            # the absence of a value; an unreadable item is a hard failure,
            # never an "assume nothing is set"
            if [ "$(jq -r '.data.node.fieldValues.nodes | type' <<<"$values")" != "array" ]; then
              echo "::error::could not read current field values for item $ITEM_ID; refusing to seed defaults over values that may exist" >&2
              echo "$values" >&2
              return 1
            fi
            printf '%s\n' "$values"
          }

          set_field() {
            local field_name=$1 option_name=$2
            local field_id option_id values current rc

            field_id=$(jq -r --arg f "$field_name" \
              '.data.node.fields.nodes[] | select(.name == $f) | .id' <<<"$FIELDS")
            option_id=$(jq -r --arg f "$field_name" --arg o "$option_name" \
              '.data.node.fields.nodes[] | select(.name == $f)
               | .options[] | select(.name == $o) | .id' <<<"$FIELDS")

            # fail loudly and name what could not be resolved: a silently
            # skipped seed is exactly how the last drift went unnoticed
            if [ -z "$field_id" ] || [ "$field_id" = "null" ]; then
              echo "::error::project board has no single-select field named '$field_name'"
              exit 1
            fi
            if [ -z "$option_id" ] || [ "$option_id" = "null" ]; then
              echo "::error::board field '$field_name' has no option named '$option_name'"
              exit 1
            fi

            ATTEMPT=0 SECONDARY=0
            while :; do
              # read again before every attempt, a retry included: a backoff
              # can last minutes, and triage that lands during it must win.
              # reading once up front would stretch the #1469 window from one
              # call's latency to the whole wait
              values=$(read_values) || exit 1

              # seeding is initialization, not policy: a value already on the
              # item was put there deliberately and outranks our default.
              # before #1469 this ran unconditionally, so triage applied
              # seconds after creation was silently demoted — a Backlog
              # proposal became Todo and a High defect became Medium
              current=$(jq -r --arg f "$field_name" \
                '[.data.node.fieldValues.nodes[]
                  | select(.field.name == $f) | .name] | .[0] // ""' <<<"$values")
              if [ -n "$current" ]; then
                echo "::notice::$field_name is already '$current'; leaving it alone"
                return 0
              fi

              rc=0
              # shellcheck disable=SC2016
              gh_graphql_once -f query='
                mutation($project:ID!,$item:ID!,$field:ID!,$opt:String!){
                  updateProjectV2ItemFieldValue(input:{
                    projectId:$project,itemId:$item,fieldId:$field,
                    value:{singleSelectOptionId:$opt}
                  }){ projectV2Item { id } }
                }' -f project="$PROJECT_ID" -f item="$ITEM_ID" \
                   -f field="$field_id" -f opt="$option_id" || rc=$?
              if [ "$rc" -ne 75 ]; then return "$rc"; fi
              sleep "$RETRY_WAIT"
            done
          }
          # a freshly opened PR is already waiting on review and ci-ok, so it
          # starts in In Review; only issues start in Todo and carry a Priority
          if [ "$IS_PR" = "true" ]; then
            set_field Status "In Review"
          else
            set_field Status Todo
            set_field Priority Medium
          fi
          if [ -n "${SEED_AREA:-}" ]; then set_field Area "$SEED_AREA"; fi
          if [ -n "${SEED_EFFORT:-}" ]; then set_field Effort "$SEED_EFFORT"; fi
