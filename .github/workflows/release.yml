name: release

on:
  push:
    tags:
      - "v*"
  # release-plz creates release tags with the repo GITHUB_TOKEN, and GitHub
  # suppresses downstream push events for token-created refs, so a release-plz
  # tag never fires the push trigger above. dispatch from the default branch
  # with the tag to ship it: `gh workflow run release.yml -f tag=vX.Y.Z`.
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to build and publish, e.g. v0.0.3"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# least-privilege default; jobs that publish widen their own grant below
permissions:
  contents: read

jobs:
  # the whole quality/security gate for the release, asserted rather than re-run.
  #
  # this job used to sit beside `verify: uses: ./.github/workflows/quality.yml`,
  # which re-ran the entire gate here. that had to go: a local reusable workflow
  # checks out the *caller's* ref, which on a workflow_dispatch is master and not
  # `inputs.tag`, so it verified one tree while build-wheels packaged another
  # (#988). threading the tag into quality.yml fixed that but made the shared gate
  # check out an arbitrary dispatch-supplied ref in a default-branch context —
  # cache poisoning, flagged by CodeQL, and a real one.
  #
  # asserting instead of re-running settles both. every commit on master already
  # carries a `ci-ok` check-run from ci.yml, and release-plz re-runs the gate on
  # the release commit before tagging, so the tagged commit is verified by
  # construction. checking the recorded result binds the gate to the *tagged*
  # SHA — which re-running never did — costs no duplicate 20-minute run, and
  # checks out nothing.
  #
  # these are exact check-run *names*, so they rot when a scanner is renamed or
  # reconfigured — and because the job is fail-closed, a stale name blocks every
  # release rather than failing loudly at the source. that is the second half of
  # #903: the default below used to read `CodeQL,GitGuardian Security Checks`
  # and the repo variable `Analyze (rust),…`, both of which are default-setup
  # names that stopped existing when CodeQL moved to advanced setup. no release
  # could have published even once the tag dispatch was fixed. the default now
  # tracks the advanced-setup names, and a missing check prints the names that
  # *do* exist so the fix is obvious from the log.
  verify-external-checks:
    name: assert external checks green
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: assert required check-runs succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.tag || github.sha }}
          REQUIRED: ${{ vars.RELEASE_REQUIRED_CHECKS || 'ci-ok,codeql (rust),codeql (actions),codeql (python),codeql (javascript-typescript)' }}
        run: |
          set -euo pipefail
          # resolve the ref (tag on dispatch, sha on push) to a commit sha
          SHA="$(gh api "repos/$REPO/commits/$REF" -q '.sha')"
          IFS=',' read -ra names <<< "$REQUIRED"

          # release-plz dispatches this the moment it finishes tagging, while
          # ci.yml is often still running the very same commit, so a required
          # check being *pending* is expected rather than a failure. wait for a
          # verdict; only a real non-success, or the timeout, is fatal.
          deadline=$(( $(date -u +%s) + 45 * 60 ))
          while :; do
            runs="$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
              -q '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion)"')"
            fail=0; pending=""
            for name in "${names[@]}"; do
              name="$(echo "$name" | sed 's/^ *//;s/ *$//')"
              [ -z "$name" ] && continue
              line="$(echo "$runs" | grep -F -m1 "$(printf '%s\t' "$name")" || true)"
              if [ -z "$line" ]; then
                pending="$pending $name(absent)"; continue
              fi
              status="$(echo "$line" | cut -f2)"; conclusion="$(echo "$line" | cut -f3)"
              if [ "$status" != "completed" ]; then
                pending="$pending $name($status)"; continue
              fi
              if [ "$conclusion" != "success" ]; then
                echo "::error::required check '$name' concluded '$conclusion' for $SHA (need success)"; fail=1
              fi
            done
            [ "$fail" -ne 0 ] && { echo "check-runs for $SHA:"; echo "$runs"; exit 1; }
            [ -z "$pending" ] && break
            if [ "$(date -u +%s)" -ge "$deadline" ]; then
              echo "check-runs for $SHA:"; echo "$runs"
              echo "::error::still waiting on:$pending after 45m (fail-closed). if a scanner was renamed or reconfigured, update the RELEASE_REQUIRED_CHECKS repo variable to match the check-run names listed above"
              exit 1
            fi
            echo "waiting on:$pending"
            sleep 30
          done

          echo "check-runs for $SHA:"; echo "$runs"
          echo "all required checks succeeded for $SHA"

  # ── build maturin wheels ────────────────────────────────────────────────────
  build-wheels:
    name: build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: build wheels (linux)
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --out dist --manifest-path crates/rolter/Cargo.toml
          manylinux: auto
          target: x86_64

      - name: build wheels (linux aarch64)
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          # the manylinux2014 aarch64 cross toolchain drives ring's perlasm
          # through a gas that doesn't predefine __ARM_ARCH, so ring's build
          # aborts ("ARM assembler must define __ARM_ARCH"); define it here
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
        with:
          command: build
          args: --release --out dist --manifest-path crates/rolter/Cargo.toml
          manylinux: auto
          target: aarch64

      - name: build wheels (macos / windows)
        if: matrix.os != 'ubuntu-latest'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --out dist --manifest-path crates/rolter/Cargo.toml

      # `macos-latest` is Apple Silicon, so the step above yields an arm64 wheel
      # only and Intel macs get nothing installable (#989). cross-compile the
      # x86_64 slice from the same runner — the macOS SDK carries both arches,
      # so this needs no extra runner and no rosetta.
      - name: build wheels (macos x86_64)
        if: matrix.os == 'macos-latest'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --out dist --manifest-path crates/rolter/Cargo.toml
          target: x86_64-apple-darwin

      # source fallback: without an sdist a platform with no matching wheel has
      # no candidate at all and `pip install rolter` fails outright rather than
      # building from source. built once, on linux.
      - name: build sdist
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path crates/rolter/Cargo.toml

      - name: upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: dist/

  # ── publish to PyPI ─────────────────────────────────────────────────────────
  # fail-closed: publishes only when the PYPI_PUBLISH_ENABLED repo variable is
  # set to "true" AND the verify + external-check gates pass for the tagged
  # commit (ROL-103). wheels still build above as a release artifact regardless.
  publish-pypi:
    name: publish to pypi
    # the publish barrier: every build and smoke job, images included, must have
    # succeeded. `!cancelled() && !failure()` rather than a bare `vars` check
    # because build-image/smoke-image are skipped when docker publishing is off,
    # and a skipped dependency would otherwise skip this job too (#992)
    if: ${{ !cancelled() && !failure() && vars.PYPI_PUBLISH_ENABLED == 'true' }}
    needs: [verify-external-checks, build-wheels, build-image, smoke-wheels, smoke-image]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rolter/
    permissions:
      id-token: write  # trusted publishing (OIDC)
    steps:
      - name: download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      # `maturin upload` is deprecated and slated for removal (PyO3/maturin#2334);
      # the pypa action is the supported path and speaks the same OIDC trusted
      # publishing. the publisher identity is the repo + workflow filename +
      # environment, none of which change here, so the existing pypi trusted
      # publisher keeps matching. `attestations` (PEP 740) rides on the id-token
      # grant this job already holds.
      - name: publish to pypi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true
          print-hash: true

  # ── build container image (stage 1: nothing is public) ──────────────────────
  # one job per architecture, each pushing an *untagged* digest to GHCR
  # (`push-by-digest`). an untagged digest is not a release: nothing resolves
  # `:1.2.3` or `:latest` to it. the tag manifests that make it public are
  # assembled in stage 2, only once every build and smoke job has passed (#992).
  #
  # splitting per arch also lets a flaky architecture be re-run on its own, and
  # is the prerequisite for moving arm64 onto a native runner instead of QEMU,
  # which dominates release time (ROL-76).
  build-image:
    name: build image (${{ matrix.arch }})
    if: vars.DOCKER_PUBLISH_ENABLED == 'true'
    needs: [verify-external-checks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    permissions:
      contents: read
      packages: write # push the untagged digest to GHCR
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      # only the arm64 leg needs emulation; installing it on amd64 is pure cost
      - name: set up qemu (arm64 emulation)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # labels only: no `tags`, because tagging is what publishing means here
      - name: docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # hand the digest to the later stages as an empty file named after it
      - name: export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── stage 2: prove the artifacts work before anything is public ─────────────
  # nothing used to exercise a built artifact before publishing it: the pipeline
  # checked that files *existed*, never that they installed or ran. #903 asks for
  # exactly this ("verify wheels … install and report the matching
  # `rolter --version`"), and doing it pre-publish means a broken wheel is caught
  # while it is still private rather than after users can reach it.
  smoke-wheels:
    name: smoke wheel (${{ matrix.os }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # --no-index: resolve only from dist/, so this can never silently install
      # an older rolter from pypi and report a false pass
      - name: install the wheel and run it
        shell: bash
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF#v}"
          echo "artifacts:"; ls -1 dist
          python -m pip install --disable-pip-version-check --no-index --find-links dist "rolter==$VERSION"
          got="$(rolter --version)"
          echo "rolter --version -> $got"
          case "$got" in
            *"$VERSION"*) echo "version matches $VERSION" ;;
            *) echo "::error::version mismatch: expected $VERSION, got '$got'"; exit 1 ;;
          esac

  smoke-image:
    name: smoke image (${{ matrix.arch }})
    if: vars.DOCKER_PUBLISH_ENABLED == 'true'
    needs: build-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: read # pull the untagged digest back
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: download digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests

      - name: set up qemu (arm64 emulation)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the digest artifact is a single empty file named after the digest
      - name: run the image and check its version
        env:
          REF: ${{ inputs.tag || github.ref_name }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          set -euo pipefail
          VERSION="${REF#v}"
          # `find ... -print -quit` rather than `find ... | head -1`: head closes
          # the pipe after the first line, so find can take SIGPIPE and fail the
          # whole step under pipefail even though it already found the digest.
          # letting find stop itself keeps the pipeline out of it entirely (#1306)
          digest_file="$(find /tmp/digests -maxdepth 1 -type f -print -quit)"
          if [ -z "$digest_file" ]; then
            echo "::error::no digest file in /tmp/digests for ${PLATFORM}"
            exit 1
          fi
          digest="$(basename "$digest_file")"
          image="$REGISTRY_IMAGE@sha256:$digest"
          echo "running $image on $PLATFORM"
          got="$(docker run --rm --platform "$PLATFORM" "$image" /usr/local/bin/rolter --version)"
          echo "rolter --version -> $got"
          case "$got" in
            *"$VERSION"*) echo "version matches $VERSION" ;;
            *) echo "::error::version mismatch: expected $VERSION, got '$got'"; exit 1 ;;
          esac

  # ── publish docker images (stage 3: GHCR + optional Docker Hub) ─────────────
  # assembles the multi-arch tag manifests from the digests stage 1 pushed. this
  # is the moment the image becomes public, and it needs *every* build and smoke
  # job — wheels included — so a failed wheel can no longer leave images
  # published against a release that has nothing on pypi (#992).
  #
  # GHCR always publishes (via GITHUB_TOKEN). Docker Hub is added when the
  # DOCKERHUB_IMAGE repo variable (e.g. docker.io/acme/rolter) plus the
  # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are present — the image repo name
  # (`rolter`) and tags stay identical across both registries.
  publish-docker:
    name: publish docker images
    # `!cancelled() && !failure()` rather than a bare `vars` check: build-image
    # and smoke-image are skipped when docker publishing is off, and a skipped
    # dependency would otherwise skip this job too
    if: ${{ !cancelled() && !failure() && vars.DOCKER_PUBLISH_ENABLED == 'true' }}
    needs: [verify-external-checks, build-wheels, build-image, smoke-wheels, smoke-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR under the repo owner
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - name: resolve version
        id: ver
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: log in to Docker Hub
        if: vars.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # the same tag set is applied to every image below, so GHCR and Docker Hub
      # stay aligned. DOCKERHUB_IMAGE is omitted (blank line ignored) when unset.
      - name: docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      # imagetools copies blobs across registries when a target differs from the
      # source, so the one call publishes to Docker Hub as well as GHCR
      - name: create manifest lists
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          echo "digests to assemble:"; ls -1
          # DOCKER_METADATA_OUTPUT_JSON is the flat metadata document
          # (`{"tags":[…],"labels":{…}}`); `.target."docker-metadata-action"` is
          # the *bake* shape, exported separately as the bake file. reading the
          # bake path here made jq emit "Cannot iterate over null" and imagetools
          # abort with "can't push with no tags specified", so no manifest was
          # ever assembled and ghcr never got the 0.0.11 tag (#1031).
          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          if [ -z "$tags" ]; then
            echo "::error::no tags resolved from DOCKER_METADATA_OUTPUT_JSON"
            exit 1
          fi
          echo "assembling tags: $tags"
          # shellcheck disable=SC2046,SC2086  # word splitting is how the args are built
          docker buildx imagetools create $tags \
            $(printf "$REGISTRY_IMAGE@sha256:%s " *)

      - name: inspect published manifest
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: docker buildx imagetools inspect "$REGISTRY_IMAGE:$VERSION"

  # ── release parity gate ─────────────────────────────────────────────────────
  # #903 shipped five releases where the github release and crates.io advanced
  # while pypi stayed on 0.0.5, and nothing anywhere went red. this job is the
  # regression guard: it asserts every distribution channel actually serves the
  # tagged version, and fails the release run when one of them does not. it runs
  # with `always()` so a skipped or failed publish is reported rather than
  # silently dragging the whole run to "skipped".
  verify-parity:
    name: verify release parity
    if: always()
    needs: [verify-external-checks, build-wheels, build-image, smoke-wheels, smoke-image, publish-pypi, publish-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # read back the GHCR manifest we just pushed
    steps:
      - name: assert every enabled channel serves the tagged version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF: ${{ inputs.tag || github.ref_name }}
          PYPI_ENABLED: ${{ vars.PYPI_PUBLISH_ENABLED }}
          DOCKER_ENABLED: ${{ vars.DOCKER_PUBLISH_ENABLED }}
          CHECKS_RESULT: ${{ needs.verify-external-checks.result }}
          WHEELS_RESULT: ${{ needs.build-wheels.result }}
          IMAGE_RESULT: ${{ needs.build-image.result }}
          SMOKE_WHEELS_RESULT: ${{ needs.smoke-wheels.result }}
          SMOKE_IMAGE_RESULT: ${{ needs.smoke-image.result }}
          PYPI_RESULT: ${{ needs.publish-pypi.result }}
          DOCKER_RESULT: ${{ needs.publish-docker.result }}
        run: |
          set -euo pipefail
          VERSION="${REF#v}"
          fail=0
          note() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          note "### release parity for \`$REF\`"; note ""

          require_job() {
            # $1 job name, $2 result
            if [ "$2" != "success" ]; then
              echo "::error::job '$1' did not succeed (result=$2)"
              note "- ❌ job \`$1\`: $2"
              fail=1
            else
              note "- ✅ job \`$1\`"
            fi
          }
          require_job verify-external-checks "$CHECKS_RESULT"
          require_job build-wheels "$WHEELS_RESULT"
          require_job smoke-wheels "$SMOKE_WHEELS_RESULT"

          # github release
          if gh api "repos/$REPO/releases/tags/$REF" -q '.tag_name' > /dev/null 2>&1; then
            note "- ✅ github release \`$REF\`"
          else
            echo "::error::no github release for $REF"; note "- ❌ github release \`$REF\` missing"; fail=1
          fi

          # crates.io (published by release-plz before this workflow is dispatched)
          if curl -sfL -H 'User-Agent: rolter-release-parity (github.com/rolter-ai/rolter)' \
               https://crates.io/api/v1/crates/rolter \
               | jq -e --arg v "$VERSION" '.versions | map(.num) | index($v)' > /dev/null; then
            note "- ✅ crates.io \`rolter $VERSION\`"
          else
            echo "::error::crates.io does not serve rolter $VERSION"
            note "- ❌ crates.io \`rolter $VERSION\` missing"; fail=1
          fi

          # pypi — only asserted when publishing is enabled. the index takes a
          # moment to reflect a fresh upload, so poll rather than race it.
          if [ "$PYPI_ENABLED" = "true" ]; then
            require_job publish-pypi "$PYPI_RESULT"
            found=0
            for _ in $(seq 1 20); do
              if curl -sfL https://pypi.org/pypi/rolter/json \
                   | jq -e --arg v "$VERSION" '.releases | has($v)' > /dev/null; then
                found=1; break
              fi
              sleep 15
            done
            if [ "$found" = "1" ]; then
              note "- ✅ pypi \`rolter $VERSION\`"

              # a version being present is not the same as it being installable
              # everywhere: v0.0.10 published four wheels and no sdist, so intel
              # macs had no candidate at all and nothing went red (#989). assert
              # the whole expected artifact set, by platform tag rather than by
              # exact filename (the macos version prefix floats).
              files="$(curl -sfL "https://pypi.org/pypi/rolter/$VERSION/json" | jq -r '.urls[].filename')"
              echo "pypi artifacts for $VERSION:"; echo "$files"
              expect() {
                # $1 human label, $2 grep -E pattern
                if printf '%s\n' "$files" | grep -Eq "$2"; then
                  note "  - ✅ $1"
                else
                  echo "::error::pypi is missing the $1 artifact for $VERSION"
                  note "  - ❌ $1 missing"; fail=1
                fi
              }
              expect "linux x86_64 wheel"  'manylinux.*x86_64\.whl$'
              expect "linux aarch64 wheel" 'manylinux.*aarch64\.whl$'
              expect "macos arm64 wheel"   'macosx.*arm64\.whl$'
              expect "macos x86_64 wheel"  'macosx.*x86_64\.whl$'
              expect "windows wheel"       'win_amd64\.whl$'
              expect "sdist"               '\.tar\.gz$'
            else
              echo "::error::pypi does not serve rolter $VERSION after 5m"
              note "- ❌ pypi \`rolter $VERSION\` missing"; fail=1
            fi
          else
            note "- ⏭️ pypi publishing disabled (PYPI_PUBLISH_ENABLED != true)"
          fi

          if [ "$DOCKER_ENABLED" = "true" ]; then
            require_job build-image "$IMAGE_RESULT"
            require_job smoke-image "$SMOKE_IMAGE_RESULT"
            require_job publish-docker "$DOCKER_RESULT"
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
            if docker manifest inspect "ghcr.io/${REPO}:${VERSION}" > /dev/null 2>&1; then
              note "- ✅ ghcr \`${REPO}:${VERSION}\`"
            else
              echo "::error::ghcr has no ${REPO}:${VERSION} manifest"
              note "- ❌ ghcr \`${REPO}:${VERSION}\` missing"; fail=1
            fi
          else
            note "- ⏭️ docker publishing disabled (DOCKER_PUBLISH_ENABLED != true)"
          fi

          exit $fail
