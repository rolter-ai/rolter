name: engine integration

# the default engine is a lightweight vLLM API simulator (llm-d-inference-sim),
# cheap enough to run as a normal PR check; dispatch with engine=vllm to smoke
# the real CPU engine on demand
on:
  pull_request:
    paths:
      - "docker/docker-compose.engines.yml"
      - "integration/engines/**"
      - "justfile"
      - ".github/workflows/engine-integration.yml"
  workflow_dispatch:
    inputs:
      engine:
        description: Engine to smoke through rolter
        required: false
        type: choice
        options: [sim, vllm]
        default: sim
      benchmark:
        description: Run the non-gating direct-vs-rolter benchmark too
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# a new push to a pr cancels that pr's in-flight smoke, whose result no longer
# describes the branch. a dispatch gets a per-run group instead, so two
# dispatches on one branch (a sim and a vllm, say) never cancel each other or
# queue behind each other
concurrency:
  group: engine-integration-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: ${{ inputs.engine || 'sim' }} smoke
    # CPU-only on GitHub-hosted runners: this is an API/SSE compatibility test,
    # not an inference-engine performance benchmark.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      # this workflow never runs on master, and a cache saved on a pull request
      # is visible to that pull request alone, so a cache of its own never
      # warms (#2203). it restores quality.yml's `rust build` cache instead,
      # which master saves: that job builds the same `cargo build -p
      # rolter-gateway`, and the wild linker is here because its rustflags are
      # part of every unit's fingerprint, so without them nothing restored
      # would be reused. keep the toolchain, linker and key in step with that
      # job. nothing built here is published, so the cache cannot poison a
      # release
      - uses: ./.github/actions/wild-linker
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          shared-key: rust-build
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: set up Docker Buildx
        if: (inputs.engine || 'sim') == 'vllm'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build cached vLLM CPU image
        if: (inputs.engine || 'sim') == 'vllm'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: integration/engines/docker/vllm-cpu.Dockerfile
          load: true
          tags: rolter-vllm-cpu:v0.24.0
          cache-from: type=gha,scope=rolter-vllm-cpu
          cache-to: type=gha,mode=max,scope=rolter-vllm-cpu
      # --bench runs the smoke assertions first, so one invocation covers both
      - name: smoke through rolter
        run: integration/engines/run.sh ${{ inputs.engine || 'sim' }} ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark && '--bench' || '' }}
      - name: upload logs and benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.engine || 'sim' }}-artifacts
          path: artifacts/engines/${{ inputs.engine || 'sim' }}
          if-no-files-found: warn
