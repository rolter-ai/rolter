name: release-plz

on:
  push:
    branches: [master]

# least-privilege default; only the two release-plz jobs need write (the
# `verify` reusable call runs read-only), so the write grant lives per-job below
permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # opens / updates the "Release PR": version bumps + changelog from
  # conventional commits. nothing publishes until that PR is merged.
  release-plz-pr:
    name: release-plz pr
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch
      pull-requests: write # open/update the release PR
    steps:
      # release-plz pushes the release branch with the persisted token, so
      # persist-credentials must stay on here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: run release-plz
        id: release_pr
        uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5.133
        with:
          command: release-pr
          config: .github/config/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # release-plz bumps the workspace version but knows nothing about the helm
      # chart, so `appVersion` — the value an operator reads to know which rolter
      # a release deploys — drifted three releases behind before anyone noticed
      # (#1140). reconcile it on the release branch itself, so the release PR is
      # already consistent rather than needing a follow-up commit. the same check
      # runs in `quality.yml`, which is what catches it if this step ever stops
      # working.
      - name: sync chart appVersion onto the release branch
        if: steps.release_pr.outputs.prs_created == 'true'
        env:
          PRS: ${{ steps.release_pr.outputs.prs }}
        run: |
          set -euo pipefail
          branch="$(printf '%s' "$PRS" | jq -r '.[0].head_branch // ""')"
          if [ -z "$branch" ]; then
            echo "::error::release-plz reported a created PR with no head_branch"
            exit 1
          fi
          git fetch origin "$branch"
          git checkout "$branch"
          python3 scripts/sync-chart-appversion.py --fix
          if git diff --quiet -- charts/rolter/Chart.yaml; then
            echo "chart appVersion already matched; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "chore(release): sync chart appVersion" \
            -- charts/rolter/Chart.yaml
          git push origin "$branch"

  # ── make the release PR gateable ────────────────────────────────────────────
  # `ci-ok` is the only required status check on master, and only ci.yml reports
  # it. release-plz pushes the release branch and opens its PR with the repo
  # GITHUB_TOKEN, and GitHub suppresses downstream events for token-created refs
  # and PRs, so ci.yml never ran on a release PR: the required context was never
  # reported, the PR sat at BLOCKED, and every release shipped through an admin
  # bypass (#1025). that is the same suppression that cost us the wheels in #903,
  # and the fix is the same one — `workflow_dispatch` always creates a run, even
  # from the GITHUB_TOKEN, and its check-runs attach to the head commit of the
  # ref, which is the release PR's head.
  #
  # this runs after release-plz-pr so it picks up the head the `sync chart
  # appVersion` step leaves behind, and it looks the branch up from the open PRs
  # rather than from the action's `prs` output: that output is only populated on
  # the run that *creates* the PR, while the branch is force-pushed on every
  # later master commit and needs re-gating each time.
  dispatch-release-pr-ci:
    name: dispatch release pr ci
    needs: release-plz-pr
    runs-on: ubuntu-latest
    permissions:
      actions: write # workflow_dispatch ci.yml; nothing else is needed
      pull-requests: read # find the open release PR
    steps:
      - name: dispatch ci.yml against the release branch
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # release-plz names the branch after the base it releases from
          # (`release-plz-<base>`); match on the prefix so a config change to the
          # suffix does not silently stop gating releases
          branch="$(gh api "repos/$REPO/pulls?state=open&per_page=100" \
            -q '[.[] | select(.head.ref | startswith("release-plz-")) | .head.ref] | .[0] // ""')"
          if [ -z "$branch" ]; then
            echo "no open release PR on this push; nothing to gate"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # seconds since epoch, used to distinguish our run from older ones
          started="$(date -u +%s)"
          gh workflow run ci.yml --repo "$REPO" --ref "$branch"
          echo "dispatched ci.yml for $branch"
          {
            echo "branch=$branch"
            echo "started=$started"
          } >> "$GITHUB_OUTPUT"

      # a dispatch that silently produced no run would leave the release PR
      # exactly as blocked as before, and this job green — so confirm it landed
      - name: confirm the ci run started
        if: steps.dispatch.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.dispatch.outputs.branch }}
          STARTED: ${{ steps.dispatch.outputs.started }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            # the query must live in the path: `gh api` silently switches to POST
            # as soon as any -f/-F parameter is set, which 404s this GET-only
            # endpoint (#1026). `|| true` keeps a transient api error inside the
            # loop rather than failing the job on one bad response.
            runs="$(gh api \
              "repos/$REPO/actions/workflows/ci.yml/runs?event=workflow_dispatch&branch=$BRANCH&per_page=20" \
              -q ".workflow_runs[] | select((.created_at | fromdateiso8601) >= ($STARTED - 120)) | .html_url" \
              || true)"
            if [ -n "$runs" ]; then
              echo "ci run(s) gating $BRANCH:"; echo "$runs"
              {
                echo "### release pr ci dispatched"
                echo
                echo "branch: \`$BRANCH\`"
                while IFS= read -r url; do echo "- $url"; done <<< "$runs"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::dispatched ci.yml for $BRANCH but no workflow run appeared within 5m"
          exit 1

  # on merge of the release PR: publishes every workspace member to crates.io
  # in dependency order (`publish = true` in .github/config/release-plz.toml, using
  # CARGO_REGISTRY_TOKEN), tags `v{version}` and creates the github release.
  # the tag alone does NOT start release.yml — see dispatch-artifact-release.
  # same quality/security gate as CI, on the merge commit that would be
  # tagged/published. release-plz-release needs this so cargo publish cannot
  # run on an unverified commit (ROL-103).
  verify:
    uses: ./.github/workflows/quality.yml

  release-plz-release:
    name: release-plz release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags + create the github release
      pull-requests: write # release-plz reconciles the release PR state
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # release-plz pushes tags with the persisted token, so persist-credentials
      # must stay on here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: run release-plz
        id: release
        uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5.133
        with:
          command: release
          config: .github/config/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # release-plz reports a `tag` for *every* published crate, whether or not
      # git_tag_enable is set for it — the crates.io-only members get a derived
      # `<crate>-v<version>` string that was never pushed to git. only
      # rolter-gateway carries git_tag_enable (`v{{ version }}`), so select that
      # entry by name rather than taking the first tagged one, which resolved to
      # `rolter-core-v0.0.11` and handed release.yml a ref that does not exist
      # (#1026). an empty tag means nothing was released on this push (the common
      # case for a non-release commit), and the dispatch job below is skipped.
      - name: resolve release tag
        id: tag
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          set -euo pipefail
          tag="$(printf '%s' "${RELEASES:-}" \
            | jq -r 'if . == null then [] else . end
                     | map(select(.package_name == "rolter-gateway"))
                     | .[0].tag // ""' \
            || true)"
          echo "resolved release tag: '${tag}'"
          # the tag must be one release.yml can check out; a derived crate tag is
          # never pushed, so fail loudly here instead of dispatching a bad ref
          if [ -n "$tag" ] && ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::resolved tag '$tag' is not a vX.Y.Z release tag"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  # ── hand off to the artifact release ────────────────────────────────────────
  # release-plz tags with the repo GITHUB_TOKEN, and GitHub suppresses downstream
  # events for token-created refs, so release.yml's `push: tags` trigger never
  # fires for a real release (that is how v0.0.6-v0.0.10 shipped a github release
  # and crates.io but never a wheel — #903). `workflow_dispatch` is the documented
  # exception: it always creates a run, even from the GITHUB_TOKEN. dispatching it
  # here is therefore the one handoff that cannot be suppressed.
  dispatch-artifact-release:
    name: dispatch artifact release
    needs: release-plz-release
    if: needs.release-plz-release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write # workflow_dispatch release.yml; nothing else is needed
    steps:
      - name: dispatch release.yml for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          TAG: ${{ needs.release-plz-release.outputs.tag }}
        run: |
          set -euo pipefail
          # seconds since epoch, used to distinguish our run from older ones
          started="$(date -u +%s)"
          gh workflow run release.yml --repo "$REPO" --ref "$REF" -f tag="$TAG"
          echo "dispatched release.yml for $TAG on $REF"
          echo "started=$started" >> "$GITHUB_ENV"

      # a dispatch that silently fails to produce a run would put us straight
      # back in the #903 hole, so confirm the run exists before going green
      - name: confirm exactly one run started
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-plz-release.outputs.tag }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            # the query must live in the path: `gh api` silently switches to POST
            # as soon as any -f/-F parameter is set, which 404s this GET-only
            # endpoint and — under `set -e` — aborted the retry loop on the first
            # pass even though the dispatch had worked (#1026). `|| true` keeps a
            # transient api error inside the loop rather than failing the job.
            runs="$(gh api \
              "repos/$REPO/actions/workflows/release.yml/runs?event=workflow_dispatch&per_page=20" \
              -q ".workflow_runs[] | select((.created_at | fromdateiso8601) >= ($started - 120)) | .html_url" \
              || true)"
            count="$(printf '%s' "$runs" | grep -c . || true)"
            if [ "$count" -ge 1 ]; then
              echo "artifact release run(s) for $TAG:"; echo "$runs"
              {
                echo "### artifact release dispatched"
                echo
                echo "tag: \`$TAG\`"
                while IFS= read -r url; do echo "- $url"; done <<< "$runs"
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "$count" -gt 1 ]; then
                echo "::warning::$count dispatched release runs started; expected exactly 1"
              fi
              exit 0
            fi
            sleep 15
          done
          echo "::error::dispatched release.yml for $TAG but no workflow run appeared within 5m"
          exit 1
