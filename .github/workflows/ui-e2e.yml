name: ui e2e (playwright)

# browser-level e2e for the dashboard SPA (#619). heavy (builds + boots the full
# fake-vLLM stack, downloads a browser), so it is NOT part of the default PR
# gate: run it on demand or nightly. fake upstreams only — no secrets.
#
# nothing gates on this workflow, so a red nightly used to sit unread in the
# Actions tab: master failed every day from 2026-09-26 until someone dispatched
# the suite by hand (#2677). `report failure` now opens or updates a tracking
# issue, the same way extended.yml's does. it is not a PR check because one run
# holds a runner for about ten minutes and most PRs touch ui/, which the 20-slot
# pool cannot absorb (ADR-0034, #2025); dispatch it on a branch instead.
#
# only `report failure` writes anything, and it holds `issues: write` and
# `actions: write` at job level with no checkout: at workflow level zizmor rates
# those scopes high and fails the gate.
on:
  workflow_dispatch:
  schedule:
    # nightly at 03:17 UTC
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  # throwaway AES-256-GCM envelope key for provider api_key sealing (base64 of a
  # readable 32-byte phrase; matches integration/e2e/rolter_e2e/stack.py). never
  # a real secret.
  ROLTER_KEK: cm9sdGVyLWUyZS10ZXN0LWtlay1ub3Qtc2VjcmV0ISE=

jobs:
  e2e:
    name: dashboard journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: bring up the fake-vLLM stack
        run: |
          docker compose -f integration/e2e/docker-compose.e2e.yml \
            up -d --build --wait --wait-timeout 360

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # one pin for every setup-bun step in the repo (#1922)
          bun-version-file: .bun-version

      - name: install ui deps
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: install chromium (playwright)
        working-directory: ui
        run: bunx playwright install --with-deps chromium

      - name: run e2e
        working-directory: ui
        # the vite dev server (started by playwright) proxies /api -> control:4001
        # and /gw -> gateway:4000, both published by the compose stack
        run: bun run e2e

      - name: upload playwright artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/e2e/.output
          retention-days: 7

      - name: tear down the stack
        if: ${{ always() }}
        run: docker compose -f integration/e2e/docker-compose.e2e.yml down -v --remove-orphans

  # ── report failure: one tracking issue for the whole workflow ──────────────
  # a copy of extended.yml's job of the same name, with its own issue title so
  # the two suites never share an issue. opens the issue the first time a run
  # fails and comments on it while it stays open; close it once the fix lands
  # and the next failure opens a fresh one. master only: a dispatch on a branch
  # is someone trying a change, and its failure belongs in that run. the run
  # url, ref and result reach the script through env, never inline in run:
  #
  # an issue this token opens raises no `issues` event, so project-automation
  # never sees it (#2201): the job sets the milestone and dispatches
  # project-automation.yml itself, both best-effort and warning only
  report-failure:
    name: report failure
    needs: [e2e]
    if: ${{ !cancelled() && needs.e2e.result == 'failure' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: write
    steps:
      - name: open or comment on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          E2E: ${{ needs.e2e.result }}
          MILESTONE: Maintenance, CI & DX
        run: |
          set -euo pipefail
          title="ui-e2e.yml: dashboard journeys failing"
          body="$(printf '%s\n' \
            "[Run]($RUN_URL) on \`$REF\` at \`$SHA\`:" \
            "" \
            "| job | result |" \
            "| --- | --- |" \
            "| dashboard journeys | $E2E |" \
            "" \
            "The run's \`playwright-report\` artifact holds the trace and screenshots of each failing journey.")"
          number="$(gh issue list --state open --label ci --limit 200 --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "commented on #$number" >> "$GITHUB_STEP_SUMMARY"
          else
            url="$(gh issue create --title "$title" --label ci \
              --body "$(printf '%s\n\n%s\n' "$body" "Opened by the \`report failure\` job. Close it once the failing journeys are fixed; the next failure opens a new one.")")"
            echo "opened $url" >> "$GITHUB_STEP_SUMMARY"
            number="${url##*/}"
            if ! gh issue edit "$number" --milestone "$MILESTONE"; then
              echo "::warning title=report failure::could not set the milestone of #$number to $MILESTONE; set it by hand"
            fi
            if ! gh workflow run project-automation.yml --ref "$REF" \
              -f number="$number" -f area=ui -f effort=S; then
              echo "::warning title=report failure::could not dispatch project-automation for #$number; add it by hand: gh workflow run project-automation.yml -f number=$number -f area=ui -f effort=S"
            fi
          fi
