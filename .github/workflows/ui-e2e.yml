name: ui e2e (playwright)

# browser-level e2e for the dashboard SPA (#619). heavy (builds + boots the full
# fake-vLLM stack, downloads a browser), so it is NOT part of the default PR
# gate: run it on demand or nightly. fake upstreams only — no secrets.
#
# nothing gates on this workflow, so a red nightly used to sit unread in the
# Actions tab: master failed every day from 2026-09-26 until someone dispatched
# the suite by hand (#2677). `report failure` now opens or updates a tracking
# issue, the same way extended.yml's and sso-e2e.yml's do. it is not a PR check
# because one run holds a runner for about ten minutes and most PRs touch ui/,
# which the 20-slot pool cannot absorb (ADR-0034, #2025); dispatch it on a
# branch instead.
#
# only `report failure` writes anything: it calls report-failure.yml, shared
# with the other nightly suites (#2682), and holds `issues: write` and
# `actions: write` at job level: at workflow level zizmor rates those scopes
# high and fails the gate.
on:
  workflow_dispatch:
  schedule:
    # nightly at 03:17 UTC
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  e2e:
    name: dashboard journeys
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: generate a throwaway envelope key
        # sealing provider api_keys needs a 32-byte base64 KEK; a fresh one per run
        # keeps a key out of the repository and is all the stack needs
        run: |
          kek="$(openssl rand -base64 32)"
          echo "::add-mask::${kek}"
          echo "ROLTER_KEK=${kek}" >> "$GITHUB_ENV"

      - name: bring up the fake-vLLM stack
        run: |
          docker compose -f integration/e2e/docker-compose.e2e.yml \
            up -d --build --wait --wait-timeout 360

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # one pin for every setup-bun step in the repo (#1922)
          bun-version-file: .bun-version

      - name: install ui deps
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: install chromium (playwright)
        working-directory: ui
        run: bunx playwright install --with-deps chromium

      - name: run e2e
        working-directory: ui
        # the vite dev server (started by playwright) proxies /api -> control:4001
        # and /gw -> gateway:4000, both published by the compose stack
        run: bun run e2e

      - name: upload playwright artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/e2e/.output
          retention-days: 7

      - name: tear down the stack
        if: ${{ always() }}
        run: docker compose -f integration/e2e/docker-compose.e2e.yml down -v --remove-orphans

  # ── report failure: one tracking issue for the whole workflow ──────────────
  # opens the issue the first time a run fails and comments on it while it stays
  # open; close it once the fix lands and the next failure opens a fresh one.
  # master only: a dispatch on a branch is someone trying a change, and its
  # failure belongs in that run. the logic and the issue's triage are
  # report-failure.yml's, shared with extended.yml and sso-e2e.yml (#2682)
  report-failure:
    name: report failure
    needs: [e2e]
    if: ${{ !cancelled() && needs.e2e.result == 'failure' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      issues: write
      actions: write
    uses: ./.github/workflows/report-failure.yml
    with:
      title: "ui-e2e.yml: dashboard journeys failing"
      area: ui
      effort: S
      results: |
        dashboard journeys|${{ needs.e2e.result }}
      note: The run's `playwright-report` artifact holds the trace and screenshots of each failing journey.
