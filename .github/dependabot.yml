# dependency version updates. security alerts are enabled repo-side; this adds
# scheduled version bumps so pinned deps (e.g. scalar_api_reference, whose crate
# embeds the Scalar JS bundle we serve at /docs) don't silently go stale.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # the ui workspace is bun-managed, and dependabot speaks bun directly since
  # bun >= 1.1.39. it used to run here as the npm ecosystem against a
  # package-lock.json kept solely for dependabot's benefit — which moved
  # package.json without ever writing bun.lock, so every merged bump left
  # master's lockfile stale and reded every other open PR (#1137).
  #
  # the trade: the bun ecosystem does version updates but not security updates.
  # dependabot *alerts* still fire on ui dependencies, and
  # .github/workflows/ui-security-updates.yml raises the security PR dependabot
  # would have opened (#1148). drop that workflow once bun security updates ship.
  - package-ecosystem: bun
    directory: /ui
    schedule:
      interval: weekly
    groups:
      ui-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
