# rolter bootstrap config
#
# copy to rolter.toml and adjust. secrets should come from environment variables
# referenced by `api_key_env`, not be written inline.

[server]
host = "0.0.0.0"
port = 4000
# path the prometheus metrics endpoint is served on. change it when an upstream
# app or sidecar already owns /metrics behind the same reverse proxy. defaults
# to "/metrics"; must be rooted and must not collide with a built-in route.
# metrics_path = "/internal/metrics"
# secret mixed into virtual-key digests (keeps plaintext keys out of gateway
# memory). prefer the ROLTER_KEY_PEPPER env var over writing it inline.
# key_pepper = "change-me"
# max accepted request body size in bytes. raises axum's restrictive 2 MiB
# default so large prompts / base64 images / audio uploads aren't rejected; an
# oversized body gets an openai-style 413. defaults to 33554432 (32 MiB).
# max_body_bytes = 33554432

# --- update check ---
# not a config key: the control plane and the `rolter` cli read the
# ROLTER_UPDATE_CHECK environment variable. unset, they ask github once at boot
# (and every six hours / once a day) whether a newer stable release exists, so
# the dashboard footer and the cli can say so. ROLTER_UPDATE_CHECK=false turns
# that off for an air-gapped deployment; offline is silent either way.

# --- outbound TLS trust ---
# PEM certificates in these files are added to the normal public-root trust
# store. ROLTER_CA_BUNDLE overrides this global list with one container path.
# [tls]
# ca_bundles = ["/etc/rolter/ca/private-root.pem"]

# --- providers: where rolter can forward to ---
#
# two config tiers (ADR-0022), same shape for [providers] and [provider_groups]:
#   [[providers.readonly]]  immutable, config-owned, rejected by the CRUD API
#   [[providers.default]]   seeded into the DB once at startup, then editable
#                           via the API/UI (not config-owned)
# the bare [[providers]] array below is a deprecated alias for the readonly tier
# and is treated as all-readonly; new configs should prefer the explicit tiers.

[[providers]]
name = "openai"
kind = "openai"
api_base = "https://api.openai.com"
api_key_env = "OPENAI_API_KEY"
# egress_proxy = "http://corp-proxy:3128"   # legacy one-element proxy pool
# egress_proxies = ["${PROVIDER_PROXY_EU}", "socks5h://proxy-us:1080"]
# ca_bundles = ["/etc/rolter/ca/openai.pem"] # optional provider override

[[providers]]
name = "anthropic"
kind = "anthropic"
api_base = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

[[providers]]
name = "openrouter"
kind = "openrouter"
api_base = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
# A hosted kind is pinned to its vendor's host, so a config edit cannot redirect
# the key somewhere else. Set `allow_custom_api_base = true` when the endpoint
# genuinely is elsewhere — an egress proxy in front of the vendor, a compatible
# endpoint, or a local fake for testing. `rolter check` reports every provider
# that sets it, and `--strict` fails on it. See ADR-0029.
# allow_custom_api_base = true

# OpenAI-compatible cloud-provider endpoints (uncomment the providers you use).
# Azure uses `api-key`; Bedrock and Vertex use bearer tokens.
# [[providers]]
# name = "azure"
# kind = "azure_openai"
# api_base = "https://RESOURCE.openai.azure.com/openai/v1"
# api_key_env = "AZURE_OPENAI_API_KEY"
#
# [[providers]]
# name = "bedrock"
# kind = "bedrock"
# api_base = "https://bedrock-runtime.us-east-1.amazonaws.com/v1"
# api_key_env = "AWS_BEARER_TOKEN_BEDROCK"
#
# [[providers]]
# name = "vertex"
# kind = "vertex"
# api_base = "https://aiplatform.googleapis.com/v1/projects/PROJECT/locations/global/endpoints/openapi"
# api_key_env = "VERTEX_ACCESS_TOKEN"

# Hosted OpenAI-compatible clouds (bearer key from api_key_env; inline keys
# rejected). rolter strips the leading /v1 from the gateway path and appends it
# to the version already in api_base.
# [[providers]]
# name = "gemini"
# kind = "gemini"
# api_base = "https://generativelanguage.googleapis.com/v1beta/openai"
# api_key_env = "GEMINI_API_KEY"
#
# gemini_native talks Gemini's native generateContent wire format: rolter
# translates OpenAI/Anthropic requests to `:generateContent` (SSE:
# `:streamGenerateContent`) and back, embedding the model + method in the url.
# api_base points at the version root (no /openai suffix).
# [[providers]]
# name = "gemini-native"
# kind = "gemini_native"
# api_base = "https://generativelanguage.googleapis.com/v1beta"
# api_key_env = "GEMINI_API_KEY"
#
# gemini_interactions talks Gemini's stateful Interactions API: rolter maps
# OpenAI/Anthropic/Responses requests onto `{api_base}/interactions` and back.
# The interaction id comes back as the response id; resume a thread with
# `previous_response_id` (Responses) or `previous_interaction_id`.
# [[providers]]
# name = "gemini-interactions"
# kind = "gemini_interactions"
# api_base = "https://generativelanguage.googleapis.com/v1beta"
# api_key_env = "GEMINI_API_KEY"
#
# [[providers]]
# name = "mistral"
# kind = "mistral"
# api_base = "https://api.mistral.ai/v1"
# api_key_env = "MISTRAL_API_KEY"
#
# [[providers]]
# name = "groq"
# kind = "groq"
# api_base = "https://api.groq.com/openai/v1"
# api_key_env = "GROQ_API_KEY"
#
# [[providers]]
# name = "xai"
# kind = "xai"
# api_base = "https://api.x.ai/v1"
# api_key_env = "XAI_API_KEY"

# direct Cloud access requires an environment-sourced bearer key
[[providers]]
name = "ollama-cloud"
kind = "ollama_cloud"
api_base = "https://ollama.com"
api_key_env = "OLLAMA_API_KEY"

[[providers]]
name = "vllm-1"
kind = "openai_compatible"
api_base = "http://localhost:8001"
# [providers.kv_events]
# endpoint = "tcp://localhost:5557"
# topic = "kv-events"
# max_blocks = 1000000
# stale_secs = 30
# [providers.lmcache]
# endpoint = "http://localhost:9000/v1/occupancy"
# refresh_secs = 2
# stale_secs = 10
# OpenAI-compatible providers default to `system_only`: developer instructions
# become system instructions, preserving their order. Override only when the
# configured model template explicitly supports developer messages.
# role_profile = "openai"
# [providers.model_role_profiles]
# "custom-developer-template" = "openai"

[[providers]]
name = "vllm-2"
kind = "openai_compatible"
api_base = "http://localhost:8002"

# self-hosted ollama needs no api key. use http://ollama:11434 from the
# docker compose network; rolter appends the /v1 endpoint paths itself.
[[providers]]
name = "ollama"
kind = "ollama"
api_base = "http://localhost:11434"

# --- routes: public model name -> upstream targets + strategy ---

[[routes]]
model = "gpt-4o"
strategy = "round_robin"
# admin-set default inference params injected into the request body. an unset
# param passes through untouched. param_policy governs whether callers may
# override a default: mode "allow" (default) lets callers override anything not
# in `deny`; mode "deny" pins every default except those in `allow`. when an
# override is denied the admin default silently wins.
# [routes.params]
# temperature = 0.0        # force deterministic output for this model
# max_tokens = 1024        # cap output length
# [routes.param_policy]
# mode = "deny"
# allow = ["max_tokens"]   # callers may still lower max_tokens
[[routes.targets]]
provider = "openai"
model = "gpt-4o"

[[routes]]
model = "claude"
strategy = "round_robin"
[[routes.targets]]
provider = "anthropic"
model = "claude-sonnet-4-20250514"

# a self-hosted pool of vllm instances balanced with cache-aware routing
[[routes]]
model = "llama"
strategy = "cache_aware"
[[routes.targets]]
provider = "vllm-1"
model = "meta-llama/Llama-3.1-8B-Instruct"
[[routes.targets]]
provider = "vllm-2"
model = "meta-llama/Llama-3.1-8B-Instruct"

# weighted routing: send 3x as much traffic to the first target as the second
# (smooth weighted round-robin — proportional but evenly interleaved)
[[routes]]
model = "llama-weighted"
strategy = "weighted"
[[routes.targets]]
provider = "vllm-1"
model = "meta-llama/Llama-3.1-8B-Instruct"
weight = 3
[[routes.targets]]
provider = "vllm-2"
model = "meta-llama/Llama-3.1-8B-Instruct"
weight = 1

# composable pipeline: filter → weighted-score → argmax. blends the target
# weight, in-flight load, and prefix-cache affinity scorers into one decision —
# the foundation future cost/latency/kv-cache scorers plug into
[[routes]]
model = "llama-pipeline"
strategy = "pipeline"
[[routes.targets]]
provider = "vllm-1"
model = "meta-llama/Llama-3.1-8B-Instruct"
weight = 2
[[routes.targets]]
provider = "vllm-2"
model = "meta-llama/Llama-3.1-8B-Instruct"
weight = 1

# weighted variants: A/B, canary, and key-split traffic under one schema. a
# request samples one variant by weight (the primary) and, on failure, falls
# back to the remaining variants in declared order; within a variant the
# targets are tried in order. variant-level params (below) layer over the
# route-level params. the chosen variant name is attributed in request logs
# (the `variant` column) for A/B analysis. a route uses variants instead of the
# top-level targets/strategy pool.
# [[routes]]
# model = "chat"
# [[routes.variants]]
# name = "control"
# weight = 9
# [[routes.variants.targets]]
# provider = "openai"
# model = "gpt-4o"
# [[routes.variants]]
# name = "canary"
# weight = 1
# [[routes.variants.targets]]
# provider = "anthropic"
# model = "claude-sonnet-4-20250514"

# --- provider groups: unify a fleet under one address (ADR-0017 addendum) ---
# run several same-kind providers (e.g. self-hosted vLLM boxes with distinct
# base_urls/creds) and address them all as `group-slug/model`. a request pins
# the group and fans out across its members with `strategy`, honoring each
# member's own credentials, key pool, and cooldowns. the slug shares the
# provider slug namespace (a provider slug wins a tie), and membership is
# many-to-many, so overlapping scopes work (msk / nsk / all).
# [[provider_groups]]
# name = "vLLM Cluster MSK"
# slug = "vllm-cluster-msk"    # optional; derived from name when omitted
# strategy = "weighted"
# [[provider_groups.members]]
# provider = "vllm-msk-1"      # provider name; forwards the requested model as-is
# weight = 3
# [[provider_groups.members]]
# provider = "vllm-msk-2"
# model = "qwen3-awq"          # optional upstream rewrite; omit for passthrough
# weight = 1

# --- virtual keys clients present to the gateway ---
# remove this section to run open (no auth) in local development

[[virtual_keys]]
key = "sk-rolter-dev"
name = "local-dev"
models = []           # empty = all models allowed
# providers = ["openai"] # optional upstream allow-list; empty = all providers
disabled = false # revoke without deleting
# expires_at = "2027-01-01T00:00:00Z"   # rfc3339; key stops working at/after this
# cache = false   # per-key response-cache override, independent of a route's opt-in:
#                 # omit to inherit the route, false to bypass, true to cache even on
#                 # a non-opted-in route (the global [cache] switch is still required)

# --- per-model token pricing (usd per million tokens) ---
# drives cost_usd on each request log; models without a price log cost 0
# [[model_prices]]
# model = "gpt-4o"
# input_per_mtok = 2.5
# output_per_mtok = 10.0
# cached_input_per_mtok = 1.25   # optional; defaults to input_per_mtok
# currency = "USD"               # optional; defaults to the base currency below

# --- currency and conversion rates ---
# spend and budgets accumulate in `base`. a model priced in any other currency is
# converted through this table before it reaches a budget counter, so pricing in
# eur while budgeting in usd is exact rather than silently off by the fx rate.
#
# codes are open strings, not an enum: iso-4217 today, a crypto or custom
# settlement unit tomorrow. adding one means adding a rate row and nothing else.
# a rate is "how many base units one unit of this currency is worth". the base
# itself is always 1.0 and needs no row.
#
# a model price in a currency with no rate is a *config error*, not a warning:
# charging face value bills the wrong number and charging zero bills nothing.
# static rates are also the only air-gapped-safe source, which is why they are
# the default and not a live fx feed.
#
# this table is also what the dashboard's currency chooser offers: the base
# followed by every code below. adding a row here is the whole of "make RUB
# selectable" — there is no list to edit in the frontend.
# [currency]
# base = "USD"
# rates = { EUR = 1.09, GBP = 1.27, RUB = 0.011 }

# --- spend caps (enforced against redis-tracked cost) ---
# a request is blocked with 402 when any matching budget's spend has reached its
# limit (most-restrictive-wins across the scope chain). requires --redis-url;
# without redis, budgets fail open. `id` matches the request's virtual-key scope
# ids (org/team/project/virtual-key id); config keys carry no scope, so these
# target database-defined keys.
# [[budgets]]
# scope = "org"        # org | team | project | key
# id = "org-uuid"
# limit_usd = 500.0
# period = "monthly"   # monthly (default) | daily | total
# this budget's own answer to unpriced traffic, overriding the deployment-wide
# unpriced_policy below. omit it to inherit. resolution is most-restrictive-wins
# across the scope chain and against the deployment setting, so a budget can
# tighten what the deployment asked for but never loosen it:
# unpriced_policy = "block"   # ignore | warn | block

# what to do about traffic the gateway cannot price. a model with no
# [[model_prices]] row accrues zero spend, so it can never exceed a budget no
# matter how much is served — budgets do not apply to it at all. this decides
# that deliberately instead of passing silently:
#   ignore  serve it, accrue nothing (default: an upgrade must not start
#           refusing traffic for a deployment that has priced nothing yet)
#   warn    serve it, but log the model once per hour and treat the budget as
#           an incomplete accounting
#   block   refuse at admission with 402, before any upstream tokens are spent
# the built-in fake-llm is answered locally, before pricing, so `block` never
# takes it away.
# unpriced_policy = "ignore"

# --- throughput caps (redis sliding window, per-minute) ---
# a request is rejected with 429 (+ retry-after) when a matching limit's
# trailing-minute request or token count has reached its cap (most-restrictive-
# wins across the scope chain). requires --redis-url; without redis, limits fail
# open. `id` matches the request's virtual-key scope ids, like budgets above.
# [[rate_limits]]
# scope = "key"        # org | team | project | key
# id = "vk-uuid"
# rpm = 600            # requests per minute; omit to leave requests uncapped
# tpm = 150000         # tokens per minute; omit to leave tokens uncapped

# --- upstream retry policy ---
# on a transient upstream failure (http 408/429/5xx or a connection error) the
# gateway re-picks a target (excluding ones already tried, so retries fail over
# to sibling targets) and forwards again. backoff is exponential with jitter; a
# 429 retry-after header (whole seconds) overrides the computed delay. retries
# only happen before any body bytes reach the client. defaults shown below.
# [retry]
# max_retries = 2         # extra attempts after the first; 0 disables retries
# base_backoff_ms = 100   # base delay for the first retry
# max_backoff_ms = 2000   # ceiling for the backoff delay

# --- per-target cooldowns ---
# after a target returns a transient failure (http 429/5xx or a connection
# error) it is parked for base_secs (or the 429 retry-after, capped at max_secs)
# and the balancer skips it so healthy siblings absorb the load. when every
# sibling is parked the gateway fails open and still forwards. defaults shown.
# [cooldown]
# base_secs = 5     # how long a failing target is parked; 0 disables cooldowns
# max_secs = 300    # ceiling for a cooldown derived from a 429 retry-after

# --- upstream timeouts ---
# connect_secs bounds establishing the connection; request_secs bounds time to
# response headers (not the body, so long SSE streams are never cut short). a
# timeout surfaces as a transient error and feeds the retry/cooldown paths. set
# a field to 0 to disable it. defaults shown below.
# [timeouts]
# connect_secs = 10
# request_secs = 60

# --- per-provider queues and backpressure ---
# each provider gets an independent bounded request queue and worker set, so a
# slow or unavailable upstream cannot exhaust gateway admission capacity for
# healthy providers. workers limit concurrent waits for response headers; SSE
# bodies still stream directly to the client after headers arrive. defaults:
# [queue]
# enabled = true
# capacity = 256             # waiting requests per provider
# workers = 8                # concurrent header requests per provider
# backpressure = "error"      # drop | block | error
# block_timeout_ms = 1000     # only used by backpressure = "block"

# --- active upstream health checks ---
# when enabled, a background task periodically issues a lightweight GET
# {api_base}{path} to each provider; a provider that times out, fails to connect,
# or answers 5xx is marked unhealthy and the balancer skips its targets until a
# later probe recovers it (any non-5xx status, incl. 401/404, counts as healthy).
# when every target of a route is unhealthy the gateway fails open. disabled by
# default. defaults shown below.
# [health]
# enabled = false
# interval_secs = 10   # seconds between probe sweeps
# timeout_secs = 2     # per-probe timeout
# path = "/"           # appended to each provider's api_base when probing

# --- per-target circuit breaker ---
# complements the short per-failure cooldown with a longer-lived state machine.
# after failure_threshold consecutive transient failures a target trips OPEN and
# is skipped for open_secs; the first request after that window probes it
# (half-open), a success closes the breaker and a failure re-opens it. where a
# cooldown shrugs off one wobble, the breaker sheds load off a target that is down
# hard. when every target of a route is open the gateway fails open. disabled by
# default. defaults shown below.
# [breaker]
# enabled = false
# failure_threshold = 5   # consecutive failures that trip a target open; 0 disables
# open_secs = 30          # how long a tripped target stays open before a probe

# --- upstream engine metrics scrape ---
# when enabled, a background task periodically pulls each provider's prometheus
# {api_base}{path} and parses the scheduler queue depth (vLLM
# num_requests_waiting, SGLang/TGI fallbacks). the depth is folded into the
# balancer's in-flight load view so load-aware strategies (power_of_two,
# pipeline) steer away from backed-up engines. disabled by default; a scrape
# failure or missing metric contributes zero depth. defaults shown below.
# [metrics_scrape]
# enabled = false
# interval_secs = 5    # seconds between scrape sweeps
# timeout_secs = 2     # per-scrape timeout
# path = "/metrics"    # appended to each provider's api_base when scraping

# --- exact-match response cache (ROL-56, streaming: ROL-235) ---
# when enabled (and a redis url is configured), a successful response is stored
# in redis keyed by the exact request (path + post-injection body); an identical
# later request is served from the cache with no upstream call and an
# `x-rolter-cache: HIT` header. both non-streaming JSON and streaming SSE
# responses are cached: a streaming miss is buffered in full, stored, and
# replayed instantly on a later hit. this is a global master switch — a route
# only caches when it ALSO opts in via its own [routes.cache] table below.
# with no redis, or redis unreachable, every request is a miss (fail open).
# disabled by default. defaults shown below.
# [cache]
# enabled = false
# default_ttl_secs = 60        # entry TTL; overridable per route
# namespace = "rolter:cache"   # redis key prefix for cache entries
# max_entry_bytes = 1048576    # skip caching bodies larger than this (0 = no limit)
#
# per-route opt-in (nested under a [[routes]] entry):
# [routes.cache]
# enabled = true       # cache this route (global [cache] switch must also be on)
# ttl_secs = 600       # optional TTL override; falls back to default_ttl_secs
# per_key = false      # true isolates cached entries per virtual key
# [routes.cache.semantic]
# provider = "openai"               # configured provider used for embeddings
# model = "text-embedding-3-small"
# threshold = 0.92                   # cosine similarity required for a hit
# max_candidates = 256               # bounded recent-entry scan per route/key

# Post-response usage accounting: adding a request's cost to its budget counters
# and its tokens to its rate-limit windows. Both write to Redis, so both run off
# the response path — through a bounded queue, not an unbounded detached task per
# request, so a slow counter store sheds records instead of accumulating them.
# Overflow is counted by rolter_usage_records_dropped_total; depth is reported by
# rolter_usage_records_queued. Inert without a Redis url.
[usage_recording]
# records waiting to be written before new ones are dropped
# queue_capacity = 10000
# concurrent writers draining the queue; each record is one Redis round trip, so
# a single consumer would serialise them
# workers = 4

[logging]
# request logs are written asynchronously in batches, off the request hot path;
# logging is disabled entirely when clickhouse_url is unset
# clickhouse_url = "http://localhost:8123"
# Dashboard UX events (#805): screen views, time-to-interactive, form abandons,
# error states, written to the ui_events table. On by default, unlike
# payload_capture, because the schema is structural only — every column is a key,
# an enum, a duration or an id, so a form value or prompt has nowhere to land.
# Set false to drop them at the ingest endpoint; the stream is inert anyway
# without clickhouse_url.
# ui_events = false
# Raw prompts/completions are sensitive and disabled by default. When enabled,
# redacted bodies are kept in ClickHouse's short-retention request_payloads table.
# [logging.payload_capture]
# enabled = true
# max_bytes = 32768
# redact_fields = ["api_key", "authorization", "password", "secret", "token"]
# models = ["support-agent"]                 # empty means every route
# virtual_key_ids = ["key-uuid"]             # empty means every virtual key

# Model presets can be declared in two tiers when the control plane uses Postgres.
# [[models.readonly]] stays config-owned and cannot be edited in the dashboard.
# [[models.default]] is seeded once into the default DB project, then is editable.
# [[models.readonly]]
# model = "company-safe"
# targets = [{ provider = "openai", model = "gpt-4o-mini" }]
# [[models.default]]
# model = "starter-chat"
# targets = [{ provider = "openai", model = "gpt-4o-mini" }]
# batch_max = 1000        # flush once a batch reaches this many rows
# flush_ms = 1000         # also flush a partial batch at least this often
# queue_capacity = 10000  # rows are dropped (and counted) when this queue is full

# Where the gateway may send upstream traffic. A provider's api_base is
# operator-supplied, so without a destination policy a crafted or compromised
# provider row turns the gateway into an SSRF primitive aimed at whatever sits
# inside its network position — cloud instance metadata being the classic
# target. IP literals are classified at config validation; hostnames are
# classified at connect time against the address DNS actually returned, which
# is what makes this rebinding-safe.
# [egress]
# block_link_local = true         # 169.254.0.0/16, fe80::/10 — cloud instance
#                                 # metadata. on by default
# block_loopback = false          # 127.0.0.0/8, ::1. off by default: sidecar and
#                                 # single-host deployments serve on localhost
# block_private = false           # 10/8, 172.16/12, 192.168/16, fc00::/7. off by
#                                 # default: on-prem clusters are the common case
# allow_hosts = ["vllm.internal.example.com"]  # exempt from every check above,
#                                 # matched verbatim on the url host

# Built-in regex guardrails and PII redaction, evaluated in-gateway with no
# external service. Disabled by default; a disabled block adds no hot-path cost.
# Patterns use the linear-time (RE2-style) engine and are compiled with bounded
# size at config validation, so an invalid/unbounded pattern fails at startup.
# [guardrails]
# enabled = true
# max_scan_bytes = 262144         # cap on request text scanned per request
# streaming_post_call = "reject"  # reject | passthrough. output masking needs the
#                                 # whole completion, so it cannot run on an SSE
#                                 # stream: a match can straddle any number of
#                                 # frames. `reject` (the default) refuses a
#                                 # streamed request on a route that has post_call
#                                 # rules; `passthrough` serves the stream with
#                                 # output rules not applied. only matters when a
#                                 # post_call rule exists
# [[guardrails.rules]]
# name = "email"
# builtin = "email"               # or: pattern = "<custom regex>"
# stage = "pre_call"              # pre_call scans the request, post_call masks
#                                 # the (non-streamed) response before delivery
# action = "redact"               # annotate | block | redact
# replacement = "[REDACTED:EMAIL]"  # defaults to the built-in entity token
# include_system = false          # also scan system/developer messages
# [[guardrails.rules]]
# name = "card"
# builtin = "payment_card"        # email | phone | api_token | payment_card
# action = "block"                # reject with an OpenAI-compatible error
# [[guardrails.rules]]
# name = "leaked-key"             # output stage: mask anything key-shaped the
# builtin = "api_token"           # model echoes back, before the client sees it
# stage = "post_call"
# action = "redact"
#
# per-route overrides layer on top of the global rule set above. rules are named,
# so adding a rule globally still reaches every route that has not opted out of
# it by name. `enable` wins over `disable` for the same rule. a name no rule
# defines is a config error, not a silent no-op — a typo in `disable` would
# otherwise read as "this rule is off here" while the rule kept running.
# [[routes]]
# model = "internal-support-bot"
# [routes.advanced.guardrails]
# disable = ["email"]             # this route legitimately handles addresses
# enable  = ["card"]

# Custom guardrail webhook: consult a self-hosted semantic guardrail service
# (e.g. Guardrails AI, LLM Guard) before proxying. Vendor-neutral; disabled by
# default. The service returns allow/block/transform/annotate. Secrets are read
# from the environment at call time, never inlined here.
# [guardrail_webhook]
# enabled = true
# url = "https://guard.internal/check"
# stage = "pre_call"              # post_call is validated but not yet enforced
# timeout_ms = 2000
# max_retries = 0                 # extra attempts on a transient failure
# failure_mode = "fail_open"      # fail_open | fail_closed
# max_body_bytes = 65536          # oversized content is sent as a truncated preview
# auth = { bearer = { token_env = "GUARD_TOKEN" } }
#                                 # or: { shared_secret = { secret_env = "GUARD_SECRET" } }

# External PII sanitizer: hand request (and optionally response) content to a
# self-hosted de-identification service — Presidio, or anything speaking the same
# small JSON contract — before it reaches the provider. The service replaces each
# detected entity with a deterministic placeholder and keeps the
# placeholder -> plaintext mapping on its own side, handing back an opaque
# restoration token. The mapping never enters rolter, so there is nothing in a
# gateway log, metric or span to leak. Disabled by default.
# [pii_sanitizer]
# enabled = true
# url = "https://presidio.internal/sanitize"
# restore_url = "https://presidio.internal/restore"
#                                 # required unless restoration = "never"
# direction = "request"           # request | response | both. `request` is the
#                                 # point of the feature: keep PII away from a
#                                 # third-party model
# restoration = "never"           # never | trusted_downstream | caller_authorized.
#                                 # `never` (the default) means placeholders reach
#                                 # the caller and nothing is ever reversed.
#                                 # `caller_authorized` reverses only when the
#                                 # request carries `x-rolter-pii-restore: true`
# streaming = "reject"            # reject | passthrough. restoring or sanitizing a
#                                 # response needs the whole body, so it cannot run
#                                 # on an SSE stream; `reject` refuses a streamed
#                                 # request while the response leg is active,
#                                 # `passthrough` serves the stream with that leg
#                                 # not applied. only matters when the response leg
#                                 # is active — a request-only setup always streams
# timeout_ms = 5000
# max_retries = 0                 # extra attempts on a transient failure
# failure_mode = "fail_open"      # fail_open forwards the *unsanitized* body when
#                                 # the service is down; fail_closed refuses with
#                                 # 502 pii_sanitizer_unavailable. Pick fail_closed
#                                 # if the sanitizer is a compliance control
# max_body_bytes = 262144         # oversized content is sent as a truncated preview
# entities = ["EMAIL_ADDRESS", "PERSON", "CREDIT_CARD"]
#                                 # empty = whatever the service is configured for
# auth = { bearer = { token_env = "PII_SANITIZER_TOKEN" } }

# Versioned prompt templates and route decorators. Centrally-managed system
# instructions applied at admission without granting callers prompt-authoring
# rights. Disabled by default. Each template is one immutable version; the
# operator lists exactly the versions to activate. Callers pass variable values
# in a `rolter_template_vars` object (stripped before forwarding); substitution
# is structural, so a value can never inject extra message structure.
# [prompt_templates]
# enabled = true
# [[prompt_templates.templates]]
# id = "support-preamble"
# version = 3
# routes = ["gpt-4o"]             # omit for all routes
# [[prompt_templates.templates.variables]]
# name = "persona"
# default = "a helpful support assistant"   # or: required = true
# [[prompt_templates.templates.decorators]]
# role = "system"                 # system | assistant | user
# position = "prepend"            # prepend | append
# content = "You are {{persona}}. Follow the company policy and be concise."
