      <rect x="28.40" y="56.40" width="6.2" height="6.2" rx="1" fill="#ff4017"></rect>
  </g>

  <text x="360" y="293" font-family="Geist Variable, Geist, sans-serif" font-size="132" font-weight="600" letter-spacing="-5" fill="#fafafa">rolter</text>
  <text x="364" y="353" font-family="Geist Variable, Geist, sans-serif" font-size="24" font-weight="400" letter-spacing="-0.1" fill="#a1a1aa">OpenAI- and Anthropic-compatible AI gateway and load balancer</text>
  <rect x="364" y="387" width="72" height="3" rx="1.5" fill="#ff4017"></rect>

  <text x="364" y="445" font-family="Geist Mono Variable, Geist Mono, monospace" font-size="22" font-weight="400" letter-spacing="0.4" fill="#93939e">github.com/rolter-ai/rolter</text>
</svg>
