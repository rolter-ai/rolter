[package]
name = "rolter-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "repository traits and storage backends for rolter — internal crate, no stable rust api"

[dependencies]
rust_decimal.workspace = true
rolter-core.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
sqlx = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# only the `test-support` schema guard needs a runtime of its own, to drop a
# schema from `Drop`, which cannot await
tokio = { workspace = true, optional = true }

# postgres / redis / clickhouse backends land behind feature flags; see ROADMAP
[features]
default = []
# per-test schema isolation for downstream crates' postgres tests; a dev-only
# feature that adds nothing to a production build
test-support = ["dep:tokio"]
# the optional dependencies are named with `dep:` so they do not also become
# implicit features of their own: `postgres` is the only way to turn them on,
# and `cargo hack --each-feature` covers every combination that exists (#1442)
postgres = [
  "dep:sqlx",
  "sqlx/json",
  "dep:uuid",
  "dep:chrono",
  "dep:serde",
  "dep:serde_json",
  "dep:aes-gcm",
  "dep:sha2",
  "dep:tracing",
]

[dev-dependencies]
tokio = { workspace = true }
# unit tests generate their credentials at run time rather than writing them out
uuid.workspace = true
