[package]
name = "rolter-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "rolter data-plane gateway (openai/anthropic-compatible proxy) — internal crate, no stable rust api"

[[bin]]
name = "rolter-gateway"
path = "src/main.rs"

[dependencies]
rolter-core.workspace = true
rolter-balancer.workspace = true
rolter-proxy.workspace = true
rolter-auth.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
uuid.workspace = true
reqwest.workspace = true
redis.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
arc-swap.workspace = true
dashmap.workspace = true
crossbeam-queue.workspace = true
parking_lot.workspace = true
zeromq.workspace = true
rmpv.workspace = true
anyhow.workspace = true
tracing.workspace = true
clap.workspace = true
chrono.workspace = true
scalar_api_reference = { version = "0.2.2", default-features = false }

[dev-dependencies]
libc.workspace = true
criterion.workspace = true
# a capturing layer, so the tenant attributes are asserted to land on the span
# rather than assumed from the call site (#836)
tracing-subscriber.workspace = true

# criterion benches use their own harness; `cargo bench -p rolter-gateway`
[[bench]]
name = "admission"
harness = false
