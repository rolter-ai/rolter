[package]
name = "rolter-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "rolter data-plane gateway (openai/anthropic-compatible proxy) — internal crate, no stable rust api"

[[bin]]
name = "rolter-gateway"
path = "src/main.rs"

[dependencies]
rolter-core = { workspace = true, features = ["shutdown"] }
rolter-balancer.workspace = true
rolter-proxy.workspace = true
rolter-auth.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
uuid.workspace = true
reqwest.workspace = true
redis.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
sha2.workspace = true
xxhash-rust.workspace = true
arc-swap.workspace = true
dashmap.workspace = true
crossbeam-queue.workspace = true
parking_lot.workspace = true
zeromq.workspace = true
rmpv.workspace = true
anyhow.workspace = true
tracing.workspace = true
clap.workspace = true
chrono.workspace = true
scalar_api_reference = { version = "0.2.12", default-features = false }
# O_NOFOLLOW and O_NONBLOCK for the one open of a local guardrail model, so
# a FIFO swapped in under model_root cannot block a reload (#3454)
libc.workspace = true

[dev-dependencies]
# a paused clock, so a timing test asserts virtual time rather than a wall-clock
# bound a loaded runner can cross (#3416)
tokio = { workspace = true, features = ["test-util"] }
# `cli_guard`: every secret-bearing env flag must hide its value in `--help`
# (#2793); `test_pipeline`: the exported attempt spans are asserted (#3535)
rolter-core = { workspace = true, features = ["cli-guard", "test-pipeline"] }
criterion.workspace = true
# a capturing layer, so the tenant attributes are asserted to land on the span
# rather than assumed from the call site (#836)
tracing-subscriber.workspace = true

# criterion benches use their own harness; `cargo bench -p rolter-gateway`
[[bench]]
name = "admission"
harness = false

# hot-path benches with allocation counting (#1054)
[[bench]]
name = "hot_path"
harness = false
