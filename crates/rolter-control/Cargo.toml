[package]
name = "rolter-control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "rolter control plane: management api and static ui host — internal crate, no stable rust api"

[[bin]]
name = "rolter-control"
path = "src/main.rs"

[[bin]]
name = "rolter-seed"
path = "src/bin/seed.rs"
required-features = ["postgres"]

[dependencies]
rolter-core.workspace = true
rolter-store.workspace = true
rolter-auth.workspace = true
rolter-balancer.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
arc-swap.workspace = true
reqwest.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
clap.workspace = true
subtle.workspace = true
# the same embedded Scalar reference the gateway serves at /docs, so the
# control-plane schema renders without a CDN in an air-gapped deployment
scalar_api_reference = { version = "0.2.2", default-features = false }
parking_lot.workspace = true
async-trait.workspace = true
sqlx = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
chrono.workspace = true
# the bootstrap import re-parses the file as raw TOML to tell a written
# `[logging.payload_capture]` from serde's default one (#954)
toml.workspace = true
jsonwebtoken = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
ldap3 = { workspace = true, optional = true }

[dev-dependencies]
# the sso tests stand up a stub identity provider and need to mint id tokens;
# the key is generated per test run rather than checked in
# `getrandom` supplies `Generate::generate()`, which draws the test signing key
# straight from the system RNG; 0.14 deprecated `SecretKey::random` and its
# `rand_core` re-export no longer carries an `OsRng` this graph can reach
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem", "getrandom"] }
# the postgres tests build their isolated schema through the store's guard, so
# a schema is reclaimed when the test finishes (#1364)
rolter-store = { workspace = true, features = ["test-support"] }

[features]
default = []
ldap = ["dep:ldap3"]
postgres = [
  "rolter-store/postgres",
  "dep:sqlx",
  "dep:uuid",
  "dep:argon2",
  "dep:rand",
  "dep:jsonwebtoken",
  "dep:base64",
  "dep:sha2",
]
