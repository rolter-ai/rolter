version = "forwarded"
reviewed_at = "2026-10-27"
conformance = "partial"
gateway_endpoints = [
  "GET /mcp/{server}",
  "POST /mcp/{server}",
  "DELETE /mcp/{server}",
  "GET /mcp/{server}/{path}",
  "POST /mcp/{server}/{path}",
  "DELETE /mcp/{server}/{path}",
]
modules = [
  "crates/rolter-gateway/src/mcp_proxy.rs",
  "crates/rolter-gateway/src/mcp_policy.rs",
  "crates/rolter-proxy/src/lib.rs",
]
supported = [
  "requests, SSE replies and `Mcp-Session-Id` relayed between client and server; the gateway authenticates the client and presents its own credential upstream",
  "a POST naming a tool outside the organization's enabled tool groups is refused with 403 `mcp_tool_denied` before anything is forwarded (see `json-rpc`)",
  "an upstream 403 whose challenge says `insufficient_scope` is answered with 403 `mcp_insufficient_scope` and a rebuilt `WWW-Authenticate` challenge",
]
deviations = [
  "a POST to a server the organization's tool groups or tool manifest govern, with a `Content-Encoding` other than `identity`, is refused with 415 `mcp_request_unreadable`: the relay decodes no body, so it could not apply the rules to it",
]
omissions = [
  "no protocol-version negotiation: `MCP-Protocol-Version` is relayed, never read",
  "no validation of what an allowed message contains, and none of the server's replies",
  "the deprecated HTTP+SSE transport is relayed like any other request, not implemented",
  "the replies a deprecated HTTP+SSE server sends on its event stream are not matched to the calls posted: a POST it answers 202 with no reply in the body is logged `accepted`",
  "a body forwarded unread to a server no rule governs (encoded, or not JSON) has its calls not itemised: it is counted in `rolter_mcp_unread_bodies_total` and logged as one `unread` row",
]
tests = [
  "crates/rolter-gateway/src/mcp_proxy.rs::proxy_replaces_client_auth_and_preserves_path_query_and_body",
