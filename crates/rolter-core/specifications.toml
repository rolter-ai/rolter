  "guardrails, plugins and the PII sanitizer a route configures may refuse or rewrite a request or response; with none configured the bodies pass unchanged",
]
tests = [
  "crates/rolter-gateway/tests/integration.rs::non_streaming_request_proxies_upstream_body",
  "crates/rolter-gateway/tests/integration.rs::streaming_request_passes_through_sse",
  "crates/rolter-gateway/tests/integration.rs::output_guardrail_masks_a_non_streaming_completion",
