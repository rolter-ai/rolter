notes = "base, path and auth from the OpenAPI file the reference pages are built from (https://developers.sber.ru/docs/files/openapi/gigachat/api.yml, read 2026-10-29): its servers entry is https://api.giga.chat/v1 and chat completions is POST /v1/chat/completions on https://api.giga.chat, the address the overview names for every user from 17 July 2026 (https://gigachat.devices.sberbank.ru/ is being phased out; #3488). The file's JavaScript SDK sample still writes https://api.giga.chat/api/v1, which disagrees with its own servers and path. GigaChat issues short-lived access tokens from an OAuth endpoint; rolter sends the configured key as the bearer and does not mint one"
tests = [
  "crates/rolter-core/src/config.rs::every_kind_resolves_by_the_documented_rule",
  "crates/rolter-gateway/tests/provider_profiles.rs::gigachat_takes_an_oauth_access_token_as_a_bearer",
]

