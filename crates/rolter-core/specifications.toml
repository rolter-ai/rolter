# The external specification source registry (#907).
#
# One record per external API, protocol, semantic convention or wire format
# rolter implements, translates, emits, parses or validates, and one record per
# `ProviderKind`. The schema is `rolter_core::spec_registry` (every table denies
# unknown keys), the rules are its `validate()`, and the field reference is
# docs/dev-docs/development/spec-registry.md. The served `GET /openapi.json` of
# both planes takes its `externalDocs` and `x-rolter-*` extensions from here,
# and the tables in docs/user-docs/api/specifications.mdx are generated from it
# (`just gen-specs`).
#
# Record what is true today, not what is hoped: where rolter forwards a body it
# does not read, the claim is `transport-only`.

schema_version = 1

# rolter's own endpoints, which implement no external specification. Every
# gateway route is either here or named by a `[[spec]]` record
[native]
gateway_endpoints = [
  "GET /",
  "GET /healthz",
  "GET /readyz",
  "GET /docs",
  "GET /docs/scalar.js",
]

