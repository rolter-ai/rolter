id = "openai-chat-completions"
category = "ai-api"
authority = "OpenAI"
title = "OpenAI Chat Completions"
url = "https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create"
related = [
  "https://developers.openai.com/api/reference/overview",
  "https://developers.openai.com/api/docs/guides/streaming-responses",
  "https://developers.openai.com/api/docs/changelog",
]
contract = "major-only"
version = "v1"
reviewed_at = "2026-10-27"
conformance = "native-passthrough"
gateway_endpoints = ["POST /v1/chat/completions"]
gateway_schemas = [
  "ChatCompletionRequest",
  "ChatCompletionResponse",
  "ChatCompletionChunk",
  "Usage",
]
modules = [
  "crates/rolter-gateway/src/handlers.rs",
  "crates/rolter-proxy/src/lib.rs",
  "crates/rolter-proxy/src/translation.rs",
]
