[package]
name = "rolter-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "shared config model, domain types, errors and telemetry for rolter — internal crate, no stable rust api"

[dependencies]
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
serde_ignored.workspace = true
toml.workspace = true
thiserror.workspace = true
regex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
rustls-pki-types.workspace = true
# the egress check classifies the host the http client will dial, which is
# only the host a WHATWG parser reads (#1953)
url.workspace = true
# `gethostname`, the only portable way to ask the host its own name; there is
# no std wrapper and a shell-launched process has no `HOSTNAME` to read (#1644)
libc.workspace = true
# only for `cli_guard`, the `--help` hygiene check the binaries run in their own
# tests (#2793); no production build enables the feature that pulls it in
clap = { workspace = true, optional = true }

# opentelemetry otlp export, behind the default `otlp` feature so a build can
# opt out of the tonic/prost/reqwest exporter stack when it is not needed
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
# only for `runtime::Handle`, to read the scheduler's own metrics (#834). the
# otlp stack already pulls tokio in through opentelemetry_sdk's rt-tokio, so
# this names an existing graph edge rather than adding one
tokio = { workspace = true, optional = true }

[features]
default = ["otlp"]
otlp = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
  "dep:opentelemetry-appender-tracing",
  "dep:tokio",
]
# `rolter_core::cli_guard`: walks a clap `Command` and names every argument that
# prints a secret from the environment in `--help`. Enabled by the binary
# crates' dev-dependencies, so it is test support and never in a release build
cli-guard = ["dep:clap"]

[dev-dependencies]
criterion.workspace = true
# in-memory span and log exporters, so the #809 trace-correlation guarantee is
# asserted rather than assumed from a dependency default
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# `#[tokio::test]` for the scheduler-metrics assertions (#834)
tokio = { workspace = true }
# unit tests generate their credentials at run time rather than writing them out
uuid.workspace = true

# criterion benches use their own harness; `cargo bench -p rolter-core`
# runs them, `cargo bench --no-run` just compiles them (CI guards this)
[[bench]]
name = "snapshot"
harness = false

[[bench]]
name = "pii_sanitizer"
harness = false
