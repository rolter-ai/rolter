[package]
name = "rolter-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "upstream provider forwarding and translation for rolter — internal crate, no stable rust api"

[dependencies]
rolter-core.workspace = true
reqwest.workspace = true
tokio.workspace = true
bytes.workspace = true
serde_json.workspace = true
dashmap.workspace = true
futures-util.workspace = true
arc-swap.workspace = true
tracing.workspace = true
# a connector-level tower layer is the only place hyper's connection pool is
# observable from outside; see `pool` in lib.rs (#834)
tower.workspace = true

[dev-dependencies]
criterion.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }

# criterion benches use their own harness; `cargo bench -p rolter-proxy`
# runs them, `cargo bench --no-run` just compiles them (CI guards this)
[[bench]]
name = "translate"
harness = false
