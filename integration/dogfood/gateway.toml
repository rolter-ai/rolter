# Minimal gateway bootstrap for the dogfooding stack (#924).
#
# Deliberately declares no providers and no routes: everything is added through
# the dashboard so the add/edit/delete flows are the thing being tested. A
# provider declared here would be merged in as a read-only "config model" that
# the operator cannot edit in the UI, which is the opposite of the point.
#
# `dogfood.toml` beside this file is the full fleet, kept as the reference an
# operator copies from (and for `rolter-seed --import` when a populated
# dashboard is wanted instead).

[server]
host = "0.0.0.0"
port = 4000

# The gateway writes request logs here; the dashboard's analytics screens read
# the same table through the control plane's CLICKHOUSE_URL. Without this the
# analytics screens stay empty with nothing to say why (#929).
[logging]
clickhouse_url = "http://127.0.0.1:8123"

# Raw prompt and completion capture, on **here and only here** (#954).
#
# The shipped default is off, and stays off: rolter proxies other people's
# traffic, so a default that records prompt text would have every deployment
# retaining user content — PII included — without the operator having chosen
# to. That is the kind of thing found during an audit rather than during setup.
#
# The dogfooding stack is the exception that is unambiguously safe: it runs
# against fake and self-owned providers with no real user data, and payload
# visibility is the whole point of dogfooding the Logs screen. Enabling it here
# means the drawer shows real request and response bodies out of the box
# instead of an empty panel the operator has to go and switch on.
#
# The guardrails still apply and are worth exercising too: `max_bytes` truncates,
# and `redact_fields` strips the named JSON keys *before* the write, so a
# redacted value never reaches storage.
[logging.payload_capture]
enabled = true
max_bytes = 32768
redact_fields = ["authorization", "api_key", "password"]
