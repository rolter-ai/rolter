[[providers.readonly]]
name = "vllm-a100-03"
kind = "openai_compatible"
api_base = "http://127.0.0.1:18005"

[[providers.readonly]]
name = "vllm-h100-01"
kind = "openai_compatible"
api_base = "http://127.0.0.1:18006"
api_key_env = "DOGFOOD_VLLM_H100_01"

[[providers.readonly]]
name = "vllm-h100-02"
kind = "openai_compatible"
api_base = "http://127.0.0.1:18007"

[[providers.readonly]]
name = "vllm-h100-03"
kind = "openai_compatible"
api_base = "http://127.0.0.1:18008"
api_key_env = "DOGFOOD_VLLM_H100_03"

[[providers.readonly]]
name = "vllm-l40s-01"
kind = "openai_compatible"
