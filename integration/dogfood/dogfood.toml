# Dogfooding fleet (#924) — pairs with `integration/dogfood/fleet.ts`.
#
#   bun integration/dogfood/fleet.ts        # the 15 fake upstreams
#   source integration/dogfood/keys.env     # the keys they expect
#   cargo run -p rolter-store --features postgres --bin rolter-seed -- \
#       --import integration/dogfood/dogfood.toml
#
# The point of this file is that every routing strategy has a route an operator
# can actually exercise, against targets whose latencies differ enough that the
# strategies visibly disagree. A fleet of identical targets makes every strategy
# look the same and the routing screens untestable.

# `bind` is not a key rolter reads: the config lint warns on it and the gateway
# silently keeps its default. host/port are the real keys.
[server]
host = "0.0.0.0"
port = 4000

# The gateway writes request logs here; the dashboard's analytics screens read
# the same table through the control plane's CLICKHOUSE_URL.
[logging]
clickhouse_url = "http://127.0.0.1:8123"

# Raw prompt and completion capture, on **here and only here** (#954).
#
# The shipped default is off, and stays off: rolter proxies other people's
# traffic, so a default that records prompt text would have every deployment
# retaining user content — PII included — without the operator having chosen
# to. That is the kind of thing found during an audit, not during setup.
#
# The dogfooding stack is the exception that is unambiguously safe: it runs
# against fake and self-owned providers with no real user data, and payload
# visibility is the whole point of dogfooding the Logs screen. On here, the
# detail drawer shows real request and response bodies out of the box instead
# of an empty panel the operator has to go and switch on.
#
# `ln --import` applies this section to the `logging_settings` row, which is
# what the gateway actually reads once a control plane is in the picture. The
# guardrails are worth exercising too: `max_bytes` truncates, and
# `redact_fields` strips the named JSON keys *before* the write, so a redacted
# value never reaches storage.
[logging.payload_capture]
enabled = true
max_bytes = 32768
redact_fields = ["authorization", "api_key", "password"]

# ── the hosted-shaped half ───────────────────────────────────────────────────
# every provider below is in the explicit `readonly` tier (ADR-0022): the bare
# `[[providers]]` array is the deprecated spelling of the same thing, and this
# file is what a new operator reads before writing their own (#1657). the
# `default` tier is not an option here — a config file on the *control* plane
# flips it onto MergedConfigStore, which drops db-created virtual keys from the
# snapshot (#623) and 401s every key this stack mints (#1650)
# named and keyed the way each vendor does it, so they can be added through the
# dashboard as an OpenAI provider and an OpenRouter provider respectively

[[providers.readonly]]
name = "openai-edge"
kind = "openai"
api_base = "http://127.0.0.1:18001"
api_key_env = "DOGFOOD_OPENAI_KEY"

# Serves OpenRouter's `vendor/model` names and exercises the openrouter dialect
# against a local endpoint. The kind is pinned to openrouter.ai by default so a
# config edit cannot redirect a real key; `allow_custom_api_base` is the
# deliberate opt-out from that pin (#925, ADR-0029), which is exactly what a
# local fake needs. `rolter check` reports this provider, as intended.
[[providers.readonly]]
name = "openrouter-edge"
kind = "openrouter"
api_base = "http://127.0.0.1:18002"
api_key_env = "DOGFOOD_OPENROUTER_KEY"
allow_custom_api_base = true

# ── the self-hosted half ─────────────────────────────────────────────────────
# one model per instance, like a real vllm deployment. roughly half sit behind
# a key and half do not, which is what a mixed trusted/untrusted subnet gives

[[providers.readonly]]
name = "vllm-a100-01"
kind = "openai_compatible"
api_base = "http://127.0.0.1:18003"
api_key_env = "DOGFOOD_VLLM_A100_01"

[[providers.readonly]]
name = "vllm-a100-02"
kind = "openai_compatible"
