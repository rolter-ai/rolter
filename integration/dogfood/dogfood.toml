api_key_env = "DOGFOOD_TEI_EMBED_02"

# ── provider groups ────────────────────────────────────────────────
# a self-hosted fleet is addressed as `group-slug/model` (ADR-0017 addendum), so
# a client names the pool rather than one box. three of them, because the
# interesting cases are the overlapping ones: `vllm-a100` is the whole rack,
# `vllm-a100-fast` the subset without the slow card, and two providers sit in
# both.
#
# the explicit `readonly` tier, not the deprecated bare `[[provider_groups]]`
# array (ADR-0022). the harness runs the control plane config-less and this
# file reaches the database through `rolter-seed --import`. The importer reads
# the readonly tier and writes those rows to the DB, where the dashboard can
# edit them — the tier governs what the *gateway* treats as config-owned, not
# what the importer may write. Handing this file to the control plane as its
# ROLTER_CONFIG would work (since #623 its MergedConfigStore keeps db-minted
# virtual keys, checked in #2834), but every readonly row would then be
# config-owned and locked in the dashboard, and the `default` tier it would
# unlock is seeded once and then editable, which is what the import does
# already.
#
# Seeding is also the only way to get a group in front of the data plane at all
# right now: a group created through the dashboard never bumps config_version,
# so it does not propagate until the gateway restarts (#1643). And once a group
# does route, it does not yet fan out — every request lands on the first member
# regardless of strategy or weights (#1655) — so the weights below describe the
# intent rather than today's behaviour, and they are what the fix should be
# measured against.

[[provider_groups.readonly]]
name = "vLLM A100 rack"
slug = "vllm-a100"
strategy = "weighted"
[[provider_groups.readonly.members]]
provider = "vllm-a100-01"
weight = 3
[[provider_groups.readonly.members]]
provider = "vllm-a100-02"
weight = 1
# the ~4x slower card. kept in the rack-wide group so the weights have something
# visibly wrong to correct for
[[provider_groups.readonly.members]]
provider = "vllm-a100-03"
weight = 1

# the same rack minus the slow card. membership is many-to-many, so 01 and 02
# are in both groups and a client picks the scope it wants
[[provider_groups.readonly]]
name = "vLLM A100 fast"
slug = "vllm-a100-fast"
strategy = "round_robin"
[[provider_groups.readonly.members]]
provider = "vllm-a100-01"
[[provider_groups.readonly.members]]
provider = "vllm-a100-02"

# the hosted-shaped edge as a pool of one: what an operator has after adding a
# vendor and before adding a second region, and the case that proves group
# addressing also works for a model name with no vendor prefix
[[provider_groups.readonly]]
name = "OpenAI edge pool"
slug = "openai-pool"
strategy = "round_robin"
[[provider_groups.readonly.members]]
provider = "openai-edge"

# ── routes ───────────────────────────────────────────────────────────────────
# one per strategy worth looking at, on the pool that makes it legible

[[routes]]
model = "gpt-4o"
strategy = "round_robin"
[[routes.targets]]
provider = "openai-edge"
model = "gpt-4o"

[[routes]]
model = "gpt-4o-mini"
strategy = "round_robin"
[[routes.targets]]
provider = "openai-edge"
model = "gpt-4o-mini"

[[routes]]
model = "claude-sonnet-4"
strategy = "round_robin"
[[routes.targets]]
provider = "openrouter-edge"
model = "anthropic/claude-sonnet-4"

[[routes]]
model = "llama-3.1-8b"
strategy = "round_robin"
[[routes.targets]]
provider = "vllm-a100-01"
model = "meta-llama/Llama-3.1-8B-Instruct"
[[routes.targets]]
provider = "vllm-a100-02"
model = "meta-llama/Llama-3.1-8B-Instruct"
[[routes.targets]]
provider = "vllm-a100-03"
model = "meta-llama/Llama-3.1-8B-Instruct"

# same pool, cache-aware: a repeated prefix should stick to one target
[[routes]]
model = "llama-3.1-8b-cached"
strategy = "cache_aware"
[[routes.targets]]
provider = "vllm-a100-01"
model = "meta-llama/Llama-3.1-8B-Instruct"
[[routes.targets]]
provider = "vllm-a100-02"
model = "meta-llama/Llama-3.1-8B-Instruct"
[[routes.targets]]
provider = "vllm-a100-03"
model = "meta-llama/Llama-3.1-8B-Instruct"

# a100-03 is ~4x slower than its pair, so `fastest` should starve it
[[routes]]
model = "llama-3.1-8b-fastest"
strategy = "fastest"
[[routes.targets]]
provider = "vllm-a100-01"
model = "meta-llama/Llama-3.1-8B-Instruct"
[[routes.targets]]
provider = "vllm-a100-02"
model = "meta-llama/Llama-3.1-8B-Instruct"
[[routes.targets]]
provider = "vllm-a100-03"
model = "meta-llama/Llama-3.1-8B-Instruct"

[[routes]]
model = "qwen-32b"
strategy = "power_of_two"
[[routes.targets]]
provider = "vllm-h100-01"
model = "Qwen/Qwen2.5-32B-Instruct"
[[routes.targets]]
provider = "vllm-h100-02"
model = "Qwen/Qwen2.5-32B-Instruct"

# the strategy that shipped in #912 — ranks per request rather than per target
[[routes]]
model = "mistral-7b"
strategy = "predicted_latency"
[[routes.targets]]
provider = "vllm-h100-03"
model = "mistralai/Mistral-7B-Instruct-v0.3"
[[routes.targets]]
provider = "vllm-l40s-01"
model = "mistralai/Mistral-7B-Instruct-v0.3"

# 3:1 split, and the two targets are near-identical in speed, so the split is
# attributable to the weights rather than to latency
[[routes]]
model = "gemma-27b"
strategy = "weighted"
[[routes.targets]]
provider = "vllm-l40s-02"
model = "google/gemma-2-27b-it"
weight = 3
[[routes.targets]]
provider = "vllm-l40s-03"
model = "google/gemma-2-27b-it"
weight = 1

# one flaky target and one slow one: the interesting failure case
[[routes]]
model = "deepseek-r1"
strategy = "adaptive"
[[routes.targets]]
provider = "vllm-spot-01"
model = "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B"
[[routes.targets]]
provider = "vllm-spot-02"
model = "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B"

[[routes]]
model = "text-embedding"
strategy = "round_robin"
[[routes.targets]]
provider = "tei-embed-01"
model = "BAAI/bge-large-en-v1.5"
[[routes.targets]]
provider = "tei-embed-02"
model = "intfloat/e5-mistral-7b-instruct"
