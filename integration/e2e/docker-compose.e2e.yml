# full-stack e2e topology: datastores + control + gateway (DB-snapshot mode) +
# a fleet of fake-vLLM engines (llm-d-inference-sim). unlike docker/docker-compose.yml
# this runs the gateway in snapshot mode (no static rolter.toml) and turns RBAC on
# by setting ROLTER_ADMIN_TOKEN, so the harness can exercise per-user roles.
#
# secrets here are throwaway test values, never real credentials.
name: rolter-e2e

# the sim and the rolter binaries run on distroless (no shell/wget), so they carry
# no container healthcheck; the Python harness polls their host-published ports
# for real readiness (rolter_e2e/stack.py wait_healthy + the smoke's model warmup).
x-sim: &sim
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.0
  restart: unless-stopped
  # deterministic-ish random text; served over the openai + anthropic surfaces
  command: ["--model", "rolter-dummy", "--port", "8000", "--mode", "random"]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rolter
      POSTGRES_PASSWORD: rolter
      POSTGRES_DB: rolter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolter"]
      interval: 3s
      timeout: 2s
      retries: 20
    # ephemeral: no named volume, so every `up` starts from a clean db

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    volumes:
      - ../../clickhouse:/docker-entrypoint-initdb.d
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    # the alpine clickhouse HTTP port can bind late; the native client is the
    # reliable readiness signal.
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # --- fake-vLLM fleet: three engines, later grouped into clusters by the tests ---
  sim-a: { <<: *sim }
  sim-b: { <<: *sim }
  sim-c: { <<: *sim }

  control:
    # the same image the gateway runs — one image carries all three binaries and
    # the services differ only by `command`. sharing the tag keeps compose to a
    # single build; with distinct tags it compiled the identical workspace twice,
    # concurrently, fighting over the same cores.
    image: rolter-e2e-local:latest
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        # control needs its postgres-backed CRUD API + migrations for the e2e
        # scenarios; the shipping image defaults to no features.
        CARGO_FEATURES: postgres
    command: ["rolter-control"]
    ports:
      - "4001:4001"
      # the internal (snapshot) port is published so the harness can assert both
      # sides of the split: the operator token is refused here, and /internal/*
      # is absent from 4001. a real deployment keeps this on a private interface.
      - "4002:4002"
    environment:
      RUST_LOG: info
      # control defaults to a loopback bind since #971; inside a container that
      # leaves the published 4001 port with no listener on eth0, so every host
      # connection resets. safe to widen here: ROLTER_ADMIN_TOKEN is set below
      ROLTER_CONTROL_HOST: 0.0.0.0
      ROLTER_DATABASE_URL: postgres://rolter:rolter@postgres:5432/rolter
      ROLTER_REDIS_URL: redis://redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      # run config-less (pure postgres store): the image bakes
      # ROLTER_CONFIG=/app/rolter.toml, which activates MergedConfigStore — and
      # that store drops db-created virtual keys from the snapshot (see #623),
      # so every runtime-minted key would 401 at the gateway. pointing at a
      # non-existent path makes control skip the bootstrap (Some(path) if
      # path.exists()) and use the DB as the sole source of truth.
      ROLTER_CONFIG: /app/e2e-no-bootstrap.toml
      # RBAC only enforces when an admin token is set; the harness bootstraps as
      # superadmin with this token, then drives per-role users via session tokens.
      ROLTER_ADMIN_TOKEN: e2e-superadmin-token
      # the snapshot carries decrypted provider keys, so it is a separate trust
      # boundary from the operator API (#636): a distinct token gates /internal/*
      # on its own port, and the admin token above no longer opens it.
      ROLTER_INTERNAL_TOKEN: e2e-internal-token
      ROLTER_INTERNAL_ADDR: 0.0.0.0:4002
      # shared with the gateway via the snapshot (control embeds it); virtual keys
      # are stored/matched by hash_key(pepper, key).
      ROLTER_KEY_PEPPER: e2e-key-pepper
      ROLTER_SESSION_PEPPER: e2e-session-pepper
      # envelope key for provider api_key sealing (AES-256-GCM); base64 32 bytes.
      # injected by the harness (rolter_e2e/stack.py) so no key material lives in
      # git; export ROLTER_KEK yourself for a manual `docker compose up`.
      ROLTER_KEK: ${ROLTER_KEK:?set ROLTER_KEK (the harness sets a throwaway test value)}
      # the oidc redirect uri is derived from this, and the identity provider
      # redirects a *browser* there, so it must be the host-published url rather
      # than the compose-internal one
      ROLTER_PUBLIC_URL: http://localhost:4001
    # control needs postgres+redis at boot; clickhouse only receives async log
    # writes, so start-order is enough (don't block boot on the CH HTTP port).
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_started }

  gateway:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        # control needs its postgres-backed CRUD API + migrations for the e2e
        # scenarios; the shipping image defaults to no features.
        CARGO_FEATURES: postgres
    # tag the built image so the opt-in chaos gateway (profile: chaos) can reuse
    # it instead of triggering a second, identical build
    image: rolter-e2e-local:latest
    # DB-snapshot mode: no static config, hot-reload from the control plane.
    command:
      - rolter-gateway
      - --snapshot-url
      - http://control:4002/internal/snapshot
      - --snapshot-poll-secs
      - "2"
      - --redis-url
      - redis://redis:6379
      - --admin-url
      - http://control:4001
    ports:
      - "4000:4000"
    environment:
      RUST_LOG: info
      ROLTER_HOST: 0.0.0.0
      ROLTER_PORT: "4000"
      # admin token so bootstrap CRUD can be proxied through the gateway port too
      ROLTER_ADMIN_TOKEN: e2e-superadmin-token
      # and the internal token for snapshot polls, which control now gates
      # separately from the operator credential (#636)
      ROLTER_INTERNAL_TOKEN: e2e-internal-token
      # MUST match control: the snapshot carries no pepper, so the gateway hashes
      # presented virtual keys with its own ROLTER_KEY_PEPPER to match the stored
      # digest. a mismatch here rejects every key with 401 "invalid api key".
      ROLTER_KEY_PEPPER: e2e-key-pepper
    # plain ordering: control has no container healthcheck (distroless), and the
    # gateway retries its snapshot fetch every 2s until control answers anyway.
    depends_on:
      - control

  # ----------------------------------------------------------------------- #
  # identity provider (issue #714) — opt-in via `--profile idp`. a real         #
  # keycloak, so the sso suite exercises a genuine discovery document, jwks,    #
  # login form and `/`-prefixed realm groups instead of a stub. dev mode: in    #
  # memory, no persistence, cleared with the stack.                             #
  # ----------------------------------------------------------------------- #
  keycloak:
    profiles: ["idp"]
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev"]
    environment:
      # throwaway bootstrap credentials for the admin rest api the harness uses
      # to create the realm; never real ones
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # front-channel urls are minted with this host, which is what the control
      # plane resolves. the harness reaches the same server through the
      # published port and rewrites the host on its own requests, so both sides
      # agree on the issuer without either needing the other's dns
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"

  # ----------------------------------------------------------------------- #
  # chaos / fault-injection harness (issue #620) — opt-in via `--profile     #
  # chaos`. a static-config gateway (chaos/rolter-chaos.toml) tuned for fast, #
  # deterministic resilience assertions, driven against mock upstreams whose  #
  # failure mode is fixed by their FAULT env var. independent of the control  #
  # plane / datastores above, so it starts on its own with just this profile. #
  # ----------------------------------------------------------------------- #
  faulty-ok:
    profiles: ["chaos"]
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "/mock/faulty_upstream.py"]
    environment: { FAULT: "ok" }
    volumes:
      - ./mock:/mock:ro

  faulty-500:
    profiles: ["chaos"]
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "/mock/faulty_upstream.py"]
    environment: { FAULT: "500" }
    volumes:
      - ./mock:/mock:ro

  faulty-500b:
    profiles: ["chaos"]
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "/mock/faulty_upstream.py"]
    environment: { FAULT: "500" }
    volumes:
      - ./mock:/mock:ro

  faulty-429:
    profiles: ["chaos"]
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "/mock/faulty_upstream.py"]
    environment: { FAULT: "429" }
    volumes:
      - ./mock:/mock:ro

  faulty-slow:
    profiles: ["chaos"]
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "/mock/faulty_upstream.py"]
    environment: { FAULT: "slow", SLOW_SECS: "5" }
    volumes:
      - ./mock:/mock:ro

  faulty-flap:
    profiles: ["chaos"]
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "/mock/faulty_upstream.py"]
    environment: { FAULT: "flap" }
    volumes:
      - ./mock:/mock:ro

  gateway-chaos:
    profiles: ["chaos"]
    # reuse the image the main `gateway` service builds (same tag); if built
    # standalone (`--profile chaos build`) this build block produces it too.
    image: rolter-e2e-local:latest
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        CARGO_FEATURES: postgres
    command:
      - rolter-gateway
      - --config
      - /app/rolter-chaos.toml
    ports:
      - "4002:4000"
    environment:
      RUST_LOG: info,rolter_proxy=debug,rolter_balancer=debug
    volumes:
      - ./chaos/rolter-chaos.toml:/app/rolter-chaos.toml:ro
    depends_on:
      - faulty-ok
      - faulty-500
      - faulty-500b
      - faulty-429
      - faulty-slow
      - faulty-flap
