minimum_prek_version = "0.4.11"
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
default_stages = ["pre-commit"]

# fast repository hygiene checks bundled with prek
[[repos]]
repo = "builtin"

# applied migrations are checksummed by sqlx, so a whitespace-only rewrite is
# enough to stop every existing deployment from booting. the two hooks that
# rewrite file contents skip that directory

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]
exclude = "^(crates/rolter-store/migrations/|docs/dev-docs/mermaid\\.min\\.js$)"

[[repos.hooks]]
id = "end-of-file-fixer"
exclude = "^(crates/rolter-store/migrations/|docs/dev-docs/mermaid\\.min\\.js$)"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=no"]
exclude = "^docs/dev-docs/mermaid\\.min\\.js$"

# the vendored mermaid runtime (docs/dev-docs/mermaid.min.js) is a 2.5 MB upstream build
# artifact; the book has to render air-gapped, so it is committed on purpose
[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024"]
exclude = "^docs/dev-docs/mermaid\\.min\\.js$"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "check-merge-conflict"
args = ["--assume-in-merge"]

[[repos.hooks]]
id = "check-symlinks"

[[repos.hooks]]
id = "destroyed-symlinks"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "check-executables-have-shebangs"

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"
args = ["--allow-multiple-documents"]
exclude = "^charts/rolter/templates/"

[[repos.hooks]]
id = "no-commit-to-branch"
args = ["--branch", "master"]

# pin commit message validation for reproducible hook environments
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = [
  "feat",
  "fix",
  "perf",
  "refactor",
  "docs",
  "test",
  "build",
  "ci",
  "chore",
  "revert",
]

# scan staged content with the same project policy used by CI
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"
args = ["--config", ".github/config/gitleaks.toml"]

# project-specific quality gates
[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "bash scripts/prek-rust-gate.sh --staged cargo fmt --all -- --check"
language = "system"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
entry = "bash scripts/prek-rust-gate.sh --staged cargo clippy --workspace --all-targets -- -D warnings"
language = "system"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "actionlint"
name = "actionlint"
entry = "actionlint"
language = "system"
files = "^\\.github/workflows/.*\\.ya?ml$"

[[repos.hooks]]
id = "taplo"
name = "taplo fmt"
entry = "taplo fmt --check --diff"
language = "system"
files = "\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "typos"
name = "typos"
entry = "typos --config .github/config/typos.toml"
language = "system"
types = ["text"]
exclude = "^docs/dev-docs/mermaid\\.min\\.js$"

[[repos.hooks]]
id = "no-agent-session-urls"
name = "no agent session urls in the commit message"
entry = "bash scripts/check-agent-session-urls.sh --file"
language = "system"
stages = ["commit-msg"]

[[repos.hooks]]
id = "migrations-immutable"
name = "migrations are append-only"
entry = "bash scripts/check-migrations-immutable.sh"
language = "system"
files = "^crates/rolter-store/migrations/"
pass_filenames = false

# every `uvx` tool version lives in .github/tool-pins/requirements.txt, where
# dependabot can bump it (#2185); this rejects an inline `uvx tool@x.y.z`
[[repos.hooks]]
id = "tool-pins"
name = "uvx tool pins come from one file"
entry = "bash scripts/check-tool-pins.sh"
language = "system"
files = "^(\\.github/|prek\\.toml$|justfile$|scripts/|docs/dev-docs/development/)"
pass_filenames = false

# relative links in docs/dev-docs/ must resolve; mdBook does not check the ones
# that leave the book (#1926)
[[repos.hooks]]
id = "dev-docs-links"
name = "dev-docs relative links resolve"
entry = "python3 scripts/check-dev-docs-links.py"
language = "system"
files = '^docs/dev-docs/|^scripts/check-dev-docs-links\.py$'
pass_filenames = false

# the other half of the tree ui/'s `format:check` does not reach. it runs the
# whole set rather than the staged files so the hook and the ci job can never
# disagree about what "formatted" means
[[repos.hooks]]
id = "format-docs"
name = "prettier (markdown / json / yaml outside ui/)"
entry = "bash scripts/format-docs.sh --check"
language = "system"
files = "\\.(md|mdx|json|ya?ml)$"
exclude = "^(ui/|charts/rolter/templates/|crates/[^/]+/CHANGELOG\\.md$|CLAUDE\\.md$)"
pass_filenames = false

[[repos.hooks]]
id = "llms-txt"
name = "llms.txt tracks the docs nav"
entry = "bun scripts/gen-llms-txt.ts --check"
language = "system"
files = "^docs/user-docs/(docs\\.json|llms\\.txt|.*\\.mdx)$|^scripts/gen-llms-txt\\.ts$"
pass_filenames = false

# pinned like the ci step; see #2187 / #2185
[[repos.hooks]]
id = "ruff"
name = "ruff (scripts)"
entry = "bash -c 'uvx --from \"$(bash scripts/tool-pin.sh ruff)\" ruff check scripts'"
language = "system"
files = "^(scripts/.*\\.py|ruff\\.toml)$"
pass_filenames = false

# the checker reads the workflows as parsed yaml, so it needs pyyaml; prek
# builds the environment from the script's own inline metadata (PEP 723), the
# same pin `uv run --script` resolves in quality.yml. `--self-test` also runs
# when the checker changes, so a check edited into one that can never fail
# does not get past the commit
[[repos.hooks]]
id = "release-handoff"
name = "release handoff is wired"
entry = "scripts/check-release-handoff.py"
language = "python"
files = "^(\\.github/workflows/(release|release-plz|release-pr-ready|ci)\\.yml|scripts/(check-release-handoff\\.py|wait-for-ci-gate\\.sh))$"
pass_filenames = false

# the self-test's broken fixtures edit the text of the workflows and the wait
# script, so an edit to any of them can leave one with nothing to break
[[repos.hooks]]
id = "release-handoff-self-test"
name = "release handoff checks can still fail"
entry = "scripts/check-release-handoff.py --self-test"
language = "python"
files = "^(\\.github/workflows/(release|release-plz|release-pr-ready|ci)\\.yml|scripts/(check-release-handoff\\.py|wait-for-ci-gate\\.sh))$"
pass_filenames = false

# release-plz.yml's release-gate runs both scripts only on a push to master,
# so this is where they are tested: against a fake gh, curl, cargo and clock
[[repos.hooks]]
id = "release-gate"
name = "release gate scripts against a fake gh"
entry = "bash scripts/test-release-gate.sh"
language = "system"
files = "^scripts/(wait-for-ci-gate|unpublished-crates|test-release-gate)\\.sh$"
pass_filenames = false

# ci-ok's pr-body step reads the body from the api, so its shell only ever ran
# on a real pull request. this runs it, extracted from ci.yml, against a fake gh
[[repos.hooks]]
id = "agent-session-urls"
name = "pr body lookups against a fake gh"
entry = "bash scripts/test-agent-session-urls.sh"
language = "system"
files = "^(\\.github/workflows/ci\\.yml|scripts/(check|test)-agent-session-urls\\.sh)$"
pass_filenames = false

# ci-ok's `edited` fast path reads other ci runs through the api, so its shell
# only runs on an edited pull request. this runs it against a fake gh and clock
[[repos.hooks]]
id = "assert-gate-ran"
name = "ci-ok fast path against a fake gh"
entry = "bash scripts/test-assert-gate-ran.sh"
language = "system"
files = "^(\\.github/workflows/ci\\.yml|scripts/(assert|test-assert)-gate-ran\\.sh)$"
pass_filenames = false

# scripts/fleet/ is what the fleet agents run to claim, board and land a pull
# request. this drives land.sh, claim.sh and board.sh against a fake gh and a
# throwaway git repo, so no change to them reaches a real merge untested. it
# also drives the SessionStart storybook hook in .claude/hooks/
[[repos.hooks]]
id = "fleet-scripts"
name = "fleet scripts against a fake gh"
entry = "bash scripts/test-fleet-scripts.sh"
language = "system"
files = "^(scripts/(fleet/.*\\.sh|test-fleet-scripts\\.sh)|\\.claude/hooks/.*\\.sh)$"
pass_filenames = false

[[repos.hooks]]
id = "project-automation"
name = "board automation retry policy"
entry = "bash scripts/test-project-automation.sh"
language = "system"
files = "^(\\.github/workflows/project-automation\\.yml|scripts/test-project-automation\\.sh)$"
pass_filenames = false

# integration/dogfood/*.sh decide what an operator is told to do next from their
# exit codes and nothing else ran them. this drives them against a stub server
[[repos.hooks]]
id = "dogfood-scripts"
name = "dogfood scripts against a stub server"
entry = "bash scripts/test-dogfood-scripts.sh"
language = "system"
files = "^(integration/dogfood/[^/]+\\.sh|integration/dogfood/creds\\.env|integration/dogfood/signoz/dashboards/.*\\.json|scripts/test-dogfood-scripts\\.sh)$"
pass_filenames = false

[[repos.hooks]]
id = "chart-appversion"
name = "chart appVersion tracks the workspace version"
entry = "python3 scripts/sync-chart-appversion.py"
language = "system"
files = "^(Cargo\\.toml|charts/rolter/Chart\\.yaml)$"
pass_filenames = false

# the same helm lint and strict renders CI runs (scripts/check-helm-chart.sh).
# without helm on PATH the script skips with a notice rather than failing, as
# CI is the authority and not every contributor touches the chart
[[repos.hooks]]
id = "helm-render"
name = "helm chart renders strictly"
entry = "bash scripts/check-helm-chart.sh"
language = "system"
files = "^(charts/|scripts/(check-helm-chart\\.sh|check-rendered-manifests\\.py|check-chart-update-check\\.py)$)"
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy-postgres"
name = "cargo clippy (postgres)"
entry = "bash scripts/prek-rust-gate.sh cargo clippy -p rolter-store --all-targets --features postgres -- -D warnings"
language = "system"
always_run = true
pass_filenames = false
stages = ["pre-push"]

# both push gates below skip a push that touches no rust input (a ui- or
# docs-only push) through scripts/prek-rust-gate.sh, which lists the inputs and
# runs the command whenever the range is unknown. always_run stays on because a
# `files =` filter would miss a push that only deletes a rust file
[[repos.hooks]]
id = "rust-tests"
name = "workspace tests"
entry = "bash scripts/prek-rust-gate.sh bash scripts/prek-rust-tests.sh"
language = "system"
always_run = true
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-deny"
name = "cargo deny"
entry = "bash scripts/prek-rust-gate.sh cargo deny --all-features --config .config/deny.toml check"
language = "system"
always_run = true
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "ui-quality"
name = "ui lint / build"
entry = "bash scripts/prek-ui-quality.sh"
language = "system"
files = "^ui/"
pass_filenames = false
stages = ["pre-push"]
