minimum_prek_version = "0.4.11"
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
default_stages = ["pre-commit"]

# fast repository hygiene checks bundled with prek
[[repos]]
repo = "builtin"

# applied migrations are checksummed by sqlx, so a whitespace-only rewrite is
# enough to stop every existing deployment from booting. the two hooks that
# rewrite file contents skip that directory

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]
exclude = "^(crates/rolter-store/migrations/|docs/mermaid\\.min\\.js$)"

[[repos.hooks]]
id = "end-of-file-fixer"
exclude = "^(crates/rolter-store/migrations/|docs/mermaid\\.min\\.js$)"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=no"]
exclude = "^docs/mermaid\\.min\\.js$"

# the vendored mermaid runtime (docs/mermaid.min.js) is a 2.5 MB upstream build
# artifact; the book has to render air-gapped, so it is committed on purpose
[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024"]
exclude = "^docs/mermaid\\.min\\.js$"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "check-merge-conflict"
args = ["--assume-in-merge"]

[[repos.hooks]]
id = "check-symlinks"

[[repos.hooks]]
id = "destroyed-symlinks"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "check-executables-have-shebangs"

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"
args = ["--allow-multiple-documents"]
exclude = "^charts/rolter/templates/"

[[repos.hooks]]
id = "no-commit-to-branch"
args = ["--branch", "master"]

# pin commit message validation for reproducible hook environments
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = [
  "feat",
  "fix",
  "perf",
  "refactor",
  "docs",
  "test",
  "build",
  "ci",
  "chore",
  "revert",
]

# scan staged content with the same project policy used by CI
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"
args = ["--config", ".github/config/gitleaks.toml"]

# project-specific quality gates
[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt --all -- --check"
language = "system"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
entry = "cargo clippy --workspace --all-targets -- -D warnings"
language = "system"
files = "(^|/)Cargo\\.(toml|lock)$|\\.rs$"
pass_filenames = false

[[repos.hooks]]
id = "actionlint"
name = "actionlint"
entry = "actionlint"
language = "system"
files = "^\\.github/workflows/.*\\.ya?ml$"

[[repos.hooks]]
id = "taplo"
name = "taplo fmt"
entry = "taplo fmt --check --diff"
language = "system"
files = "\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "typos"
name = "typos"
entry = "typos --config .github/config/typos.toml"
language = "system"
types = ["text"]
exclude = "^docs/mermaid\\.min\\.js$"

[[repos.hooks]]
id = "migrations-immutable"
name = "migrations are append-only"
entry = "bash scripts/check-migrations-immutable.sh"
language = "system"
files = "^crates/rolter-store/migrations/"
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy-postgres"
name = "cargo clippy (postgres)"
entry = "cargo clippy -p rolter-store --all-targets --features postgres -- -D warnings"
language = "system"
files = "(^|/)Cargo\\.(toml|lock)$|\\.rs$"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "rust-tests"
name = "workspace tests"
entry = "bash scripts/prek-rust-tests.sh"
language = "system"
always_run = true
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-deny"
name = "cargo deny"
entry = "cargo deny --all-features check --config .config/deny.toml"
language = "system"
always_run = true
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "ui-quality"
name = "ui lint / build"
entry = "bash scripts/prek-ui-quality.sh"
language = "system"
files = "^ui/"
pass_filenames = false
stages = ["pre-push"]
