[workspace]
resolver = "2"
members = [
  "crates/rolter-core",
  "crates/rolter-balancer",
  "crates/rolter-proxy",
  "crates/rolter-store",
  "crates/rolter-auth",
  "crates/rolter-gateway",
  "crates/rolter-control",
  "crates/rolter",
  "ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/rolter-ai/rolter"
authors = ["Ilya Lubenets <lii291001@gmail.com>"]
rust-version = "1.82"

[workspace.dependencies]
# async runtime + web
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = [
  "trace",
  "cors",
  "fs",
  "set-header",
] }
hyper = "1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# linear-time (RE2-style) regex engine for built-in guardrails; no catastrophic
# backtracking, with compile/size limits to bound regex-DoS risk
regex = "1"

# errors + logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }

# opentelemetry otlp trace export (rolter-core `otlp` feature)
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = [
  "grpc-tonic",
  "http-proto",
  "reqwest-client",
  # metrics export (#805): a second exporter over the numbers metrics.rs
  # already computes, alongside the Prometheus endpoint
  "metrics",
] }
tracing-opentelemetry = "0.33"
# otlp log export: bridges `tracing` events onto the OTel Logs API (#809)
opentelemetry-appender-tracing = "0.32"

# http client for upstream forwarding
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "http2",
] }
rustls-pki-types = "1"
bytes = "1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# config change pub/sub between control plane and gateways
redis = { version = "1.3", default-features = false, features = ["tokio-comp"] }

# concurrency primitives
async-trait = "0.1"
arc-swap = "1"
dashmap = "6"
parking_lot = "0.12"
crossbeam-queue = "0.3"
zeromq = "0.6"
rmpv = "1.3"

# misc
rand = "0.10"
ahash = "0.8"
clap = { version = "4", features = ["derive", "env"] }
subtle = "2"
# unix signals, used only by the gateway SIGTERM-drain test
libc = "0.2"

# oidc single sign-on (rolter-control): id-token verification against the
# provider's published jwks. default features drop the pem parser we do not use
# aws_lc_rs, not rust_crypto: the pure-rust `rsa` crate that rust_crypto pulls
# in carries RUSTSEC-2023-0071 (Marvin timing sidechannel) with no patched
# release, and aws-lc-rs is already in the tree under rustls
jsonwebtoken = { version = "11", default-features = false, features = [
  "aws_lc_rs",
  # pem parsing is used by the sso integration test's stub identity provider,
  # which mints id tokens with a key generated per test run
  "use_pem",
] }
base64 = "0.23"

# ldap identity provider (#241). 0.12, not 0.11: the older release pins rustls
# 0.21 / ring 0.16, which carry RUSTSEC-2025-0009 and -0010 and would have been
# a second, stale TLS stack alongside the workspace's rustls 0.23. tls-rustls-ring
# matches the crypto provider rustls already uses here, so ldaps needs no system
# openssl and adds no provider
ldap3 = { version = "0.12", default-features = false, features = [
  "tls-rustls-ring",
] }

# postgres persistence (rolter-store `postgres` feature)
argon2 = "0.6"
sha2 = "0.11"
aes-gcm = "0.11"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "migrate",
  "uuid",
  "chrono",
  "json",
  "macros",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = [
  "serde",
  "clock",
] }

# benchmarks (criterion, dev-dependency only)
criterion = { version = "0.8", features = ["html_reports"] }

# internal crates
# internal deps carry an explicit version (kept in sync with workspace.package
# by release-plz) so they are not wildcard deps and can publish to crates.io
rolter-core = { path = "crates/rolter-core", version = "0.1.0" }
rolter-balancer = { path = "crates/rolter-balancer", version = "0.1.0" }
rolter-proxy = { path = "crates/rolter-proxy", version = "0.1.0" }
rolter-store = { path = "crates/rolter-store", version = "0.1.0" }
rolter-auth = { path = "crates/rolter-auth", version = "0.1.0" }
rolter-gateway = { path = "crates/rolter-gateway", version = "0.1.0" }
rolter-control = { path = "crates/rolter-control", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
