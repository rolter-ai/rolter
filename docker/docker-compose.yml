# the local stack: one command, no secrets, everything reachable. it is open on
# purpose (example postgres login, passwordless redis and clickhouse, management
# plane without an admin token) and is meant for one person on one machine that
# nobody else can reach.
#
# a stack for a team, on one shared host, is the same services closed down and
# fed from an env file. layer docker-compose.team.yml over this file:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.team.yml \
#                  --env-file .env up -d
name: rolter

# the image all three rolter services run. `CARGO_FEATURES=postgres` builds the
# control plane with its postgres-backed store, CRUD API and migrations. the
# Dockerfile defaults to no features, and an image built that way ignores
# ROLTER_DATABASE_URL, keeps everything in memory and has none of the dashboard's
# create, edit and delete screens, however healthy the postgres beside it is
x-rolter-build: &rolter-build
  context: ..
  dockerfile: docker/Dockerfile
  target: runtime
  args:
    CARGO_FEATURES: postgres

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rolter
      POSTGRES_PASSWORD: rolter
      POSTGRES_DB: rolter
    ports:
      # host side overridable: another project's postgres on 5432 is common
      # on a dev machine, and the dogfood stack must not fight it
      - "${ROLTER_PG_HOST_PORT:-5432}:5432"
    volumes:
      # no initdb.d mount: `sqlx::migrate!` owns this schema. postgres would
      # run the migration files itself on first init, outside sqlx's runner,
      # leaving `_sqlx_migrations` empty — the next control/seed startup then
      # replays 0001 onward against a database that already has the final
      # schema and dies on the first non-idempotent statement (#499)
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ../clickhouse:/docker-entrypoint-initdb.d
    # 262144 is ClickHouse's production recommendation. a runtime cannot raise
    # a container above its own hard limit, and rootless docker/podman or a
    # sandboxed runner often sits lower, where creating the container fails with
    # "error setting rlimit type 7: operation not permitted". a dev stack runs
    # fine far lower: set CLICKHOUSE_NOFILE (20000 is known good) there (#1819)
    ulimits:
      nofile:
        soft: ${CLICKHOUSE_NOFILE:-262144}
        hard: ${CLICKHOUSE_NOFILE:-262144}

  gateway:
    build: *rolter-build
    restart: unless-stopped
    command: ["rolter-gateway", "--config", "/app/rolter.toml"]
    ports:
      - "4000:4000"
    environment:
      RUST_LOG: info
      ROLTER_CONFIG: /app/rolter.toml
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # the gateway writes the request, usage and cost rows the control plane's
      # analytics screens read back. it was missing here, so the local stack
      # served traffic into empty dashboards (#929)
      CLICKHOUSE_URL: http://clickhouse:8123
      # follow the control plane: a provider, route or virtual key created in the
      # dashboard reaches this gateway on its next poll (5 s), or at once through
      # redis, instead of this gateway serving the bundled rolter.toml forever.
      # the control plane is open here, so the snapshot needs no token. the
      # gateway starts whether or not the control plane is answering yet and
      # keeps polling until it does
      ROLTER_SNAPSHOT_URL: http://control:4001/internal/snapshot
      ROLTER_REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - clickhouse
      - control

  control:
    build: *rolter-build
    restart: unless-stopped
    command: ["rolter-control"]
    ports:
      - "4001:4001"
    environment:
      RUST_LOG: info
      # a container has to bind every interface to be reachable through the
      # published port; the control plane defaults to loopback so that open
      # mode cannot escape a developer's machine by omission (#970)
      ROLTER_CONTROL_HOST: 0.0.0.0
      # this stack is deliberately open: no admin token, so everyone who reaches
      # port 4001 is a superadmin. binding 0.0.0.0 with no ROLTER_ADMIN_TOKEN is
      # refused unless it is acknowledged, and here it is, on whatever network
      # you run compose on. docker-compose.team.yml sets a token, turns this
      # off and reads its secrets from an env file (#1890)
      ROLTER_ALLOW_OPEN_MODE: "1"
      ROLTER_UI_DIR: /app/ui/dist
      # the dashboard's Playground calls the gateway through /gw/* on this
      # process. the default is localhost:4000, which inside this container is
      # the control plane itself, so every Playground call failed with a 502
      ROLTER_GATEWAY_URL: http://gateway:4000
      # optional: the dashboard refuses to store a provider key until the
      # control plane has a KEK to seal it with. export one before `up`, or put
      # it in docker/.env, to add providers in the dashboard (openssl rand -hex 32)
      ROLTER_KEK: ${ROLTER_KEK:-}
      ROLTER_DATABASE_URL: postgres://rolter:rolter@postgres:5432/rolter
      # connection-pool budget (#1052). left at the defaults here — a local
      # stack has one gateway — but named so the knobs are discoverable from
      # the file operators copy. see .env.example for how to size them
      # ROLTER_DB_MAX_CONNECTIONS: "10"
      # failed-login throttling; counters are shared through redis above (#1079)
      # ROLTER_LOGIN_MAX_FAILURES: "5"
      # ROLTER_LOGIN_IP_MAX_FAILURES: "50"
      # ROLTER_LOGIN_LOCK_SECS: "60"
      # ROLTER_DB_ACQUIRE_TIMEOUT_SECS: "30"
      # the control plane asks github once at boot and every six hours for the
      # latest stable release, so the dashboard footer can hint at a newer one
      # (#902). set "false" on a host that must make no outbound call
      # ROLTER_UPDATE_CHECK: "false"
      ROLTER_REDIS_URL: redis://redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      - postgres
      - redis
      - clickhouse

  # pre-boot validation (#854). behind a profile, so `docker compose up` never
  # runs it: this file is the *local* stack and is deliberately loose, and
  # gating local bring-up on production rules would break the one path that is
  # meant to have no friction.
  #
  # it checks the environment of its own container, which here is nothing, so
  # against this file alone it reports every secret missing. the team shape
  # (docker-compose.team.yml) hands it the same values it hands the control
  # plane, so it judges what will actually run:
  #
  #   docker compose -f docker/docker-compose.yml -f docker/docker-compose.team.yml \
  #                  --env-file .env --profile preflight run --rm preflight
  #
  # it exits non-zero on anything that would start degraded, which is what makes
  # it usable as a deploy gate rather than advice.
  preflight:
    profiles: ["preflight"]
    build: *rolter-build
    command: ["/usr/local/bin/rolter", "check", "--strict"]

volumes:
  pgdata:
  chdata:
