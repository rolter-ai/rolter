name: rolter

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rolter
      POSTGRES_PASSWORD: rolter
      POSTGRES_DB: rolter
    ports:
      - "5432:5432"
    volumes:
      # no initdb.d mount: `sqlx::migrate!` owns this schema. postgres would
      # run the migration files itself on first init, outside sqlx's runner,
      # leaving `_sqlx_migrations` empty — the next control/seed startup then
      # replays 0001 onward against a database that already has the final
      # schema and dies on the first non-idempotent statement (#499)
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ../clickhouse:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["rolter-gateway", "--config", "/app/rolter.toml"]
    ports:
      - "4000:4000"
    environment:
      RUST_LOG: info
      ROLTER_CONFIG: /app/rolter.toml
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # the gateway writes the request, usage and cost rows the control plane's
      # analytics screens read back. it was missing here, so the local stack
      # served traffic into empty dashboards (#929)
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      - redis
      - clickhouse

  control:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["rolter-control"]
    ports:
      - "4001:4001"
    environment:
      RUST_LOG: info
      # a container has to bind every interface to be reachable through the
      # published port; the control plane defaults to loopback so that open
      # mode cannot escape a developer's machine by omission (#970)
      ROLTER_CONTROL_HOST: 0.0.0.0
      # this stack is deliberately open — see the note under `preflight` below.
      # binding 0.0.0.0 with no ROLTER_ADMIN_TOKEN is refused unless it is
      # acknowledged, and here it is: the management plane is wide open on
      # purpose, on whatever network you run compose on
      ROLTER_ALLOW_OPEN_MODE: "1"
      ROLTER_UI_DIR: /app/ui/dist
      ROLTER_DATABASE_URL: postgres://rolter:rolter@postgres:5432/rolter
      # connection-pool budget (#1052). left at the defaults here — a local
      # stack has one gateway — but named so the knobs are discoverable from
      # the file operators copy. see .env.example for how to size them
      # ROLTER_DB_MAX_CONNECTIONS: "10"
      # failed-login throttling; counters are shared through redis above (#1079)
      # ROLTER_LOGIN_MAX_FAILURES: "5"
      # ROLTER_LOGIN_IP_MAX_FAILURES: "50"
      # ROLTER_LOGIN_LOCK_SECS: "60"
      # ROLTER_DB_ACQUIRE_TIMEOUT_SECS: "30"
      # the control plane asks github once at boot and every six hours for the
      # latest stable release, so the dashboard footer can hint at a newer one
      # (#902). set "false" on a host that must make no outbound call
      # ROLTER_UPDATE_CHECK: "false"
      ROLTER_REDIS_URL: redis://redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      - postgres
      - redis
      - clickhouse

  # pre-boot validation (#854). behind a profile, so `docker compose up` never
  # runs it: this file is the *local* stack and is deliberately loose — example
  # postgres credentials, no KEK, management plane wide open — and gating local
  # bring-up on production rules would break the one path that is meant to have
  # no friction.
  #
  # point it at a production environment file to check that environment with the
  # exact binary that will run it:
  #
  #   docker compose -f docker/docker-compose.yml --profile preflight \
  #                  run --rm --env-file /path/to/production.env preflight
  #
  # it exits non-zero on anything that would start degraded, which is what makes
  # it usable as a deploy gate rather than advice.
  preflight:
    profiles: ["preflight"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["/usr/local/bin/rolter", "check", "--strict"]

volumes:
  pgdata:
  chdata:
