# the team shape of the compose stack: one host, management plane closed, every
# secret and datastore credential read from an env file. it is an override, so
# it only says what differs from docker-compose.yml, the open local stack:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.team.yml \
#                  --env-file .env up -d
#
# needs docker compose 2.24 or later for the `!override` and `!reset` tags.
#
# what changes against the local stack:
#
# - the control plane takes an admin token and an internal token, seals provider
#   keys under the KEK, and is no longer in open mode (#1890)
# - the gateway polls the control plane's snapshot with the internal token and
#   the same key pepper, so a virtual key minted in the dashboard works here.
#   /internal/* moves to its own port, 4002, which is not published: the
#   snapshot carries decrypted provider keys and stays on the compose network
# - postgres, redis and clickhouse each have a credential from the env file.
#   only postgres is published, on 127.0.0.1, so `rolter-seed` can reach it
#   from this host; redis and clickhouse are reachable by the services only
# - the control plane is published on ROLTER_CONTROL_HOST, loopback unless the
#   env file says otherwise. put a TLS-terminating proxy in front of it for
#   anything that is not this host. the gateway keeps its public port
# - a baked-in rolter.toml would hand the gateway the public `sk-rolter-dev`
#   virtual key through the snapshot, so docker/rolter.team.toml replaces it
# - its own project name, so the volumes of the local stack are never reused:
#   a database or clickhouse volume keeps the credentials it was first created
#   with, and the local stack's are `rolter`/`rolter` and none
#
# the env file needs these, and `rolter init --env-only` writes the first five:
#
#   ROLTER_KEK ROLTER_ADMIN_TOKEN ROLTER_INTERNAL_TOKEN ROLTER_KEY_PEPPER
#   ROLTER_SESSION_PEPPER
#   ROLTER_PG_PASSWORD ROLTER_REDIS_PASSWORD ROLTER_CLICKHOUSE_PASSWORD
#
# the three datastore passwords end up inside connection URLs, so use hex
# (`openssl rand -hex 24`) rather than anything that needs percent-encoding.
# ROLTER_PG_USER and ROLTER_CLICKHOUSE_USER default to `rolter`. compose stops
# at the first variable that is missing and says which, so a half-filled env
# file fails at `up` and not at runtime.
name: rolter-team

# what the control plane runs with, and what the preflight check is handed so it
# judges the same thing. the gateway gets a subset below: it never sees the
# admin token, the KEK, the session pepper or the postgres credentials
x-rolter-control-env: &rolter-control-env
  ROLTER_KEK: "${ROLTER_KEK:?}"
  ROLTER_ADMIN_TOKEN: "${ROLTER_ADMIN_TOKEN:?}"
  ROLTER_INTERNAL_TOKEN: "${ROLTER_INTERNAL_TOKEN:?}"
  ROLTER_KEY_PEPPER: "${ROLTER_KEY_PEPPER:?}"
  ROLTER_SESSION_PEPPER: "${ROLTER_SESSION_PEPPER:?}"
  ROLTER_DATABASE_URL: "postgres://${ROLTER_PG_USER:-rolter}:${ROLTER_PG_PASSWORD:?}@postgres:5432/rolter"
  ROLTER_REDIS_URL: "redis://:${ROLTER_REDIS_PASSWORD:?}@redis:6379"
  CLICKHOUSE_URL: "http://${ROLTER_CLICKHOUSE_USER:-rolter}:${ROLTER_CLICKHOUSE_PASSWORD:?}@clickhouse:8123"

services:
  postgres:
    environment:
      POSTGRES_USER: "${ROLTER_PG_USER:-rolter}"
      POSTGRES_PASSWORD: "${ROLTER_PG_PASSWORD:?}"
    # the base file publishes on every interface. loopback only here: reachable
    # from this host for rolter-seed, not from the network
    ports: !override
      - "127.0.0.1:${ROLTER_PG_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d rolter']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    # the password reaches redis through the environment and the shell, so it is
    # not spelled out in the container's configured command
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: "${ROLTER_REDIS_PASSWORD:?}"
      # redis-cli reads its password from here, so the healthcheck needs no flag
      REDISCLI_AUTH: "${ROLTER_REDIS_PASSWORD:?}"
    # not published: only the services need it
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  clickhouse:
    environment:
      # a user other than `default` makes the image drop the passwordless
      # default user, and its initdb scripts then run as this one
      CLICKHOUSE_USER: "${ROLTER_CLICKHOUSE_USER:-rolter}"
      CLICKHOUSE_PASSWORD: "${ROLTER_CLICKHOUSE_PASSWORD:?}"
    # not published: only the services need it
    ports: !reset []
    # /ping answers without credentials. clickhouse listens on IPv4 only, so the
    # check cannot say `localhost`, which resolves to ::1 first. the control
    # plane applies the log retention policy once at boot, and a clickhouse that
    # is not up yet costs it that one attempt
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 24

  gateway:
    volumes:
      - ./rolter.team.toml:/app/rolter.toml:ro
    environment:
      # poll the control plane for everything the dashboard manages. it is the
      # internal port, which carries the snapshot and is not published
      ROLTER_SNAPSHOT_URL: http://control:4002/internal/snapshot
      ROLTER_INTERNAL_TOKEN: "${ROLTER_INTERNAL_TOKEN:?}"
      # the snapshot carries no pepper: the gateway digests a presented virtual
      # key with its own, so a value that differs from the control plane's
      # rejects every key with 401
      ROLTER_KEY_PEPPER: "${ROLTER_KEY_PEPPER:?}"
      ROLTER_REDIS_URL: "redis://:${ROLTER_REDIS_PASSWORD:?}@redis:6379"
      CLICKHOUSE_URL: "http://${ROLTER_CLICKHOUSE_USER:-rolter}:${ROLTER_CLICKHOUSE_PASSWORD:?}@clickhouse:8123"
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      control:
        condition: service_started

  control:
    volumes:
      - ./rolter.team.toml:/app/rolter.toml:ro
    environment:
      <<: *rolter-control-env
      # the base file acknowledges open mode. with an admin token set it would
      # change nothing, and leaving it on would be the one line that reopens the
      # plane if the token were ever dropped from the env file
      ROLTER_ALLOW_OPEN_MODE: "0"
      # /internal/* on its own listener: decrypted provider keys never share a
      # port with the dashboard, so a proxy in front of 4001 cannot forward them
      ROLTER_INTERNAL_ADDR: 0.0.0.0:4002
    # the published side is what decides who can reach the control plane. the
    # process inside has to bind every interface for the gateway and the
    # published port to reach it, so ROLTER_CONTROL_HOST in the env file, the
    # value `rolter init` writes, names the address published on the host
    ports: !override
      - "${ROLTER_CONTROL_HOST:-127.0.0.1}:4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # `docker compose ... --env-file .env --profile preflight run --rm preflight`
  # checks the env file against the same rules `rolter check --strict` applies
  # to any production deployment, using the binary that will run it
  preflight:
    volumes:
      - ./rolter.team.toml:/app/rolter.toml:ro
    environment:
      <<: *rolter-control-env
      # the check reads the control plane's bind to judge exposure. inside the
      # container that is 0.0.0.0, which is required, so it is given the
      # published address instead: the one that decides who can connect
      ROLTER_CONTROL_HOST: "${ROLTER_CONTROL_HOST:-127.0.0.1}"
