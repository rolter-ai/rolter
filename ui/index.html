<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Tab icon (#941). All three files are vendored in ui/public and copied
      verbatim into ui/dist by the build — the dashboard must run air-gapped,
      so nothing here may resolve to a CDN.

      The .ico is listed first as the fallback for browsers that do not take an
      SVG icon; those that do prefer the later, more specific type. Without it
      the browser falls back to requesting /favicon.ico anyway and 404s.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>rolter</title>
    <!--
      Link preview (#855). The image is vendored at ui/public/og.png and copied
      verbatim into ui/dist by the build, for the same reason as the icons
      above: a dashboard behind an air gap must not resolve an asset to a host
      it cannot reach. Its source is assets/og.svg — regenerate with
      `bun scripts/render-og.ts`, and see user-docs/community/brand.mdx before
      changing what it shows.

      The paths stay root-relative. The control plane serves the SPA from its
      own origin under a hostname only the operator knows, so an absolute URL
      would be a guess; the scrapers that matter resolve these against the page.
    -->
    <meta name="description" content="rolter — OpenAI- and Anthropic-compatible AI gateway and load balancer." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="rolter" />
    <meta property="og:title" content="rolter" />
    <meta property="og:description" content="OpenAI- and Anthropic-compatible AI gateway and load balancer." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The rolter cross-stitch mark beside the rolter wordmark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="rolter" />
    <meta name="twitter:description" content="OpenAI- and Anthropic-compatible AI gateway and load balancer." />
    <meta name="twitter:image" content="/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
