image:
  repository: ghcr.io/rolter-ai/rolter
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

gateway:
  replicaCount: 2
  service:
    type: ClusterIP
    port: 4000
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  extraEnv: []

control:
  replicaCount: 1
  # address the control plane binds inside the pod. Must stay reachable from
  # the Service, so it is not loopback here — which means an admin token is
  # required: with none set the control plane refuses to start rather than
  # serve an unauthenticated management API to the cluster (#970). Supply one
  # through `secretEnv` as ROLTER_ADMIN_TOKEN.
  host: 0.0.0.0
  service:
    type: ClusterIP
    port: 4001
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # kubernetes probes. The two endpoints answer different questions and are
  # wired to different probes on purpose:
  #   /healthz — liveness. The process is up and the runtime is not wedged. It
  #     checks no dependency, so a Postgres outage can never restart the fleet.
  #   /readyz  — readiness. The Postgres pool hands out a connection, every
  #     embedded migration is applied, and ROLTER_KEK parses when it is set.
  #     Redis and ClickHouse are degraded-not-unready. A failure removes the
  #     pod from the Service and nothing more.
  # Alert on /readyz staying down; alert on /healthz flapping.
  probes:
    readiness:
      periodSeconds: 5
      # ~30s of unreadiness before the pod leaves the Service, which rides out
      # a brief database failover instead of draining the whole deployment
      failureThreshold: 6
    startup:
      periodSeconds: 5
      # 5 minutes for first-boot migrations against a cold database before
      # liveness takes over
      failureThreshold: 60
  # PostgreSQL connection pool (#1052). One pool serves everything the control
  # plane does: /internal/snapshot (polled by every gateway in the fleet), the
  # whole dashboard CRUD surface, SCIM, SSO, MCP, and the RBAC guard's
  # per-request membership lookups.
  #
  # Sizing: `maxConnections * control.replicaCount` must stay comfortably under
  # the database's own `max_connections`, leaving headroom for migrations,
  # backups and any other client. Size it against *that* budget, not against
  # gateway count — snapshot polls are short and answer 304 most of the time.
  #
  # Raise it when `rolter_db_pool_acquire_ms` shows waits while
  # `rolter_db_pool_idle` sits at zero and `rolter_db_pool_connections` is
  # pinned to `rolter_db_pool_max`. That combination, and only that, means the
  # ceiling is the bottleneck rather than the database being slow.
  #
  # The values below are what rolter used before any of this was configurable.
  pool:
    maxConnections: 10
    minConnections: 0
    # bounded on purpose: pool exhaustion should surface as a fast,
    # attributable error rather than an opaque stall that looks like a slow
    # database
    acquireTimeoutSeconds: 30
    # 0 on either of these means "never expire"
    idleTimeoutSeconds: 600
    # retire connections so the pool cannot pin itself to one database instance
    # across a failover
    maxLifetimeSeconds: 1800
  # failed sign-ins are counted per account and per client address, and refused
  # before any argon2 work happens (#1079). counters are shared across replicas
  # through `env.redisUrl`; without it each replica holds its own budget, so a
  # multi-replica install wants redis set
  login:
    maxFailures: 5
    ipMaxFailures: 50
    failureWindowSeconds: 900
    # the first lock; each further failure doubles it, up to maxLockSeconds
    lockSeconds: 60
    maxLockSeconds: 900
    # only turn this on when every request arrives through a proxy that
    # overwrites X-Forwarded-For: an unverified header hands an attacker
    # unlimited budgets and the ability to spend somebody else's
    trustForwardedFor: false
  # the control plane asks github once at boot and every six hours whether a
  # newer stable rolter release exists, so the dashboard footer can hint at it
  # (#902). one bounded request carrying nothing but a user-agent; offline is
  # silent. set false for an air-gapped cluster or one that must make no
  # outbound call
  updateCheck: true
  extraEnv: []

config:
  existingConfigMap: ""
  file: |
    [server]
    host = "0.0.0.0"
    port = 4000

    [[providers]]
    name = "local"
    kind = "openai_compatible"
    api_base = "http://vllm:8000"

    [[routes]]
    model = "default"
    strategy = "round_robin"

    [[routes.targets]]
    provider = "local"

env:
  rustLog: info
  databaseUrl: ""
  redisUrl: ""
  clickhouseUrl: ""

secretEnv: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rolter.local
      paths:
        - path: /
          pathType: Prefix
          service: gateway
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# pre-boot validation (#854). an initContainer runs `rolter check` against the
# exact environment the workload will get, so a misconfigured release fails at
# rollout instead of starting degraded. the pod never becomes ready if it fails.
preflight:
  enabled: true
  # fail on warnings too — see the template for why this is the default
  strict: true
  # also probe that the datastores accept a TCP connection. off by default: it
  # turns a config check into a network check, and a transient DNS blip during a
  # rollout would then block a release that is fine
  connect: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
