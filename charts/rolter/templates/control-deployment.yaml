{{- $controlEnv := include "rolter.controlEnv" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rolter.fullname" . }}-control
  labels:
    {{- include "rolter.labels" . | nindent 4 }}
    app.kubernetes.io/component: control
spec:
  replicas: {{ .Values.control.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rolter.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control
  template:
    metadata:
      annotations:
        checksum/config: {{ .Values.config.file | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
      labels:
        app.kubernetes.io/name: {{ include "rolter.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: control
    spec:
      serviceAccountName: {{ include "rolter.serviceAccountName" . }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "rolter.preflight" (dict "root" . "env" $controlEnv) | nindent 6 }}
      containers:
        - name: control
          image: {{ include "rolter.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["rolter-control"]
          # the chart's own config, not the image's baked /app/rolter.toml: that
          # one is the public example, `sk-rolter-dev` included, and a control
          # plane that loads it hands the key to every gateway (#2408)
          args: ["--config", "/etc/rolter/rolter.toml", "--gateway-url", "http://{{ include "rolter.fullname" . }}-gateway:{{ .Values.gateway.service.port }}"]
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 4001
          env: {{- $controlEnv | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/rolter
              readOnly: true
          # /readyz checks the database and migrations; a failure only takes
          # the pod out of the Service. /healthz is pure liveness and never
          # touches Postgres, so a database blip cannot restart the fleet
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 2
            periodSeconds: {{ .Values.control.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.control.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          # first boot on a cold database runs every migration before the
          # listener opens; liveness is held off until this succeeds so a slow
          # migration is not mistaken for a wedged process
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: {{ .Values.control.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.control.probes.startup.failureThreshold }}
          resources: {{ toYaml .Values.control.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "rolter.configMapName" . }}
