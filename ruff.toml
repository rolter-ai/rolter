# lints the standalone python under scripts/ (#2187). the scripts declare
# `requires-python = ">=3.9"` in their inline metadata, which ruff does not
# read, so the target is pinned here rather than inherited from pyproject.toml
target-version = "py39"
include = ["scripts/**/*.py"]

[lint]
# the defaults (E4, E7, E9, F) plus pyupgrade and import sorting
extend-select = ["UP", "I"]
